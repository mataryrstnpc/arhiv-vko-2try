*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none !important}
html{font-size:calc(20px * var(--scale)); -webkit-text-size-adjust:100%; scroll-behavior:smooth}
body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans); line-height:var(--lh); letter-spacing:var(--ls); word-spacing:var(--ws)}

p{margin:0}
svg{max-width:100%}
:focus-visible{outline:4px solid var(--focus); outline-offset:3px; border-radius:4px}
h1[tabindex="-1"]:focus{outline:none}
.sr{position:absolute !important; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
.wrap{max-width:76rem; margin:0 auto; padding-inline:max(16px,3vw)}
.ic{width:1.2em; height:1.2em; flex:none; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round}
.ic2{width:2.6rem; height:2.6rem; flex:none; stroke:currentColor; fill:none; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; color:var(--primary)}
.muted{color:var(--muted)}

.skip{position:absolute; left:12px; top:0; transform:translateY(calc(-100% - 24px)); z-index:100; background:var(--gold); color:var(--gold-ink); padding:.6rem 1rem; border-radius:8px; font:inherit; font-weight:700; border:0; cursor:pointer}
.skip:focus{transform:translateY(12px)}

/* top strip */
.topbar{background:var(--navy); color:var(--navy-ink); font-size:.8rem}
.topbar .wrap{display:flex; align-items:center; gap:.5rem 1rem; flex-wrap:wrap; padding-block:.4rem}
.topbar .spacer{flex:1}
.topbar button{min-height:42px; padding:0 .8rem; border-radius:8px; border:var(--bw) solid rgba(255,255,255,.28); background:transparent; color:inherit; font:inherit; font-weight:700; cursor:pointer; display:inline-flex; align-items:center; gap:.45rem}
:root[data-scheme="contrast"] .topbar button{border-color:var(--navy-ink)}
.topbar button:hover{border-color:currentColor}
.topbar button[aria-pressed="true"], .topbar button[aria-expanded="true"]{background:var(--gold); color:var(--gold-ink); border-color:var(--gold)}
.eye-btn .ic{width:1.45em; height:1.45em}

/* low-vision panel */
.a11y-panel{background:var(--soft); border-bottom:var(--bw) solid var(--line); font-size:.85rem}
.a11y-panel .wrap{display:flex; flex-wrap:wrap; align-items:center; gap:.6rem 1.6rem; padding-block:.7rem}
.a11y-panel .grp{display:flex; align-items:center; gap:.35rem; flex-wrap:wrap}
.a11y-panel .lbl{font-weight:700; margin-right:.25rem}
.a11y-panel button{min-height:46px; min-width:46px; padding:0 .8rem; border-radius:8px; border:var(--bw) solid var(--line); background:var(--surface); color:var(--ink); font:inherit; font-weight:700; cursor:pointer; display:inline-flex; align-items:center; gap:.4rem}
.a11y-panel button[aria-pressed="true"]{background:var(--primary); color:var(--primary-ink); border-color:var(--primary)}
.a11y-panel .fs-a.s{font-size:.82em} .a11y-panel .fs-a.l{font-size:1.25em}

/* header */
.site-head{background:var(--surface); border-bottom:1px solid var(--line)}
.site-head .wrap{display:flex; align-items:center; justify-content:space-between; gap:1rem 2rem; padding-block:1rem; flex-wrap:wrap}
.brand{display:flex; gap:1rem; align-items:center; color:inherit; text-decoration:none; min-width:0}
.brand:hover{text-decoration:none}
.brand .emblem{width:4.4rem; height:4.4rem; flex:none; filter:drop-shadow(0 4px 8px rgba(10,58,82,.18))}
.brand .t1{display:block; font-family:var(--serif); font-weight:700; font-size:1.18rem; line-height:1.22; max-width:25rem}
.brand .t2{display:block; color:var(--muted); font-size:.85rem; margin-top:.2rem}
.head-contact{display:flex; flex-direction:column; align-items:flex-end; gap:.4rem}
.phone-big{display:inline-flex; align-items:center; gap:.5rem; font-size:1.2rem; font-weight:700; color:var(--ink); text-decoration:none; white-space:nowrap}
.phone-big .ic{color:var(--primary)}
.status{display:inline-flex; align-items:center; gap:.5rem; padding:.25rem .8rem; border-radius:999px; font-weight:700; font-size:.82rem; background:var(--ok-bg); color:var(--ok); border:var(--bw) solid transparent}
:root[data-scheme="contrast"] .status{border-color:currentColor}
.status::before{content:""; width:.6rem; height:.6rem; border-radius:50%; background:currentColor; flex:none}
.status.lunch{background:var(--warn-bg); color:var(--warn)}
.status.closed{background:var(--bad-bg); color:var(--bad)}
@media (max-width:720px){ .head-contact{align-items:flex-start; min-width:0; max-width:100%} .head-right{flex:1 1 auto; min-width:0; max-width:100%} .status{max-width:100%} .brand .emblem{width:3.4rem; height:3.4rem} .brand .t1{font-size:1rem} }

.head-right{display:flex; align-items:center; gap:1.4rem; flex:none}
@media (min-width:1001px){ .site-head .wrap{flex-wrap:nowrap} }
.head-symbols{display:flex; align-items:center; gap:.7rem; padding-right:1.4rem; border-right:1px solid var(--line)}
.head-symbols svg, .head-symbols img{height:3.4rem; width:auto; display:block}
.head-symbols svg{width:3.4rem}
@media (max-width:1000px){ .head-symbols{display:none} }
.brand .logo{width:4.6rem; height:4.6rem; flex:none}
@media (max-width:720px){ .brand .logo{width:3.6rem; height:3.6rem} }

/* nav */
.site-nav{background:var(--nav-bg); position:sticky; top:0; z-index:30}
:root[data-scheme="contrast"] .site-nav{background:#000; border-block:3px solid var(--primary)}
.site-nav .wrap{display:flex; align-items:center}
.site-nav ul{display:flex; list-style:none; margin:0; padding:0; gap:.1rem; overflow-x:auto; scrollbar-width:none}
.site-nav a{display:flex; align-items:center; min-height:3.3rem; padding:0 1.05rem; color:var(--nav-ink); text-decoration:none; font-weight:700; font-size:.95rem; white-space:nowrap; border-bottom:5px solid transparent; border-top:5px solid transparent}
:root[data-scheme="contrast"] .site-nav a{color:var(--primary)}
.site-nav a:hover{background:rgba(255,255,255,.1)}
.site-nav a[aria-current="page"]{border-bottom-color:var(--gold)}
.menu-btn{display:none}
@media (max-width:900px){
  .menu-btn{display:inline-flex; align-items:center; gap:.5rem; min-height:3.3rem; padding:0 .4rem; border:0; background:transparent; color:var(--nav-ink); font:inherit; font-weight:700; cursor:pointer}
  :root[data-scheme="contrast"] .menu-btn{color:var(--primary)}
  .site-nav .wrap{flex-direction:column; align-items:stretch}
  .site-nav ul{display:none; flex-direction:column; padding-bottom:.5rem}
  .site-nav.open ul{display:flex}
  .site-nav a{border:0; border-left:5px solid transparent}
  .site-nav a[aria-current="page"]{border-left-color:var(--gold); background:rgba(255,255,255,.12)}
}
.orn-band{height:28px; background:var(--navy) var(--orn) repeat-x center / 56px 28px}
.orn-line{height:28px; background:var(--orn-soft) repeat-x center / 56px 28px; opacity:.55; border:0; margin:0}
.orn-glyph{width:2.4rem; height:1.2rem; color:var(--gold)}

/* hero */
.hero{position:relative; overflow:hidden; background:linear-gradient(180deg, var(--surface), var(--bg))}
.hero-deco{position:absolute; left:0; right:0; bottom:0; width:100%; height:8rem; color:var(--soft); pointer-events:none}
.hero-inner{position:relative; display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.05fr); gap:2rem 3rem; align-items:center; padding-block:1.8rem 2.8rem}
@media (max-width:900px){ .hero-inner{grid-template-columns:minmax(0,1fr); padding-top:1rem; gap:1.4rem} .hero-text{gap:.75rem} }
.hero-text{display:flex; flex-direction:column; gap:1rem}
.ph.r43{aspect-ratio:4/3}
.album.tilt{transform:rotate(.7deg)}
.kicker{font-size:.8rem; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:var(--gold-text); display:flex; align-items:center; gap:.6rem}
.kicker::before{content:""; width:2.2rem; height:3px; background:var(--gold); border-radius:2px}
.hero h1{font-size:clamp(1.55rem, 3vw, 2.25rem); line-height:1.15}
.hero .lead{font-size:1.06rem; color:var(--muted)}
.btn-row{display:flex; flex-wrap:wrap; gap:.7rem}

/* buttons */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:.55rem; min-height:3.1rem; padding:.6rem 1.3rem; border-radius:8px; font:inherit; font-weight:700; font-size:.95rem; border:var(--bw) solid var(--primary); background:var(--primary); color:var(--primary-ink); cursor:pointer; text-decoration:none; text-align:center; line-height:1.2}
.btn:hover{text-decoration:none; filter:brightness(1.08)}
.btn.ghost{background:var(--surface); color:var(--primary)}
.btn.ghost:hover{background:var(--soft)}
.btn.gold{background:var(--gold); border-color:var(--gold); color:var(--gold-ink)}
.btn.sm{min-height:2.6rem; padding:.35rem .9rem; font-size:.85rem}
.btn.danger{background:transparent; border-color:var(--bad); color:var(--bad)}
.btn[disabled]{opacity:.55; cursor:not-allowed}
.chips{display:flex; flex-wrap:wrap; gap:.5rem}
.chip{min-height:2.6rem; padding:.4rem 1rem; border-radius:999px; border:var(--bw) solid var(--line); background:var(--surface); color:var(--ink); font:inherit; font-size:.85rem; cursor:pointer; text-align:left}
.chip:hover{border-color:var(--primary); color:var(--primary)}
.map-pick{display:flex; flex-wrap:wrap; align-items:center; gap:.5rem; margin:0 0 .7rem}
.map-pick-l{font-weight:700; margin-right:.2rem}

.map-pick .chip .ic{width:1.1rem; height:1.1rem; flex:none}
.map-pick .chip[aria-pressed="true"]{background:var(--primary); border-color:var(--primary); color:var(--primary-ink)}
.map-pick-all{display:inline-flex; align-items:center; gap:.3rem; font-weight:700; margin-left:.3rem}
.map-pick-all .ic{width:1rem; height:1rem}

/* facts strip */
.facts{background:var(--surface); border-block:1px solid var(--line)}
.facts .wrap{display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:0}
@media (max-width:900px){ .facts .wrap{grid-template-columns:repeat(2, minmax(0,1fr))} }
.fact{display:flex; gap:.9rem; align-items:center; padding:1.2rem 1rem; border-left:1px solid var(--line)}
.fact:first-child{border-left:0}
@media (max-width:900px){ .fact:nth-child(3){border-left:0} .fact:nth-child(n+3){border-top:1px solid var(--line)} }
.fact .v{display:block; font-family:var(--serif); font-weight:700; font-size:1.45rem; line-height:1.1; color:var(--primary); font-variant-numeric:tabular-nums}
.fact .k{display:block; font-size:.82rem; color:var(--muted); line-height:1.35}

/* sections */
.section{padding-block:3rem}
.section.alt{background:var(--surface); border-block:1px solid var(--line)}
.sec-head{display:flex; flex-direction:column; gap:.5rem; margin-bottom:1.6rem; max-width:46rem}
.sec-head h2{font-size:clamp(1.55rem, 3vw, 2.1rem)}
.sec-head p{color:var(--muted); font-size:1.02rem}
.page{padding-block:2.4rem 3rem}
.page-head{display:flex; flex-direction:column; gap:.6rem; margin-bottom:2rem; max-width:48rem}
.page-head h1{font-size:clamp(1.8rem, 4vw, 2.6rem)}
.page-head p{color:var(--muted); font-size:1.05rem}
.two{display:grid; grid-template-columns:minmax(0,1.1fr) minmax(0,1fr); gap:2rem 3rem; align-items:center}
@media (max-width:900px){ .two{grid-template-columns:1fr} }
.prose{display:flex; flex-direction:column; gap:1rem; max-width:40rem}
.prose p{font-size:1.02rem}
.ill{display:block; width:100%; height:auto; border-radius:14px}
.panel{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:1.4rem; display:flex; flex-direction:column; gap:.8rem; min-width:0}
.grid3{display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%, 17rem), 1fr)); gap:1.1rem}
.grid4{display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%, 14rem), 1fr)); gap:1.1rem}
.card{background:var(--surface); border:1px solid var(--line); border-top:5px solid var(--accent-line); border-radius:10px; padding:1.3rem; display:flex; flex-direction:column; gap:.6rem}
:root[data-scheme="contrast"] .card{border-top-color:var(--gold)}
.card h3{font-size:1.1rem}
.card p{color:var(--muted); font-size:.93rem}
.why{display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%, 16rem), 1fr)); gap:1rem; margin-top:1.4rem}
.why-item{display:grid; grid-template-columns:auto 1fr; gap:.9rem; align-items:start}
.why-item h3{font-size:1.02rem; font-family:var(--sans)}
.why-item p{color:var(--muted); font-size:.9rem}
.pill{display:inline-flex; align-items:center; padding:.1rem .55rem; border-radius:999px; font-size:.68rem; font-weight:700; letter-spacing:.04em; text-transform:uppercase; background:var(--soft); color:var(--muted); border:1px solid var(--line); vertical-align:middle; font-family:var(--sans)}
.pill.ok{background:var(--ok-bg); color:var(--ok); border-color:transparent}
.pill.warn{background:var(--warn-bg); color:var(--warn); border-color:transparent}
.pill.bad{background:var(--bad-bg); color:var(--bad); border-color:transparent}
.note{display:flex; gap:.6rem; align-items:flex-start; font-size:.85rem; color:var(--muted); background:var(--soft); border-radius:8px; padding:.75rem 1rem}
.empty{color:var(--muted); font-size:.92rem}

/* faq + glossary */
.faq{display:flex; flex-direction:column; gap:.6rem; max-width:52rem}
.faq details{background:var(--surface); border:1px solid var(--line); border-radius:8px}
.faq summary{cursor:pointer; list-style:none; display:flex; justify-content:space-between; align-items:center; gap:1rem; padding:1rem 1.2rem; font-weight:700; font-size:1.02rem; min-height:3.4rem}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+"; font-family:var(--serif); font-size:1.6rem; line-height:1; color:var(--primary); flex:none}
.faq details[open] summary::after{content:"−"}
.faq details[open] summary{border-bottom:1px solid var(--line)}
.faq .ans{padding:1rem 1.2rem 1.2rem; color:var(--muted)}
.faq .ans a{font-weight:700}
.gloss{display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%, 20rem), 1fr)); gap:.9rem}
.gloss dl{margin:0}
.gloss div{background:var(--surface); border:1px solid var(--line); border-left:4px solid var(--leather); border-radius:6px; padding:.9rem 1.1rem}
.gloss dt{font-family:var(--serif); font-weight:700; font-size:1.08rem}
.gloss dd{margin:.25rem 0 0; color:var(--muted); font-size:.93rem}

/* symbols */
.symbols{display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%, 14rem), 1fr)); gap:1.1rem}
.sym{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:1.3rem; display:flex; flex-direction:column; gap:.7rem; align-items:center; text-align:center}
.sym .art{height:9rem; display:grid; place-items:center}
.sym .art svg{width:9rem; height:9rem}
.sym .art svg.flag{width:12rem; height:6rem; box-shadow:0 2px 8px rgba(0,0,0,.15)}
.sym .art img{max-height:9rem; width:auto}
.sym h3{font-size:1rem}
.sym p{color:var(--muted); font-size:.86rem}
.logo-meaning{display:grid; grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr); gap:2rem; align-items:center; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:1.6rem; margin-top:1.2rem}
@media (max-width:800px){ .logo-meaning{grid-template-columns:1fr} }
.logo-meaning svg{width:100%; max-width:15rem; height:auto; justify-self:center}
.logo-meaning ul{margin:0; padding-left:1.1rem; display:flex; flex-direction:column; gap:.5rem}
.logo-meaning li b{font-family:var(--serif)}

/* memo (printable) */
.modal{position:fixed; inset:0; z-index:70; background:rgba(20,16,12,.55); display:grid; place-items:center; padding:1rem; overflow:auto}
.memo{background:#FFFDF8; color:#2A2420; width:min(40rem, 100%); border-radius:8px; padding:1.8rem; display:flex; flex-direction:column; gap:1rem; border:2px solid #7A5A3E; position:relative}
.memo-head{display:flex; gap:1rem; align-items:center; border-bottom:2px solid #B08D4A; padding-bottom:.9rem}
.memo-head svg{width:4.2rem; height:4.2rem; flex:none}
.memo-head b{font-family:var(--serif); font-size:1.15rem; line-height:1.25}
.memo-grid{display:grid; grid-template-columns:1fr auto; gap:1rem 1.4rem; align-items:start}
.memo-grid p{margin:0 0 .5rem}
.memo .k{font-size:.75rem; text-transform:uppercase; letter-spacing:.07em; color:#6B5E50; font-weight:700}
.memo .v{font-size:1.1rem; font-weight:700}
#memo-qr{width:9.5rem; text-align:center; font-size:.72rem; color:#6B5E50}
.other-addr{list-style:none; margin:.1rem 0 0; padding:0; display:flex; flex-direction:column; gap:.35rem}
.other-addr a{display:inline-flex; align-items:center; gap:.5rem; font-weight:700; font-size:1.08rem}
.other-addr .ic{width:1.2rem; height:1.2rem; flex:none}
#memo-qr svg{display:block; width:9.5rem; height:9.5rem; margin:0 auto .4rem}
.memo-actions{display:flex; gap:.6rem; flex-wrap:wrap}
@media (max-width:560px){ .memo-grid{grid-template-columns:1fr} }
@media print{
  body > *:not(#memo-modal){display:none !important}
  #memo-modal{position:static; background:none; padding:0}
  .memo{border:0; width:100%}
  .memo-actions{display:none}
}

/* mobile bottom bar */
.bottom-bar{display:none}
@media (max-width:720px){
  .bottom-bar{display:grid; grid-template-columns:repeat(4, 1fr); position:fixed; left:0; right:0; bottom:0; z-index:38; background:var(--navy); border-top:3px solid var(--gold); padding-bottom:env(safe-area-inset-bottom)}
  .bottom-bar a, .bottom-bar button{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:.15rem; min-height:4rem; color:var(--navy-ink); background:none; border:0; font:inherit; font-size:.72rem; font-weight:700; text-decoration:none; cursor:pointer}
  .bottom-bar .ic{width:1.5rem; height:1.5rem}
  .fab, .side-tab{display:none !important}
  body{padding-bottom:4.4rem}
  .toast{bottom:5.5rem}
}

/* big info cards (home) */
.info-cards{display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:1.2rem}
@media (max-width:900px){ .info-cards{grid-template-columns:1fr} }
.info-card{background:var(--surface); border:1px solid var(--line); border-top:6px solid var(--primary); border-radius:8px; padding:1.5rem; display:flex; flex-direction:column; gap:.6rem}
.info-card .ic-h{display:flex; align-items:center; gap:.7rem; font-size:.85rem; font-weight:700; text-transform:uppercase; letter-spacing:.07em; color:var(--muted)}
.info-card .ic-h .ic{width:1.6rem; height:1.6rem; color:var(--primary)}
.info-card .big{font-family:var(--serif); font-size:1.5rem; font-weight:700; line-height:1.25}
.info-card .sub{color:var(--muted); font-size:1rem}
.info-card .btn{margin-top:auto; align-self:flex-start; min-height:3.4rem; font-size:1.02rem}
.info-card .phone-xl{font-family:var(--serif); font-size:1.6rem; font-weight:700; color:var(--ink); text-decoration:none; white-space:nowrap}
.map-full{position:relative; border-radius:10px; overflow:hidden; border:var(--bw) solid var(--line); background:var(--il-mapbg); height:26rem}
.map-full iframe{position:absolute; inset:0; width:100%; height:100%; border:0}
.map-full > svg{position:absolute; inset:0; width:100%; height:100%}
.map-row{display:flex; flex-wrap:wrap; align-items:center; gap:.6rem 1rem; margin-top:1rem}
.map-row .muted{font-size:.9rem}
.map-row a.lnk{font-weight:700}
.simple-list{list-style:none; margin:0; padding:0; display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%, 18rem), 1fr)); gap:.6rem}
.simple-list li{display:flex; gap:.7rem; align-items:center; background:var(--surface); border:1px solid var(--line); border-radius:6px; padding:.85rem 1rem; font-weight:700}
.simple-list li .ic{color:var(--primary); width:1.4rem; height:1.4rem}
.simple-list li span small{display:block; font-weight:400; color:var(--muted); font-size:.85rem}

/* compact blocks */
.minis{display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%, 16rem), 1fr)); gap:.8rem}
.mini{display:flex; gap:.9rem; align-items:center; background:var(--surface); border:1px solid var(--line); border-left:4px solid var(--accent-line); border-radius:6px; padding:.85rem 1rem; font-weight:700; font-size:.98rem; line-height:1.3}
.mini .ic2{width:2.2rem; height:2.2rem}
.news-mini{list-style:none; margin:0; padding:0; border-top:1px solid var(--line); max-width:52rem}
.news-mini li{border-bottom:1px solid var(--line)}
.news-mini a{display:flex; gap:1.2rem; align-items:baseline; padding:.95rem .2rem; color:var(--ink); text-decoration:none}
.news-mini a:hover b{text-decoration:underline}
.news-mini time{flex:none; min-width:8.5rem; font-size:.82rem; color:var(--gold-text); font-weight:700}
.news-mini b{font-family:var(--serif); font-size:1.05rem}
@media (max-width:640px){ .news-mini a{flex-direction:column; gap:.2rem} }

/* album prints */
.album{position:relative; margin:0; background:var(--surface); padding:.75rem .75rem 0; border:1px solid var(--line); box-shadow:var(--shadow)}
.album .ph{position:relative; aspect-ratio:13/10; overflow:hidden; background:var(--soft)}
.album .ph > svg, .album .ph > img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block}
.album .ph > img{filter:sepia(.14) saturate(.9)}
.album .c{position:absolute; width:1.5rem; height:1.5rem; background:var(--corner); z-index:1}
.album .c.tl{top:0; left:0; clip-path:polygon(0 0,100% 0,0 100%)}
.album .c.tr{top:0; right:0; clip-path:polygon(0 0,100% 0,100% 100%)}
.album .c.bl{bottom:0; left:0; clip-path:polygon(0 0,100% 100%,0 100%)}
.album .c.br{bottom:0; right:0; clip-path:polygon(100% 0,100% 100%,0 100%)}
.album figcaption{font-family:var(--serif); font-style:italic; font-size:.88rem; color:var(--muted); padding:.6rem .2rem .8rem}
.gallery{display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%, 18rem), 1fr)); gap:1.8rem}
.gallery .album:nth-child(3n+1){transform:rotate(-.8deg)}
.gallery .album:nth-child(3n+2){transform:rotate(.6deg)}

/* timeline */
.tl{list-style:none; margin:0; padding:0; position:relative}
.tl::before{content:""; position:absolute; left:3.6rem; top:.4rem; bottom:.4rem; width:3px; background:var(--line)}
.tl li{display:grid; grid-template-columns:7.2rem 1fr; gap:1.2rem; padding-bottom:1.6rem; position:relative}
.tl li::after{content:""; position:absolute; left:calc(3.6rem - 7px); top:2.6rem; width:17px; height:17px; border-radius:50%; background:var(--surface); border:4px solid var(--gold)}
.tl .yr{display:grid; place-items:center; height:2.4rem; border-radius:4px; background:var(--leather); color:var(--leather-ink); font-family:var(--serif); font-weight:700; font-size:1.1rem; position:relative; z-index:1; font-variant-numeric:tabular-nums}
.tl h3{font-size:1.08rem; margin-bottom:.25rem}
.tl p{color:var(--muted); font-size:.95rem}
.tl-short{display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%, 13rem), 1fr)); gap:1rem; list-style:none; margin:0; padding:0}
.tl-short li{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:1.1rem; display:flex; flex-direction:column; gap:.35rem}
.tl-short b{font-family:var(--serif); font-size:1.7rem; color:var(--leather); line-height:1}
.tl-short span{font-size:.92rem}

/* branches */
.branch{display:grid; grid-template-columns:auto 1fr; gap:.8rem; align-items:start}
.branch .pin{width:2.6rem; height:2.6rem; border-radius:50%; background:var(--tint); color:var(--primary); display:grid; place-items:center}
:root[data-scheme="contrast"] .branch .pin{border:2px solid var(--primary)}
.branch h3{font-size:1.02rem; font-family:var(--sans)}
.branch p{color:var(--muted); font-size:.9rem}

/* region */
.region{display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%, 12rem), 1fr)); gap:1rem}
.region .r{display:flex; gap:.8rem; align-items:center; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:1rem}
.region .r b{display:block; font-family:var(--serif); font-size:1.05rem}
.region .r span{display:block; color:var(--muted); font-size:.82rem}

/* map */
.map-wrap{display:grid; grid-template-columns:minmax(0,1.45fr) minmax(0,1fr); gap:1.4rem; align-items:stretch}
@media (max-width:900px){ .map-wrap{grid-template-columns:1fr} }
.map-box{position:relative; border-radius:12px; overflow:hidden; border:var(--bw) solid var(--line); background:var(--il-mapbg); min-height:24rem}
.map-box iframe{position:absolute; inset:0; width:100%; height:100%; border:0}
.map-box > svg{position:absolute; inset:0; width:100%; height:100%}
.map-col{display:flex; flex-direction:column; min-width:0}
.map-col .map-box{flex:1; max-height:min(82vh, 46rem)}
.gis-map{position:absolute; inset:0}
.map-loading{position:absolute; inset:0; display:grid; place-items:center; margin:0; color:var(--muted)}
.map-routes{display:flex; flex-wrap:wrap; align-items:center; gap:.5rem; margin-top:.8rem}
.map-routes .btn{min-height:2.9rem; font-size:.95rem}
.map-routes .btn .ic:last-child{width:.95rem; height:.95rem; opacity:.75}
.pin2-wrap{background:none !important; border:0 !important}
.pin2{position:relative; display:block; width:32px; height:42px; filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
.pin2.main{width:40px; height:52px}
.pin2 svg{display:block; width:100%; height:100%}
.pin2 path{fill:var(--leather, #7B4F33); stroke:#fff; stroke-width:2.5}
.pin2.main path{fill:var(--primary, #7A5A3E)}
.pin2 circle{fill:#fff}
.pin2 b{position:absolute; top:.2rem; right:calc(100% + .3rem); white-space:nowrap; background:#fff; color:#2A2420; font:700 .78rem/1.2 var(--sans); padding:.2rem .45rem; border-radius:6px; box-shadow:0 1px 4px rgba(0,0,0,.25)}
.pin2.main b{right:auto; left:calc(100% + .3rem); top:.35rem; background:var(--primary, #7A5A3E); color:#fff; font-size:.85rem}
.mpop{display:flex; flex-direction:column; gap:.3rem; font:400 .92rem/1.4 var(--sans); color:#2A2420; min-width:12rem}
.mpop b{font-family:var(--serif); font-size:1rem}
.mpop .btn{align-self:flex-start; margin-top:.3rem; color:var(--primary-ink, #fff)}
.mpop-at{position:relative; width:0; height:0}
.mpop.gl{position:absolute; left:0; bottom:46px; transform:translateX(-50%); background:#fff; border-radius:10px; padding:.85rem 2.2rem .85rem 1rem; box-shadow:0 6px 24px rgba(0,0,0,.28); width:max-content; max-width:17rem}
.mpop-at.main .mpop.gl{bottom:56px}
.mpop.gl::after{content:""; position:absolute; left:50%; bottom:-7px; margin-left:-7px; border:7px solid transparent; border-bottom:0; border-top-color:#fff}
.mpop-x{position:absolute; top:.3rem; right:.35rem; width:1.9rem; height:1.9rem; border:0; background:transparent; font-size:1.3rem; line-height:1; color:#6B5E52; cursor:pointer; border-radius:6px}
.mpop-x:hover{background:#F1ECE4}
.pin2{cursor:pointer}
.map-scheme text{font:700 15px var(--sans); fill:var(--ink); paint-order:stroke; stroke:var(--surface); stroke-width:5px}
.map-scheme text.m{fill:var(--primary); font-size:17px}
.map-scheme a:hover path, .map-scheme a:focus path{filter:brightness(1.15)}
.map-cap{position:absolute; left:.8rem; bottom:.8rem; right:.8rem; background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:.6rem .9rem; font-size:.82rem; color:var(--muted); display:flex; gap:.5rem; align-items:flex-start}
.addr-big{font-family:var(--serif); font-size:1.3rem; font-weight:700; line-height:1.35}
.hours{width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums}
.hours th,.hours td{text-align:left; padding:.5rem 0; border-bottom:1px solid var(--line); vertical-align:top; font-weight:400}
.hours td{text-align:right; font-weight:700}
.eyebrow{font-size:.74rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
.map-links{display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%, 9rem), 1fr)); gap:.5rem}

/* news */
.news-list{display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%, 19rem), 1fr)); gap:1.1rem}
.news-item{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:1.3rem; display:flex; flex-direction:column; gap:.5rem}
.news-date{font-size:.8rem; color:var(--gold-text); font-weight:700; letter-spacing:.04em; text-transform:uppercase}
.news-item h3{font-size:1.1rem}
.news-item p{color:var(--muted); font-size:.93rem}
.news-col{display:flex; flex-direction:column; gap:1.1rem; max-width:48rem}

/* links */
.links{display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%, 17rem), 1fr)); gap:1rem}
.link-card{display:flex; gap:.9rem; align-items:flex-start; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:1.1rem; color:var(--ink); text-decoration:none}
.link-card:hover{border-color:var(--primary); text-decoration:none}
.link-card b{display:block; color:var(--primary); font-size:1rem}
.link-card span{display:block; color:var(--muted); font-size:.85rem}

/* footer */
.site-foot{background:var(--navy); color:var(--navy-ink)}
.site-foot .wrap{display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%, 15rem), 1fr)); gap:1.6rem 2.4rem; padding-block:2.4rem 2.8rem; font-size:.88rem}
.site-foot a{color:var(--navy-ink); text-decoration:underline}
.site-foot .ft{font-family:var(--serif); font-weight:700; font-size:1rem; margin-bottom:.5rem; color:var(--gold)}
.site-foot ul{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:.35rem}
.site-foot p{opacity:.92}
.foot-brand{display:flex; gap:.8rem; align-items:center; margin-bottom:.6rem}
.foot-brand svg{width:3rem; height:3rem; flex:none}
.foot-btn{display:inline-flex; align-items:center; gap:.5rem; margin-top:.6rem; min-height:2.8rem; padding:0 1rem; border-radius:8px; background:var(--gold); color:var(--gold-ink); font:inherit; font-weight:700; border:0; cursor:pointer}

/* side feedback tab + drawer */
.side-tab{position:fixed; right:0; top:50%; transform:translateY(-50%); z-index:35; writing-mode:vertical-rl; display:flex; align-items:center; gap:.5rem; padding:1rem .55rem; border-radius:10px 0 0 10px; background:var(--gold); color:var(--gold-ink); border:var(--bw) solid var(--gold); border-right:0; font:inherit; font-weight:700; font-size:.85rem; cursor:pointer; box-shadow:-4px 6px 18px -8px rgba(0,0,0,.4)}
.side-tab .ic{transform:rotate(90deg)}
.side-tab:hover{padding-right:.8rem}
.scrim{position:fixed; inset:0; z-index:44; background:rgba(5,20,28,.45)}
.drawer{position:fixed; top:0; right:0; bottom:0; z-index:45; width:min(32rem, 100%); background:var(--bg); border-left:var(--bw) solid var(--line); display:flex; flex-direction:column; box-shadow:-20px 0 50px -20px rgba(0,0,0,.45)}
.drawer-head{display:flex; align-items:center; gap:.8rem; padding:.9rem 1.1rem; background:var(--navy); color:var(--navy-ink)}
.drawer-head h2{flex:1; font-size:1.15rem}
.drawer-head button{width:2.9rem; height:2.9rem; border-radius:8px; border:2px solid currentColor; background:transparent; color:inherit; cursor:pointer; display:grid; place-items:center}
.drawer .orn-band{height:20px; background-size:40px 20px}
.drawer-body{flex:1; overflow-y:auto; padding:1.1rem; display:flex; flex-direction:column; gap:1.2rem}
.drawer-body h3{font-size:1.08rem}
.tabs{display:flex; gap:.3rem; border-bottom:var(--bw) solid var(--line)}
.tabs button{min-height:2.9rem; padding:0 1rem; border:0; border-bottom:4px solid transparent; background:transparent; color:var(--muted); font:inherit; font-weight:700; cursor:pointer; margin-bottom:calc(-1 * var(--bw))}
.tabs button[aria-selected="true"]{color:var(--primary); border-bottom-color:var(--primary)}

/* rating + forms */
.rate-sum{display:flex; align-items:center; gap:1.1rem; flex-wrap:wrap}
.rate-big{font-family:var(--serif); font-size:2.5rem; font-weight:700; line-height:1}
.stars-static{display:inline-flex; gap:.1rem; color:var(--gold)}
.stars-static .ic{width:1.05rem; height:1.05rem}
.stars-static .on{fill:currentColor}
.dist{display:grid; grid-template-columns:auto 1fr auto; gap:.3rem .6rem; align-items:center; font-size:.8rem; flex:1; min-width:11rem; font-variant-numeric:tabular-nums}
.dist .bar{height:.55rem; border-radius:99px; background:var(--soft); overflow:hidden; border:1px solid var(--line)}
.dist .bar i{display:block; height:100%; background:var(--gold)}
.star-pick{display:flex; gap:.4rem; flex-wrap:wrap}
.star-pick button{width:3.3rem; height:3.3rem; border-radius:10px; border:var(--bw) solid var(--line); background:var(--surface); color:var(--muted); cursor:pointer; display:grid; place-items:center; position:relative; font:inherit}
.star-pick button .ic{width:1.7rem; height:1.7rem}
.star-pick button .n{position:absolute; bottom:.05rem; right:.3rem; font-size:.6rem; font-weight:700}
.star-pick button.on{color:var(--gold); border-color:var(--gold)}
.star-pick button.on .ic{fill:currentColor}
.star-label{min-height:1.5em; font-weight:700}
.form{display:flex; flex-direction:column; gap:.9rem}
.field{display:flex; flex-direction:column; gap:.3rem}
.field label{font-weight:700; font-size:.88rem}
.field input,.field textarea{font:inherit; font-size:1rem; padding:.7rem .85rem; border-radius:8px; border:var(--bw) solid var(--line); background:var(--surface); color:var(--ink); width:100%}
.field textarea{min-height:6rem; resize:vertical}
.field input:focus,.field textarea:focus{outline:none; border-color:var(--primary); box-shadow:0 0 0 4px var(--tint)}
:root[data-scheme="contrast"] .field input:focus, :root[data-scheme="contrast"] .field textarea:focus{outline:4px solid var(--gold)}
.field .hint{font-size:.76rem; color:var(--muted)}
.field .err{font-size:.84rem; color:var(--bad); font-weight:700}
.row2{display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%, 11rem), 1fr)); gap:.9rem}
.success{display:flex; gap:.6rem; align-items:center; background:var(--ok-bg); color:var(--ok); padding:.75rem 1rem; border-radius:8px; font-weight:700}
.entries{display:flex; flex-direction:column; gap:.8rem}
.entry{border:1px solid var(--line); border-radius:10px; padding:.9rem 1rem; display:flex; flex-direction:column; gap:.4rem; background:var(--surface)}
.entry header{display:flex; flex-wrap:wrap; gap:.2rem .7rem; align-items:center}
.entry header span{font-size:.78rem; color:var(--muted)}
.entry p{white-space:pre-line; overflow-wrap:anywhere; font-size:.95rem}
.reply{border-left:4px solid var(--primary); background:var(--soft); padding:.55rem .85rem; border-radius:0 8px 8px 0; font-size:.9rem}
.reply b{display:block; font-size:.74rem; text-transform:uppercase; letter-spacing:.06em; color:var(--primary)}

/* assistant */
.fab{position:fixed; right:max(16px, 2vw); bottom:max(16px, 2vw); z-index:40; min-height:3.8rem; padding:0 1.4rem 0 1rem; border-radius:999px; background:var(--primary); color:var(--primary-ink); font:inherit; font-weight:700; font-size:1rem; border:3px solid var(--gold); box-shadow:0 14px 34px -10px rgba(0,0,0,.45); display:inline-flex; align-items:center; gap:.6rem; cursor:pointer}
.fab .ic{width:1.6rem; height:1.6rem}
.chat{position:fixed; right:max(12px, 1.5vw); bottom:max(12px, 1.5vw); z-index:50; width:min(31rem, calc(100% - 24px)); height:min(46rem, calc(100% - 24px)); background:var(--surface); border:var(--bw) solid var(--line); border-radius:14px; display:flex; flex-direction:column; box-shadow:0 30px 70px -20px rgba(0,0,0,.5); overflow:hidden}
@media (max-width:640px){ .chat{inset:0; width:100%; height:100%; border-radius:0} }
.chat-head{display:flex; align-items:center; gap:.8rem; padding:.8rem 1rem; background:var(--navy); color:var(--navy-ink)}
.chat-head .av{width:2.7rem; height:2.7rem; flex:none}
.chat-head .tt{flex:1; min-width:0}
.chat-head .tt b{display:block; font-family:var(--serif); font-size:1.02rem}
.chat-head .tt span{font-size:.76rem; opacity:.9}
.chat-head button[aria-pressed="true"]{background:var(--gold); color:var(--gold-ink); border-color:var(--gold)}
.chat-head button{min-width:2.8rem; height:2.8rem; border-radius:8px; border:2px solid currentColor; background:transparent; color:inherit; cursor:pointer; display:grid; place-items:center; font:inherit; font-size:.74rem; font-weight:700; padding:0 .5rem}
.chat .orn-band{height:16px; background-size:32px 16px}
.chat-log{flex:1; overflow-y:auto; padding:1rem; display:flex; flex-direction:column; gap:.8rem; background:var(--bg)}
.msg{max-width:90%; padding:.75rem .95rem; border-radius:14px; font-size:.95rem; line-height:1.5; display:flex; flex-direction:column; gap:.5rem; overflow-wrap:anywhere}
.msg.bot{background:var(--surface); border:1px solid var(--line); align-self:flex-start; border-bottom-left-radius:4px}
.msg.me{background:var(--primary); color:var(--primary-ink); align-self:flex-end; border-bottom-right-radius:4px}
.msg ul,.msg ol{margin:0; padding-left:1.2rem}
.msg .tools button{display:inline-flex; align-items:center; gap:.35rem; min-height:2.3rem; padding:0 .7rem; border-radius:8px; border:1px solid var(--line); background:var(--soft); color:var(--ink); font:inherit; font-size:.76rem; font-weight:700; cursor:pointer}
.ai-src{border:1px solid var(--line); border-radius:10px; background:var(--soft); padding:.6rem .7rem; display:flex; flex-direction:column; gap:.4rem}
.ai-src b{font-size:.8rem; letter-spacing:.02em}
.ai-src ol,.ai-src ul{display:flex; flex-direction:column; gap:.35rem; list-style:none; padding:0}
.ai-src li{display:flex; flex-direction:column; font-size:.85rem; line-height:1.35}
.ai-src li a{font-weight:700}
.ai-src small{color:var(--muted); font-size:.74rem}
.ai-src .more{font-size:.8rem; font-weight:700}
.ai-mark{font-size:.72rem; line-height:1.4; color:var(--muted); border-top:1px dashed var(--line); padding-top:.4rem}
.msg > div:not(.ai-src) a[href^="#catalog/"]{display:inline-block; min-width:1.5em; padding:0 .3em; margin-left:.2em; border:1px solid var(--line); border-radius:6px; background:var(--soft); font-size:.78rem; font-weight:700; line-height:1.5; text-align:center; text-decoration:none}
.route-card{border:var(--bw) dashed var(--primary); border-radius:10px; padding:.7rem; display:flex; flex-direction:column; gap:.5rem}
.route-card b{font-size:.85rem}
.typing{display:inline-flex; gap:.3rem; align-items:center; color:var(--muted); font-size:.85rem}
.typing i{width:.45rem; height:.45rem; border-radius:50%; background:currentColor; animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s} .typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25} 40%{opacity:1}}
.chat-foot{border-top:1px solid var(--line); padding:.7rem; display:flex; flex-direction:column; gap:.4rem}
.chat-form{display:flex; gap:.5rem; align-items:flex-end}
.chat-form textarea{flex:1; resize:none; min-height:3.1rem; max-height:9rem; font:inherit; font-size:.95rem; padding:.7rem .85rem; border-radius:8px; border:var(--bw) solid var(--line); background:var(--bg); color:var(--ink)}
.chat-form textarea:focus{outline:none; border-color:var(--primary)}
.chat-form .btn{min-height:3.1rem; padding:0 1rem}
.chat-note{font-size:.72rem; color:var(--muted); text-align:center}

.toast{position:fixed; left:50%; bottom:6.5rem; transform:translateX(-50%); z-index:60; background:var(--ink); color:var(--bg); padding:.8rem 1.2rem; border-radius:10px; font-weight:700; max-width:calc(100% - 32px); text-align:center}
:root[data-scheme="contrast"] .toast{border:3px solid var(--gold); background:#000; color:#fff}

/* admin */
.admin-top{display:flex; flex-wrap:wrap; gap:1rem; align-items:center; justify-content:space-between}
.tiles{display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%, 11rem), 1fr)); gap:1rem}
.tile{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:1.1rem; display:flex; flex-direction:column; gap:.2rem}
.tile .v{font-family:var(--serif); font-size:2rem; font-weight:700; line-height:1.1}
.tile .k{font-size:.82rem; color:var(--muted); font-weight:700}
.tile.attn{border-color:var(--warn); background:var(--warn-bg)}
.seg{display:flex; flex-wrap:wrap; gap:.5rem}
.seg button{min-height:2.9rem; padding:0 1rem; border-radius:8px; border:var(--bw) solid var(--line); background:var(--surface); color:var(--ink); font:inherit; font-weight:700; cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--primary); color:var(--primary-ink); border-color:var(--primary)}
.mod-item{border:1px solid var(--line); border-radius:10px; padding:1rem; display:flex; flex-direction:column; gap:.6rem; background:var(--surface)}
.mod-item .meta{display:flex; flex-wrap:wrap; gap:.4rem .7rem; align-items:center; font-size:.82rem; color:var(--muted)}
.mod-item .meta strong{color:var(--ink); font-size:.95rem}
.qlist{list-style:none; margin:0; padding:0}
.qlist li{display:flex; gap:1rem; justify-content:space-between; padding:.55rem 0; border-bottom:1px solid var(--line); font-size:.9rem}
.qlist li span{color:var(--muted); font-size:.78rem; white-space:nowrap}
.admin-stack{display:flex; flex-direction:column; gap:1.2rem}

/* ===== разделы с вкладками ===== */
.nav-search{margin-left:auto; flex:none; display:inline-flex; align-items:center; gap:.45rem; min-height:2.5rem; padding:0 .95rem; border:1px solid rgba(255,255,255,.4); border-radius:999px; background:transparent; color:var(--nav-ink); font:inherit; font-weight:700; font-size:.9rem; cursor:pointer}
.nav-search:hover{background:rgba(255,255,255,.12)}
:root[data-scheme="contrast"] .nav-search{color:var(--primary); border-color:var(--primary)}
.site-nav a{padding:0 .8rem}
@media (min-width:901px){ .site-nav ul{flex-wrap:wrap; overflow:visible} }
@media (max-width:900px){
  .site-nav .wrap{flex-direction:row; flex-wrap:wrap; align-items:center}
  .site-nav ul{order:3; flex-basis:100%}
}
.hub-tabs{overflow-x:auto; scrollbar-width:thin; margin-bottom:1.8rem; flex-wrap:nowrap}
.hub-tabs button{white-space:nowrap; font-size:.98rem; min-height:3.1rem; padding:0 1rem}
.hub-tabs button:hover{color:var(--ink)}
.hub-tabs button[aria-selected="true"]:hover{color:var(--primary)}
.hub-tabs button:focus-visible{outline:3px solid var(--gold); outline-offset:-3px}
.tab-panel:focus-visible{outline:3px solid var(--gold); outline-offset:8px; border-radius:4px}
.tab-panel h2{font-size:1.45rem; margin-bottom:.9rem}
.tab-panel h2.h-big{font-size:clamp(1.5rem, 3vw, 2rem)}
.hub-grid{display:grid; grid-template-columns:minmax(0,1.6fr) minmax(0,1fr); gap:2rem 2.6rem; align-items:start}
@media (max-width:900px){ .hub-grid{grid-template-columns:1fr} }
.hub-main{max-width:46rem}
.hub-main p{margin:0 0 .9rem; line-height:1.6}
.hub-main ol, .hub-main ul{padding-left:1.4rem; display:flex; flex-direction:column; gap:.6rem; margin:.3rem 0 1.1rem; line-height:1.55}
.hub-side{display:flex; flex-direction:column; gap:1rem}
.hcard{display:flex; gap:1rem; align-items:flex-start; background:var(--surface); border:1px solid var(--line); border-left:4px solid var(--accent-line); border-radius:8px; padding:1.1rem 1.2rem; min-width:0}
.hcard .ic2{width:2.3rem; height:2.3rem}
.hcard h3{font-size:1.05rem; margin:0 0 .35rem; line-height:1.3}
.hcard p{margin:0 0 .45rem; color:var(--muted); font-size:.95rem; line-height:1.5}
.hcard p:last-child{margin-bottom:0}
.hgrid{display:grid; grid-template-columns:repeat(auto-fill, minmax(min(100%, 19rem), 1fr)); gap:.9rem}
.bgrid{display:grid; grid-template-columns:repeat(auto-fill, minmax(min(100%, 20rem), 1fr)); gap:1rem}
.bcard{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:1.15rem 1.25rem; display:flex; flex-direction:column; gap:.45rem; min-width:0}
.bcard h3{font-size:1.08rem; margin:0 0 .15rem}
.bcard p{margin:0; display:flex; gap:.55rem; align-items:flex-start; font-size:.95rem; line-height:1.45; overflow-wrap:anywhere}
.bcard p .ic{width:1.15rem; height:1.15rem; margin-top:.18rem; color:var(--primary)}
.bcard p.muted, .bcard p.eyebrow{display:block}
.lead-p{color:var(--muted); font-size:1.05rem; max-width:46rem; margin:0 0 1.2rem}
.ru-note{display:flex; gap:.55rem; align-items:center; font-size:.9rem; color:var(--muted); background:var(--soft); border:1px solid var(--line); border-radius:6px; padding:.55rem .85rem; margin:0 0 1.2rem; max-width:46rem}
.ru-note .ic{width:1.1rem; height:1.1rem}
.stats-strip{display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); background:var(--surface); border:1px solid var(--line); border-radius:10px; overflow:hidden}
.stats-strip > div{padding:1rem 1.2rem; display:flex; flex-direction:column; gap:.15rem; border-left:1px solid var(--line); min-width:0}
.stats-strip > div:first-child{border-left:0}
.stats-strip b{font-family:var(--serif); font-size:1.75rem; line-height:1.1; color:var(--primary); font-variant-numeric:tabular-nums; white-space:nowrap}
.stats-strip span{color:var(--muted); font-size:.88rem; line-height:1.3}
@media (max-width:700px){ .stats-strip{grid-template-columns:repeat(2, minmax(0,1fr))} .stats-strip > div:nth-child(3){border-left:0} .stats-strip > div:nth-child(n+3){border-top:1px solid var(--line)} }
.two > div > h2{margin-bottom:.6rem}
.dotlist{list-style:none; margin:0 0 1rem; padding:0; display:grid; grid-template-columns:repeat(auto-fill, minmax(min(100%, 18rem), 1fr)); gap:.35rem 1.4rem}
.dotlist li{position:relative; padding-left:1.1rem; line-height:1.45}
.dotlist li::before{content:""; position:absolute; left:0; top:.6em; width:.42rem; height:.42rem; border-radius:50%; background:var(--gold)}
.yearlist{list-style:none; margin:0; padding:0; display:grid; grid-template-columns:repeat(auto-fill, minmax(min(100%, 22rem), 1fr)); gap:.5rem}
.yearlist li{display:flex; gap:.9rem; align-items:baseline; background:var(--surface); border:1px solid var(--line); border-radius:6px; padding:.65rem .9rem}
.yearlist b{flex:none; font-family:var(--serif); color:var(--primary); font-variant-numeric:tabular-nums}
.yearlist span{color:var(--ink); line-height:1.4}
.tagcloud{list-style:none; margin:0; padding:0; display:flex; flex-wrap:wrap; gap:.55rem}
.tagcloud li{display:inline-flex; gap:.5rem; align-items:center; background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:.45rem 1rem; font-weight:700; font-size:.95rem}
.tagcloud .ic{color:var(--primary)}
.flist{display:flex; flex-direction:column; gap:.6rem}
.ffield{display:flex; align-items:center; gap:.6rem; max-width:32rem; background:var(--surface); border:var(--bw) solid var(--line); border-radius:8px; padding:0 .9rem}
.ffield:focus-within{border-color:var(--primary); outline:3px solid var(--gold); outline-offset:1px}
.ffield .ic{color:var(--muted)}
.ffield input{flex:1; min-width:0; border:0; background:transparent; color:var(--ink); font:inherit; min-height:3rem; outline:none}
.fcount{font-size:.88rem; color:var(--muted); margin:0}
.frows{list-style:none; margin:0; padding:0; display:grid; grid-template-columns:repeat(auto-fill, minmax(min(100%, 24rem), 1fr)); gap:.5rem}
.frows li{background:var(--surface); border:1px solid var(--line); border-radius:6px; padding:.75rem 1rem; display:flex; flex-direction:column; gap:.2rem; line-height:1.4; min-width:0; overflow-wrap:anywhere}
.frows li small{color:var(--muted); font-size:.86rem}
.frows li span{color:var(--muted); font-size:.92rem}
.fnone{color:var(--muted); font-style:italic}
/* главная */
.need-sec{padding-top:1.6rem; padding-bottom:1rem}
.hero-search{display:flex; align-items:center; gap:.6rem; background:var(--surface); border:2px solid var(--primary); border-radius:14px; padding:.4rem .4rem .4rem 1.1rem; box-shadow:0 6px 22px rgba(47,81,65,.14); margin-top:.3rem}
.hero-search:focus-within{outline:3px solid var(--gold); outline-offset:2px}
.hero-search > .ic{color:var(--primary); width:1.5rem; height:1.5rem}
.hero-search input{flex:1; min-width:0; border:0; background:transparent; color:var(--ink); font:inherit; font-size:1.15rem; min-height:3.4rem; outline:none}
.hero-search .btn{min-height:3.2rem; padding-inline:1.4rem}
.hero-try{display:flex; flex-wrap:wrap; align-items:center; gap:.4rem; margin:0; font-size:.9rem; color:var(--muted)}
.hero-try .chip, .search-tips .chip{min-height:2.2rem; padding:.25rem .8rem; font-size:.85rem}
.hero-btns .btn{min-height:2.9rem}
@media (max-width:720px){ .hero h1{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap} }   /* название уже есть в шапке: на телефоне поиск поднимается выше */
@media (max-width:560px){ .hero-search{padding-left:.8rem} .hero-search > .ic{display:none} .hero-search .btn{padding-inline:1rem} .hero-try span{width:100%} }
.search-res mark{background:rgba(201,162,74,.32); color:inherit; border-radius:2px; padding:0 1px}
.search-more, .search-tips{display:flex; flex-direction:column; gap:.55rem; padding:.8rem .9rem; border:1px dashed var(--line); border-radius:8px; color:var(--muted); font-size:.92rem}
.search-tips{flex-direction:row; flex-wrap:wrap; align-items:center; border-style:solid; border-color:transparent; padding-inline:0}
.home-search{display:flex; align-items:center; gap:.6rem; background:var(--surface); border:var(--bw) solid var(--line); border-radius:12px; padding:.4rem .4rem .4rem 1rem; max-width:44rem; margin-bottom:1.3rem}
.home-search:focus-within{border-color:var(--primary)}
.home-search > .ic{color:var(--muted); width:1.4rem; height:1.4rem}
.home-search input{flex:1; min-width:0; border:0; background:transparent; color:var(--ink); font:inherit; font-size:1.05rem; min-height:3rem; outline:none}
.need-grid{display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:.9rem; margin-bottom:1.3rem}
@media (max-width:1000px){ .need-grid{grid-template-columns:repeat(2, minmax(0,1fr))} }
@media (max-width:560px){ .need-grid{grid-template-columns:1fr 1fr; gap:.6rem} }
.need{display:flex; gap:.8rem; align-items:center; background:var(--surface); border:1px solid var(--line); border-bottom:4px solid var(--accent-line); border-radius:10px; padding:1rem 1.1rem; color:var(--ink); text-decoration:none; min-width:0}
.need:hover{border-color:var(--primary); text-decoration:none}
.need .ic2{width:2.4rem; height:2.4rem}
.need span{flex:1; min-width:0; display:flex; flex-direction:column; gap:.2rem}
.need b{font-size:1.02rem; line-height:1.3}
.need small{color:var(--muted); font-size:.86rem; line-height:1.35}
.need b{flex:1; min-width:0}
.need .go{color:var(--primary); width:1.2rem; height:1.2rem}
/* поиск */
.search-ov{place-items:start center; padding-top:7vh}
.search-box{background:var(--surface); color:var(--ink); border-radius:14px; width:min(44rem, 100%); max-height:82vh; display:flex; flex-direction:column; gap:.8rem; padding:1.3rem; box-shadow:0 20px 60px rgba(0,0,0,.3)}
.search-row{display:flex; align-items:center; gap:.5rem}
.search-row .search-field{flex:1; min-width:0}
.search-x{border:0; background:transparent; color:var(--ink); cursor:pointer; min-width:2.8rem; min-height:2.8rem; display:grid; place-items:center; border-radius:8px}
.search-x:hover{background:var(--soft)}
.search-count:empty{display:none}
.search-more{border:0 !important; padding:.2rem 0 !important}
.search-field{display:flex; align-items:center; gap:.6rem; border:var(--bw) solid var(--primary); border-radius:10px; padding:0 .9rem}
.search-field .ic{color:var(--muted); width:1.3rem; height:1.3rem}
.search-field input{flex:1; min-width:0; border:0; background:transparent; color:var(--ink); font:inherit; font-size:1.08rem; min-height:3.2rem; outline:none}
.search-count{margin:0; font-size:.88rem; color:var(--muted)}
.search-res{list-style:none; margin:0; padding:0; overflow:auto; display:flex; flex-direction:column; gap:.4rem}
.search-res a{display:flex; flex-direction:column; gap:.15rem; padding:.7rem .9rem; border:1px solid var(--line); border-radius:8px; color:var(--ink); text-decoration:none}
.search-res a:hover, .search-res a:focus-visible{border-color:var(--primary); background:var(--soft)}
.search-res .k{font-size:.74rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--gold-text)}
.search-res b{line-height:1.35}
.search-res small{color:var(--muted); font-size:.86rem; line-height:1.4}
@media (max-width:640px){ .search-ov{padding:0} .search-box{border-radius:0; max-height:100vh; height:100%} }
.news-item details summary{cursor:pointer; color:var(--primary); font-weight:700; font-size:.93rem}
.news-item details p{margin-top:.5rem}
.other-addr small{display:block; color:var(--muted); font-size:.88rem; margin-left:1.7rem; line-height:1.4}
#branches-c h2{font-size:1.45rem; margin-bottom:.9rem}
.glist{list-style:none; margin:0; padding:0; display:grid; grid-template-columns:repeat(auto-fill, minmax(min(100%, 22rem), 1fr)); gap:.2rem 2rem}
.glist li{padding:.7rem 0; border-bottom:1px solid var(--line); display:flex; flex-direction:column; gap:.15rem; line-height:1.4}
.glist b{font-family:var(--serif)}
.glist span{color:var(--muted); font-size:.93rem}
details.more{margin-top:1.6rem; border-top:1px solid var(--line); padding-top:1rem}
details.more > summary{cursor:pointer; font-family:var(--serif); font-weight:700; font-size:1.15rem; color:var(--primary); list-style-position:outside}
details.more[open] > summary{margin-bottom:1rem}
.brief{list-style:none; margin:0; padding:0; display:flex; flex-direction:column}
.brief li{display:flex; flex-wrap:wrap; gap:.2rem 1rem; align-items:baseline; padding:.6rem 0; border-bottom:1px solid var(--line)}
.brief li b{min-width:12rem}
.brief li span{color:var(--muted); flex:1; min-width:12rem}
a[href^="tel:"], .nw{white-space:nowrap}
@media (max-width:480px){ :root:is([data-fs="1"],[data-fs="2"],[data-fs="3"]) :is(a[href^="tel:"], .nw, .phone-big){white-space:normal} }
@media (max-width:560px){ .need{padding:.8rem .9rem} .need .ic2{width:2rem; height:2rem} .home-search > .ic{display:none} .home-search{padding-left:.8rem} }
@media (prefers-reduced-motion: reduce){ *,*::before,*::after{animation:none !important; transition:none !important; scroll-behavior:auto !important} }
/* ====== Оформление «Белый лист»: музейный минимализм.
   Белая страница, чёрно-белые фото из альбомов архива, архивный зелёный и Lora без заглавных.
   Ориентиры: Met, MoMA, British Museum (название под снимком, строка фактов), Rijksmuseum, V&A (коллекция на первом экране),
   The Last Museum (поиск в центре), Guggenheim, Serpentine (воздух, тонкие линии). Всё на переменных: тёмная и контрастная схемы работают так же. ====== */
html{font-size:calc(18px * var(--scale))}
body{font-feature-settings:"cv11"; -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; text-rendering:optimizeLegibility}
h1,h2,h3,h4{font-family:var(--display); font-weight:500; letter-spacing:-.01em; line-height:1.18}
::selection{background:var(--tint); color:var(--ink)}
a{color:var(--primary); text-decoration:underline; text-decoration-thickness:1px; text-underline-offset:.2em}
a:hover{text-decoration-thickness:2px}
.wrap{max-width:82rem; padding-inline:max(18px, 4vw)}
:focus-visible{outline:3px solid var(--focus); outline-offset:3px; border-radius:2px}
.orn-band, .orn-line, .orn-glyph, .geo, .geo-clip, .progress, .hero-scroll{display:none !important}
hr.orn-line{display:block !important; height:0; border:0; border-top:1px solid var(--line); background:none; opacity:1; margin-block:3rem}

/* --- подписи: строчными, спокойно --- */
.kicker, .eyebrow, .news-date, .search-res .k, .v-l{font-family:var(--sans); font-size:.86rem; font-weight:400; letter-spacing:0; text-transform:none; color:var(--muted)}
.kicker::before{display:none}

/* --- кнопки: овальные, без лишнего --- */
.btn{border-radius:999px; min-height:3rem; padding:.55rem 1.4rem; border:1px solid var(--primary); background:var(--primary); color:var(--primary-ink); font-weight:600; font-size:.95rem; letter-spacing:0; transition:background-color .2s, border-color .2s, color .2s}
.btn:hover{filter:none; background:var(--primary-hover); border-color:var(--primary-hover); text-decoration:none}
.btn.ghost{background:transparent; color:var(--ink); border-color:var(--line-strong)}
.btn.ghost:hover{background:transparent; border-color:var(--ink); color:var(--ink)}
.btn.gold{background:var(--primary); border-color:var(--primary); color:var(--primary-ink)}
.btn.danger{background:transparent; border-color:var(--bad); color:var(--bad)}
.btn.sm{min-height:2.5rem; padding:.3rem 1rem; font-size:.86rem}
.btn.arrow::after{display:none}
.btn .ic{width:1.1em; height:1.1em}
.chip{border-radius:999px; border:1px solid var(--line-strong); background:transparent; color:var(--ink); font-size:.88rem}
.chip:hover{border-color:var(--ink); color:var(--ink)}
.text-link{display:inline-flex; align-items:center; gap:.4rem; font-weight:600; color:var(--primary)}
.max{max-width:100%}

/* --- поверхности: тональная заливка вместо рамок --- */
.card, .info-card, .hcard, .bcard, .panel, .contact-card, .news-item, .tile, .mod-item, .entry, .sym, .logo-meaning, .gloss div, .tl-short li, .region .r, .link-card, .simple-list li, .mini, .yearlist li, .ru-note, .faq details{background:var(--soft); border:0; border-radius:6px; box-shadow:none}
.card{border-top:0}
.hcard{border-left:0}
.gloss div{border-left:0}
.mini{border-left:0}
.info-card{border-top:0}
.ffield, .home-search, .field input, .field textarea, .field select, .chat-form textarea, .search-field{border-radius:6px; border:1px solid var(--line-strong); background:var(--bg)}
.ffield:focus-within{outline:2px solid var(--focus); outline-offset:1px; border-color:var(--focus)}
.tagcloud li{background:transparent; border:1px solid var(--line-strong); border-radius:999px; font-weight:400}
.tagcloud .ic{color:var(--muted)}
.stats-strip{background:transparent; border:0; border-top:1px solid var(--line); border-bottom:1px solid var(--line); border-radius:0}
.stats-strip b{font-family:var(--display); font-weight:400; color:var(--ink); letter-spacing:-.01em; font-size:min(2.1rem, 18cqi)}
.stats-strip > div{container-type:inline-size; padding-inline:clamp(.75rem, 2.2vw, 1.2rem)}
.ic2{color:var(--primary); stroke-width:1.6}
.need-ic, .ic2{--tint:transparent}
.album{background:transparent; border:0; box-shadow:none; padding:0; transform:none !important}
.album .c{display:none}
.album .ph{background:var(--soft)}
.album .ph > img{filter:none}
.album .ph > svg{filter:grayscale(1) contrast(.92)}
.album figcaption{font-family:var(--sans); font-style:normal; font-size:.86rem; color:var(--muted); padding:.6rem 0 0}
.gallery{gap:1.4rem}
.dotlist li::before{background:var(--primary); width:.35rem; height:.35rem}
.pill{letter-spacing:0; text-transform:none; font-size:.76rem; font-weight:600}

/* --- верхняя строка --- */
.topbar{background:var(--bg); color:var(--muted); border-bottom:1px solid var(--line); font-size:.82rem; letter-spacing:0}
.topbar .wrap{padding-block:.3rem; gap:.4rem 1.1rem; flex-wrap:nowrap}
.topbar .wrap > *{white-space:nowrap; flex:none}
.topbar .spacer{flex:1 1 auto}
.topbar .status{background:transparent !important; padding:0; font-size:.82rem; font-weight:600; border:0; letter-spacing:0}
.topbar .status::before{width:.5rem; height:.5rem}
.phone-top{display:inline-flex; align-items:center; gap:.4rem; color:var(--ink); text-decoration:none; font-weight:600; white-space:nowrap; font-variant-numeric:lining-nums tabular-nums}
.phone-top:hover{color:var(--primary)}
.phone-top .ic{width:1rem; height:1rem; color:var(--primary)}
.topbar button{min-height:2.1rem; padding:0 .7rem; border:1px solid transparent; border-radius:999px; color:var(--ink); font-weight:400; background:transparent}
.topbar button:hover{border-color:var(--line-strong)}
.topbar button[aria-pressed="true"], .topbar button[aria-expanded="true"]{background:var(--ink); color:var(--bg); border-color:var(--ink)}
.eye-btn .ic{width:1.25em; height:1.25em}
.top-sep{width:1px; height:1.1rem; background:var(--line); flex:none}
@media (max-width:900px){ .topbar .status, .phone-top, .top-sep.t1{display:none} }
@media (max-width:560px){ .topbar .wrap{gap:.3rem} }
/* верхняя строка: только нужное — статус, телефон, соцсети, тема, версия для слабовидящих, язык */
.topbar .theme-btn .t1, .topbar .eye-btn > span{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0)}
.topbar .theme-btn, .topbar .eye-btn{width:2.1rem; padding:0; justify-content:center}
.lang-dd{position:relative; display:inline-flex}
.topbar .lang-btn{gap:.35rem; padding:0 .6rem; font-weight:600}
.lang-btn .ic{width:1.15rem; height:1.15rem; flex:none}
.lang-btn .chev{width:.9rem; height:.9rem; transition:transform .15s}
.lang-btn[aria-expanded="true"] .chev{transform:rotate(180deg)}
.topbar .lang-btn[aria-expanded="true"]{background:transparent; color:var(--ink); border-color:var(--line-strong)}
.lang-list{position:absolute; top:calc(100% + .35rem); right:0; z-index:40; min-width:10.5rem; margin:0; padding:.35rem; list-style:none; background:var(--bg); border:1px solid var(--line); border-radius:12px; box-shadow:0 10px 28px rgba(10,30,50,.16)}
.lang-list[hidden]{display:none}
.topbar .lang-list button{width:100%; justify-content:flex-start; min-height:2.5rem; padding:0 .8rem; border:0; border-radius:8px; font-size:.95rem; font-weight:400}
.topbar .lang-list button:hover{background:var(--tint)}
.topbar .lang-list button[aria-pressed="true"]{background:transparent; color:var(--ink); font-weight:700}
:root:is([data-fs="2"],[data-fs="3"]) .topbar .wrap{flex-wrap:wrap}

/* --- панель «Версия для слабовидящих» --- */
.a11y-panel{background:var(--soft); border-bottom:1px solid var(--line)}
.a11y-panel button{border-radius:999px; border:1px solid var(--line-strong); background:var(--bg); font-weight:600; min-height:2.8rem}
.a11y-panel button[aria-pressed="true"]{background:var(--ink); color:var(--bg); border-color:var(--ink)}
.a11y-panel .lbl{font-weight:600}

/* --- шапка: эмблема, название и меню в одну строку --- */
.site-head{position:sticky; top:0; z-index:30; background:color-mix(in srgb, var(--bg) 94%, transparent); -webkit-backdrop-filter:saturate(1.4) blur(14px); backdrop-filter:saturate(1.4) blur(14px); border-bottom:1px solid var(--line); color:var(--ink)}
.site-head .wrap{display:flex; flex-wrap:wrap; align-items:center; gap:.2rem 1.4rem; padding-block:.75rem}
.brand{gap:.85rem; flex:0 1 auto; min-width:0}
.brand .logo{width:3.2rem; height:3.2rem}
.brand .t1{font-family:var(--display); font-weight:500; font-size:1rem; line-height:1.22; max-width:18.5rem; color:var(--ink); letter-spacing:-.005em}
.brand .t2{font-size:.78rem; line-height:1.3; letter-spacing:0; text-transform:none; color:var(--muted); margin-top:.15rem; max-width:19rem}
.site-nav{position:static; background:none !important; -webkit-backdrop-filter:none; backdrop-filter:none; border:0 !important; margin-left:auto; view-transition-name:none}
.site-nav ul{display:flex; flex-wrap:wrap; gap:0; overflow:visible}
.site-nav a{position:relative; display:flex; align-items:center; min-height:2.75rem; padding:0 .55rem; border:0 !important; color:var(--ink) !important; font-size:.92rem; font-weight:400; letter-spacing:0; text-transform:none; white-space:nowrap; background:none !important}
.site-nav a::after{content:""; position:absolute; left:.55rem; right:.55rem; bottom:.35rem; height:2px; background:var(--primary); transform:scaleX(0); transform-origin:left; transition:transform .25s}
.site-nav a:hover{text-decoration:none}
.site-nav a:hover::after{transform:scaleX(.4)}
.site-nav a[aria-current="page"]{font-weight:600}
.site-nav a[aria-current="page"]::after{transform:none}
.nav-search{margin-left:0; width:2.75rem; min-height:2.75rem; padding:0; justify-content:center; border:1px solid var(--line-strong); border-radius:999px; color:var(--ink); font-size:.92rem; font-weight:400; letter-spacing:0; text-transform:none; background:transparent}
.nav-search > span{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
.nav-search:hover{border-color:var(--ink); background:transparent; color:var(--ink)}
.nav-search .ic{width:1.1rem; height:1.1rem}
.menu-btn{display:none; align-items:center; gap:.5rem; min-height:2.75rem; padding:0 1rem; border:1px solid var(--line-strong); border-radius:999px; background:transparent; color:var(--ink); font:inherit; font-size:.92rem; cursor:pointer}
@media (max-width:1340px){   /* меню в одну строку с названием помещается только от ~1340 px */
  .brand .t1{max-width:30rem}
  .brand .t2{max-width:30rem}
  .site-nav{order:5; flex-basis:100%; margin:0 -.55rem}
  .nav-search{margin-left:auto}
}
@media (max-width:900px){
  .brand{flex:1 1 0}
  .menu-btn{display:inline-flex}
  .site-nav{display:none; margin:0}
  .site-nav.open{display:block}
  .site-nav ul{flex-direction:column; padding:.4rem 0 .8rem}
  .site-nav a{min-height:3rem; padding:0; font-size:1.05rem; border-bottom:1px solid var(--line) !important}
  .site-nav a::after{left:0; right:auto; width:2.2rem; bottom:-1px}
}
@media (max-width:560px){
  .site-head .wrap{gap:.2rem .5rem; padding-block:.6rem}
  .brand{flex:1 1 0; gap:.6rem}
  .brand .t2{display:none}
  .brand .logo{width:2.6rem; height:2.6rem}
  .brand .t1{font-size:.86rem; max-width:none}
  .menu-btn > span{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0)}
  .menu-btn{width:2.75rem; padding:0; justify-content:center}
}
:root[data-scheme="contrast"] .site-head{background:#000; border-bottom:3px solid var(--primary)}
:root[data-scheme="contrast"] .site-nav a{color:var(--primary) !important}

/* --- первый экран: снимок из фонда, под ним — название, как подпись к экспонату --- */
.hero{position:relative; display:block; overflow:visible; min-height:0; background:var(--bg); color:var(--ink); isolation:auto}
.hero-bg{position:relative; margin:0; inset:auto; z-index:auto}
.hero-bg .ph{position:relative; height:clamp(16rem, 46vh, 34rem); overflow:hidden; background:#1b1d1c}
.hero-bg .ph > img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:50% 36%; display:block; filter:none; animation:heroPhoto 1.6s cubic-bezier(.2,.7,.1,1) both}
@keyframes heroPhoto{from{clip-path:inset(0 0 100% 0); scale:1.06} to{clip-path:inset(0 0 0 0); scale:1}}
.hero-cap{position:absolute; right:max(18px, 4vw); bottom:.9rem; max-width:min(26rem, 60%); margin:0; padding:.25rem .6rem; font-size:.78rem; line-height:1.35; color:#fff; background:rgba(14,16,15,.62); border-radius:3px; text-align:right}
.hero-cap:empty{display:none}
.hero-shade{display:none}
.hero-inner{display:grid !important; grid-template-columns:minmax(0,1fr) minmax(0, 30rem); grid-template-areas:"alt find"; gap:1.4rem clamp(2rem, 5vw, 5rem); align-items:start; padding-block:clamp(1.6rem, 3vw, 2.6rem) clamp(2.2rem, 4vw, 3.4rem) !important}
.hero-title{grid-area:title; display:flex; flex-direction:column; gap:.7rem; min-width:0}
.hero-kick{margin:0; font-size:.9rem; color:var(--muted)}
.hero .hero-h1{margin:0; font-family:var(--display); font-weight:400; font-size:clamp(2.1rem, .6rem + 4.3vw, 5.3rem); line-height:1.02; letter-spacing:-.025em; color:var(--ink)}
.hero .hero-h1 > span{display:block}
.hero .hero-h1 > span{animation:lineUp 1.1s cubic-bezier(.2,.7,.1,1) both; animation-delay:calc(.45s + var(--n, 0) * .12s)}
.hero .hero-h1 > span:nth-child(2){--n:1}
@keyframes lineUp{from{opacity:0; translate:0 .45em} to{opacity:1; translate:0 0}}
.hero-alt{grid-area:alt; align-self:center; margin:0; font-family:var(--display); font-size:clamp(1.05rem, 1.4vw, 1.3rem); line-height:1.35; color:var(--muted); max-width:30rem; padding-top:1.1rem; border-top:1px solid var(--line)}
.hero-bottom{grid-area:find; display:flex; flex-direction:column; gap:.9rem; min-width:0}
.hero-text{display:none}
.hero-find{display:flex; flex-direction:column; gap:.85rem; animation:fadeIn .9s .8s both}
@keyframes fadeIn{from{opacity:0} to{opacity:1}}
.hero-search{display:flex; align-items:center; gap:.5rem; margin:0; padding:.35rem .35rem .35rem 1.2rem; background:var(--bg); border:1px solid var(--ink); border-radius:999px; box-shadow:none}
.hero-search:focus-within{outline:3px solid var(--focus); outline-offset:2px}
.hero-search > .ic{width:1.3rem; height:1.3rem; color:var(--ink)}
.hero-search input{flex:1; min-width:0; border:0; background:transparent; color:var(--ink); font:inherit; font-size:1.1rem; min-height:3.2rem; outline:none}
.hero-search input::placeholder{color:var(--muted); opacity:1}
.hero-search .btn{min-height:3rem; padding-inline:1.5rem}
.hero-search .btn .ic{display:none}
.hero-try{display:flex; flex-wrap:wrap; align-items:baseline; gap:.2rem .9rem; margin:0; font-size:.92rem; color:var(--muted)}
.hero-try span{margin-right:.1rem}
.hero-try .chip{min-height:auto; padding:0; border:0; border-radius:0; background:none; color:var(--primary); font-size:.92rem; text-decoration:underline; text-decoration-thickness:1px; text-underline-offset:.22em}
.hero-try .chip:hover{text-decoration-thickness:2px; color:var(--primary)}
.hero-try .chip:nth-of-type(n+4){display:none}
.hero-btns{gap:.6rem}
.hero-btns .btn{min-height:2.9rem}
#hero-call{display:none}
.hero :is(h1, .hero-alt, .hero-kick){position:static}
@media (max-width:900px){
  .hero-inner{grid-template-columns:minmax(0,1fr) !important; grid-template-areas:"find" "alt"; gap:1.4rem}
  .hero-alt{padding-top:.9rem}
  .hero-bg .ph{height:clamp(14rem, 42vh, 24rem)}
}
@media (max-width:720px){
  .hero-kick, .hero-alt{display:none}
  .hero .hero-h1{position:absolute !important; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
  .hero .hero-h1 > span{display:contents}
  .hero-title{gap:0}
  .hero-inner{grid-template-areas:"find" !important; padding-top:1.2rem !important}
}
@media (max-width:560px){
  .vcell .status{display:none}
  .hero-text{display:block}
  .hero .status{display:none}   /* статус «работаем / обед» уже в верхней строке */
  .hero-btns{display:none}
  .hero-search{padding-left:1rem}
  .hero-search > .ic{display:none}
  .hero-search .btn{padding-inline:0; width:3rem; flex:none}
  .hero-search .btn .ic{display:block; width:1.3rem; height:1.3rem}
  .hero-search .btn > span{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
  .hero-cap{left:18px; right:18px; max-width:none; text-align:left; bottom:.6rem}
}
:root[data-scheme="contrast"] .hero-bg{display:none}
:root[data-scheme="contrast"] .hero-search{border-color:var(--primary)}

/* --- строка фактов: когда, куда, как позвонить --- */
.visit{background:var(--soft); border-block:1px solid var(--line)}
.visit-grid{display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:0}
.vcell{display:flex; flex-direction:column; align-items:flex-start; gap:.55rem; min-width:0; padding:clamp(1.6rem, 3vw, 2.4rem) clamp(1.2rem, 2.6vw, 2.4rem); border-left:1px solid var(--line); container-type:inline-size}
.vcell:first-child{border-left:0; padding-left:0}
.vcell:last-child{padding-right:0}
.v-l{margin:0}
.v-big{margin:0; font-family:var(--display); font-weight:400; font-size:clamp(1.7rem, 2.6vw, 2.4rem); line-height:1.08; letter-spacing:-.015em; color:var(--ink); font-variant-numeric:lining-nums tabular-nums}
.v-big.addr{font-size:clamp(1.45rem, 2.1vw, 1.95rem); line-height:1.15}
.vcell .phone-xl{display:block; font-family:var(--display); font-weight:400; font-size:min(clamp(1.5rem, 2.3vw, 2.1rem), 11cqi); line-height:1.15; letter-spacing:-.01em; color:var(--ink); text-decoration:none; white-space:nowrap; font-variant-numeric:lining-nums tabular-nums}
.vcell .phone-xl:hover{color:var(--primary)}
.v-s{margin:0; color:var(--muted); font-size:.95rem}
.vcell .note{font-size:.88rem; background:var(--bg)}
.v-link{margin-top:auto; padding-top:.6rem; font-weight:600}
.vcell .status{font-size:.86rem}
.week{display:grid; grid-template-columns:repeat(7, minmax(0,1fr)); gap:3px; width:100%; max-width:19rem}
.week span{display:grid; place-items:center; height:2rem; font-size:.74rem; font-weight:600; border-radius:3px; color:var(--muted); background:transparent; border:1px solid var(--line)}
.week span.on{background:var(--bg); color:var(--ink); border-color:var(--line-strong)}
.week span.today{background:var(--ink); border-color:var(--ink); color:var(--bg); opacity:1}   /* сегодня — заливкой */
.week span.off{text-decoration:line-through; border-style:dashed}   /* выходной: зачёркнут и в пунктирной рамке; прозрачность .6 давала контраст 2,5:1 (Lighthouse), а различие не должно держаться только на цвете */
.week span.off.today{opacity:1}
:root[data-scheme="contrast"] .week span.on{background:#000; color:var(--primary); border-color:var(--primary)}
:root[data-scheme="contrast"] .week span.today{background:var(--primary); border-color:var(--primary); color:#000}
@media (max-width:900px){
  .visit-grid{grid-template-columns:minmax(0,1fr)}
  .vcell{border-left:0; border-top:1px solid var(--line); padding:1.5rem 0}
  .vcell:first-child{border-top:0}
}
@media (max-width:380px){ .week{gap:2px} .week span{font-size:.68rem} }

/* --- разделы главной --- */
.section{padding-block:clamp(3.4rem, 7vw, 6rem)}
.section.alt{background:var(--soft); border:0}
.sec-head{max-width:none; flex-direction:row; flex-wrap:wrap; align-items:baseline; justify-content:space-between; gap:.6rem 2rem; margin-bottom:clamp(1.6rem, 3vw, 2.4rem)}
.sec-head h2, .h2{font-family:var(--display); font-weight:400; font-size:clamp(1.9rem, 3.4vw, 2.9rem); line-height:1.08; letter-spacing:-.018em; text-transform:none; margin:0}
.sec-head p{flex-basis:100%; color:var(--muted); max-width:42rem}
.sec-head .kicker{flex-basis:100%; order:-1}

/* «Что вам нужно?» — четыре дороги, только слова */
.need-sec .wrap{padding-bottom:0}
.need-grid{display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:clamp(1.2rem, 2.4vw, 2.4rem); margin:0}
.need{display:flex; flex-direction:column; align-items:flex-start; gap:.45rem; min-width:0; min-height:0; padding:1.2rem 0 0; border:0; border-top:1px solid var(--ink); color:var(--ink); text-decoration:none; background:none; border-radius:0; text-align:left}
.need b{font-family:var(--display); font-weight:500; font-size:clamp(1.3rem, 1.9vw, 1.65rem); line-height:1.15; letter-spacing:-.012em}
.need .need-d{color:var(--muted); font-size:.95rem; line-height:1.45}
.need:hover{text-decoration:none; border-top-color:var(--primary)}
.need:hover b{color:var(--primary); text-decoration:underline; text-decoration-thickness:1px; text-underline-offset:.18em}
@media (max-width:1000px){ .need-grid{grid-template-columns:repeat(2, minmax(0,1fr))} }
@media (max-width:560px){ .need-grid{grid-template-columns:minmax(0,1fr); gap:0} .need{padding:1rem 0 1.1rem} .need:last-child{border-bottom:1px solid var(--line)} }

/* «С 1940 года» — одна фраза крупно и даты по порядку */
.story-sec{background:var(--bg)}
.story{display:flex; flex-direction:column; align-items:flex-start; gap:1.4rem}
.story-k{margin:0; font-family:var(--sans); font-size:.95rem; font-weight:600; color:var(--primary); letter-spacing:0}
.story-lead{margin:0; max-width:24em; font-family:var(--display); font-weight:400; font-size:clamp(1.65rem, 1rem + 2.3vw, 3.1rem); line-height:1.16; letter-spacing:-.018em; color:var(--ink); text-wrap:pretty}
.story-dates{list-style:none; margin:1.2rem 0 .2rem; padding:0; width:100%; display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:0 1.6rem; border-top:1px solid var(--line)}
.story-dates li{display:flex; flex-direction:column; gap:.3rem; padding-top:1.1rem; min-width:0; position:relative}
.story-dates li::before{content:""; position:absolute; top:-4px; left:0; width:7px; height:7px; border-radius:50%; background:var(--primary)}
.story-dates b{font-family:var(--display); font-weight:400; font-size:1.7rem; line-height:1; color:var(--ink); font-variant-numeric:lining-nums}
.story-dates span{color:var(--muted); font-size:.92rem; line-height:1.4}
@media (max-width:700px){ .story-dates{grid-template-columns:repeat(2, minmax(0,1fr)); row-gap:1.4rem} }

/* «История края» — опись слева, снимки из альбомов справа */
.region-sec{background:var(--bg); padding-top:0}
.region-grid{display:grid; grid-template-columns:minmax(0,4fr) minmax(0,8fr); gap:2.4rem clamp(2rem, 5vw, 5rem); align-items:start; border-top:1px solid var(--line); padding-top:clamp(3rem, 6vw, 5rem)}
.region-text{display:flex; flex-direction:column; gap:1rem; min-width:0}
.region-text > p{color:var(--muted); max-width:28rem}
.region-links{list-style:none; margin:.6rem 0 0; padding:0; border-top:1px solid var(--line)}
.region-links a{display:flex; justify-content:space-between; align-items:baseline; gap:1rem; padding:.8rem 0; border-bottom:1px solid var(--line); color:var(--ink); text-decoration:none; font-family:var(--display); font-size:1.2rem; font-weight:400}
.region-links a small{font-family:var(--sans); font-size:.82rem; color:var(--muted); white-space:nowrap; font-variant-numeric:tabular-nums}
.region-links a:hover{color:var(--primary)}
.mosaic{display:grid; grid-template-columns:1.05fr 1fr 1fr; grid-template-rows:repeat(2, clamp(10rem, 16vw, 15rem)); gap:.6rem; margin:0; text-decoration:none; color:inherit}
.mosaic figure{position:relative; margin:0; overflow:hidden; background:var(--soft); min-width:0}
.mosaic img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; transition:scale .8s cubic-bezier(.2,.7,.1,1)}
.mosaic .m1{grid-row:span 2}
.mosaic .m2{grid-column:span 2}
.mosaic .m2 img{object-position:50% 60%}
.mosaic .m4 img{object-position:50% 25%}
.mosaic:hover img{scale:1.03}
.mosaic-wrap{display:flex; flex-direction:column; gap:.7rem; min-width:0}
.mosaic-cap{margin:0; font-size:.84rem; color:var(--muted)}
@media (max-width:900px){ .region-grid{grid-template-columns:minmax(0,1fr)} .mosaic{grid-template-rows:repeat(2, clamp(8rem, 30vw, 13rem))} }
@media (max-width:480px){ .mosaic{grid-template-columns:1fr 1fr; grid-template-rows:12rem 8rem 8rem} .mosaic .m1{grid-row:span 1; grid-column:span 2} .mosaic .m2{grid-column:span 2} .mosaic .m1 img{object-position:50% 40%} }

/* новости и карта */
.cat-sec{background:var(--soft); padding-block:clamp(3rem, 6vw, 5rem)}
.cat-grid{display:grid; grid-template-columns:minmax(0,5fr) minmax(0,7fr); gap:2.4rem clamp(2rem, 5vw, 4.4rem)}
.cell{min-width:0}
.cell-head{display:flex; align-items:baseline; flex-wrap:wrap; gap:.4rem 1rem; margin-bottom:1.2rem}
.cell-head h2{font-family:var(--display); font-weight:400; font-size:clamp(1.6rem, 2.4vw, 2.1rem); line-height:1.1; letter-spacing:-.015em; text-transform:none}
.cell-more{margin-left:auto; font-size:.92rem; font-weight:600; color:var(--primary)}
.news-mini{list-style:none; margin:0; padding:0; display:block; border-top:1px solid var(--line-strong); max-width:none; background:none}
.news-mini li{border-bottom:1px solid var(--line); background:none}
.news-mini a{display:flex; flex-direction:column; align-items:flex-start; gap:.3rem; padding:1.05rem 0; color:var(--ink); text-decoration:none; min-height:0; background:none}
.news-mini time{min-width:0; font-size:.84rem; color:var(--muted); font-weight:400; letter-spacing:0; text-transform:none}
.news-mini b{font-family:var(--display); font-weight:500; font-size:1.2rem; line-height:1.25}
.news-mini span{display:none}
.news-mini .go{display:none}
.news-mini a:hover b{color:var(--primary); text-decoration:underline; text-decoration-thickness:1px; text-underline-offset:.18em}
.c-map .map-full{margin:0}
.map-full, .map-box{border-radius:6px; border:1px solid var(--line); background:var(--il-mapbg)}
@media (max-width:900px){ .cat-grid{grid-template-columns:minmax(0,1fr)} }

/* --- страницы разделов: заголовок без панорамы --- */
.page{padding-block:0 clamp(3rem, 6vw, 5rem)}
.page-head{max-width:none; margin:0; padding:0}
.page-head.pano{position:relative; display:block; height:auto; overflow:visible; background:var(--bg); color:var(--ink); margin:0 0 1.6rem}
.page-head.pano::after{display:none}
.page-head.pano .ph{display:none}
.page-head.pano .pano-in{position:static; display:block; padding-block:clamp(2.2rem, 5vw, 4rem) 0}
.page-head h1, .page-head.pano h1, #admin-root > h1{font-family:var(--display); font-weight:400; font-size:clamp(2.3rem, 1.2rem + 3.6vw, 4.6rem); line-height:1.02; letter-spacing:-.022em; text-transform:none; color:var(--ink); text-shadow:none; margin:0}
.page-head h1::after{display:none}
.page-head.pano.has-img{background:#1b1d1c; margin-bottom:1.6rem}
.page-head.pano.has-img .ph{display:block; position:absolute; inset:0; margin:0}
.page-head.pano.has-img .ph > img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:var(--pos, 50% 50%); filter:none; transform:none}
