.page-head.pano.has-img .ph::before, .page-head.pano.has-img .ph::after{display:none}
.page-head.pano.has-img::after{display:block; content:""; position:absolute; inset:0; background:linear-gradient(180deg, rgba(12,14,13,0) 35%, rgba(12,14,13,.72) 100%); pointer-events:none}
.page-head.pano.has-img .pano-in{position:relative; z-index:1; min-height:clamp(14rem, 30vw, 24rem); display:flex; align-items:flex-end; padding-block:2rem}
.page-head.pano.has-img h1{color:#fff}
.page-head.pano + .wrap.page{padding-top:0}
:root[data-scheme="contrast"] .page-head.pano h1{color:var(--primary)}

/* --- вкладки разделов --- */
.hub-tabs{display:flex; flex-wrap:wrap !important; overflow:visible !important; gap:0 1.6rem; border-bottom:1px solid var(--line); margin-bottom:clamp(1.8rem, 3vw, 2.6rem)}
.hub-tabs button{position:relative; min-height:3rem; padding:0; border:0; border-bottom:0; margin:0; background:none; color:var(--muted); font:inherit; font-size:.98rem; font-weight:400; letter-spacing:0; text-transform:none; white-space:nowrap; cursor:pointer}
.hub-tabs button::after{content:""; position:absolute; left:0; right:0; bottom:-1px; height:2px; background:var(--primary); transform:scaleX(0); transform-origin:left; transition:transform .3s cubic-bezier(.2,.7,.1,1)}
.hub-tabs button:hover{color:var(--ink)}
.hub-tabs button[aria-selected="true"]{color:var(--ink); font-weight:600}
.hub-tabs button[aria-selected="true"]::after{transform:none}
.hub-tabs button:focus-visible{outline:3px solid var(--focus); outline-offset:2px}
@media (max-width:720px){ .hub-tabs{gap:0 1.1rem} .hub-tabs button{white-space:normal; text-align:left; min-height:2.9rem; line-height:1.3; padding-block:.4rem} }
.tab-panel h2, .tab-panel h2.h-big{font-family:var(--display); font-weight:400; font-size:clamp(1.5rem, 2.4vw, 2rem); text-transform:none; letter-spacing:-.012em; line-height:1.15; margin-bottom:1rem}
.tab-panel:focus-visible{outline:3px solid var(--focus); outline-offset:8px}
.tab-panel.enter{animation:panelIn .45s ease-out both}
@keyframes panelIn{from{opacity:0} to{opacity:1}}
.hub-main{max-width:44rem}
.hub-main p, .prose p{line-height:1.65}
.hcard h3, .bcard h3, .glist b, .yearlist b, .frows li b, .gloss dt, .tl h3{font-family:var(--display); font-weight:500}
.hcard .ic2{width:2rem; height:2rem}
.lead-p{color:var(--muted); font-size:1.05rem}
.ru-note{font-size:.88rem}
details.more > summary{font-family:var(--display); font-weight:500; color:var(--primary)}
.tl::before{width:1px; background:var(--line-strong)}
.tl li::after{width:11px; height:11px; border:2px solid var(--primary); left:calc(3.6rem - 5px); top:1rem; background:var(--bg)}
.tl .yr{background:transparent; color:var(--ink); border:0; font-family:var(--display); font-weight:400; font-size:1.25rem; place-items:center start; padding-left:0; height:auto}
.tl li{grid-template-columns:7.2rem minmax(0,1fr)}
@media (max-width:480px){ .tl li{grid-template-columns:4.8rem minmax(0,1fr); gap:.9rem} .tl::before{left:2.4rem} .tl li::after{left:calc(2.4rem - 5px)} .tl .yr{font-size:1.05rem} }
.tl-short b{color:var(--ink); font-weight:400}
.faq details{background:transparent; border-radius:0; border-bottom:1px solid var(--line)}
.faq{gap:0; border-top:1px solid var(--line)}
.faq summary{padding:1.05rem 0; font-weight:600}
.faq details[open] summary{border-bottom:0}
.faq .ans{padding:0 0 1.2rem}
.faq summary::after{color:var(--primary); font-weight:400}
.search-res a{border:0; border-bottom:1px solid var(--line); border-radius:0; padding:.8rem .2rem}
.search-res a:hover, .search-res a:focus-visible{background:var(--soft)}
.search-res mark{background:var(--tint); color:inherit}
.search-box{border-radius:10px; box-shadow:0 30px 80px -30px rgba(10,20,15,.45)}
.search-field{border-color:var(--ink); border-radius:999px; padding:0 1.1rem}
.contact-card{padding:1.6rem}
.addr-big{font-weight:500}
.map-routes .btn.ghost{color:var(--ink)}
.symbols .sym{padding:1.6rem}
.logo-meaning li b{font-weight:600}
.news-item h3{font-weight:500; font-size:1.2rem}
.news-col{gap:1rem}

/* каталоги — строки через тонкую линию */
.frows{gap:0 2.4rem !important}
.frows li{background:transparent !important; border:0 !important; border-top:1px solid var(--line) !important; border-radius:0 !important; padding:.95rem 0 1rem !important; cursor:pointer}
.frows li b{line-height:1.3}
.frows li > span, .frows li > small, .glist li > span{display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; overflow:hidden}
.frows li.x > span, .frows li.x > small, .glist li.x > span{display:block; -webkit-line-clamp:unset; overflow:visible}
.glist li{cursor:pointer}
ul.lim:not(.all) > li.cut{display:none}
.more-btn{margin:1.2rem 0 1.6rem; align-self:flex-start; justify-self:start; width:auto !important}
.dotlist{gap:.5rem 2.4rem}
.news-item:has(details) > p:not(.news-date){display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:3; overflow:hidden}
.news-item:has(details[open]) > p:not(.news-date){display:block; -webkit-line-clamp:unset; overflow:visible}

/* --- подвал: архивный зелёный --- */
.site-foot{position:relative; background:var(--foot-bg); color:var(--foot-ink); border-top:0}
.site-foot .wrap{display:block; padding-block:0; font-size:.95rem}
.foot-top{display:grid !important; grid-template-columns:minmax(0,1.7fr) minmax(0,1fr) minmax(0,1fr); gap:2.4rem 3rem; padding-block:clamp(3rem, 6vw, 4.6rem) 2.6rem !important}
.foot-name{margin:0 0 1.2rem; font-family:var(--display); font-weight:400; font-size:clamp(1.5rem, 2.4vw, 2.1rem); line-height:1.15; letter-spacing:-.012em; color:var(--foot-ink); max-width:24rem}
.foot-big{margin:.15rem 0; font-family:var(--sans); font-size:1rem; line-height:1.5; color:var(--foot-ink); opacity:1 !important}
.site-foot .ft{margin:0 0 .9rem; font-family:var(--sans); font-weight:600; font-size:.9rem; letter-spacing:0; text-transform:none; color:var(--foot-muted)}
.site-foot a{color:var(--foot-ink); text-decoration:none}
.site-foot a:hover{text-decoration:underline; color:var(--foot-ink)}
.site-foot ul{gap:.55rem}
.site-foot ul a{font-size:1rem}
#foot-phones{color:var(--foot-ink); font-variant-numeric:lining-nums}
.foot-word{display:none}
.foot-bottom{display:flex !important; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:1rem 2rem; padding-block:1.3rem 1.7rem !important; border-top:1px solid var(--foot-line); font-size:.84rem; color:var(--foot-muted)}
.foot-bottom p{margin:0}
.foot-brand{margin:0; gap:.7rem}
.foot-brand svg{width:2.2rem; height:2.2rem}
.foot-brand .ft{margin:0; font-family:var(--display); font-size:.92rem; font-weight:400; color:var(--foot-ink)}
.foot-btns{display:flex; flex-direction:column; gap:.6rem; margin-top:1.2rem; align-items:flex-start}
.foot-btns .btn, .site-foot .foot-btn{background:transparent; color:var(--foot-ink); border:1px solid var(--foot-line); border-radius:999px; min-height:2.8rem; padding:0 1.1rem; font-size:.9rem; font-weight:600; letter-spacing:0; text-transform:none}
.foot-btns .btn:hover, .site-foot .foot-btn:hover{border-color:var(--foot-ink); background:transparent}
@media (max-width:900px){ .foot-top{grid-template-columns:minmax(0,1fr) !important} }
:root[data-scheme="contrast"] .site-foot{background:#000; border-top:3px solid var(--primary)}

/* --- плавающие кнопки, окна --- */
.fab{border-radius:999px; border:0; background:var(--primary); color:var(--primary-ink); font-weight:600; letter-spacing:0; box-shadow:0 16px 36px -14px rgba(10,30,20,.55)}
.fab:hover{background:var(--primary-hover); color:var(--primary-ink)}
.side-tab{display:none !important}
.fab-dock{position:fixed; right:max(16px, 2vw); bottom:max(16px, 2vw); z-index:40; display:flex; align-items:stretch; gap:.5rem; transition:translate .45s cubic-bezier(.2,.7,.1,1), opacity .35s}
.fab-dock .fab{position:static !important}
.fab-fb{min-width:3.8rem; display:grid; place-items:center; padding:0; background:var(--bg); color:var(--ink); border:1px solid var(--line-strong); border-radius:999px; cursor:pointer; box-shadow:0 16px 36px -14px rgba(10,30,20,.4)}
.fab-fb .ic{width:1.3rem; height:1.3rem}
.fab-fb:hover{border-color:var(--ink)}
.fab-dock:has(#fab[hidden]) .fab-fb{display:none}
:root.hero-on .fab-dock{translate:0 160%; opacity:0; pointer-events:none}
@media (max-width:720px){ .fab-dock{display:none !important} }
.drawer-head, .chat-head{background:var(--primary); color:var(--primary-ink)}
.drawer-head button, .chat-head button{border-width:1px; border-radius:999px}
.chat, .drawer, .search-box, .modal-box{border-radius:10px}
.drawer{border-radius:0; border-left:1px solid var(--line)}
.msg{border-radius:12px}
.msg.bot{background:var(--soft); border:0}
.chat-log{background:var(--bg)}
.toast{border-radius:999px; font-weight:600}
.bottom-bar{background:color-mix(in srgb, var(--bg) 96%, transparent); -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px); border-top:1px solid var(--line); grid-template-columns:repeat(4, minmax(0,1fr)) !important}
.bottom-bar a, .bottom-bar button{color:var(--ink); font-weight:600}
.bottom-bar .ic{color:var(--primary)}
.bottom-bar a span, .bottom-bar button span{max-width:100%; text-align:center; line-height:1.1; overflow-wrap:anywhere}
:root[data-scheme="contrast"] .bottom-bar{background:#000; border-top:3px solid var(--primary)}
:root[data-scheme="contrast"] .bottom-bar a, :root[data-scheme="contrast"] .bottom-bar button{color:var(--primary)}

/* --- переход между страницами: короткое затухание --- */
.topbar{view-transition-name:vt-top} .site-head{view-transition-name:vt-head}
.bottom-bar{view-transition-name:vt-bbar} .fab-dock{view-transition-name:vt-dock}
::view-transition-group(*){animation-duration:0s}
::view-transition-old(root){animation:vtOut .25s ease-in both}
::view-transition-new(root){animation:vtIn .35s ease-out both}
@keyframes vtOut{to{opacity:0}}
@keyframes vtIn{from{opacity:0}}
.rv{opacity:1; transform:none}

/* --- ничего не вылезает за рамки --- */
.modal{grid-template-columns:minmax(0,1fr)}
.drawer-body .tabs{flex-wrap:wrap} .drawer-body .tabs button{white-space:normal; text-align:left}
@media (max-width:480px){
  .hours, .hours tbody{display:block}
  .hours tr{display:flex; flex-wrap:wrap; justify-content:space-between; align-items:baseline; gap:0 1rem; border-bottom:1px solid var(--line); padding:.5rem 0}
  .hours th, .hours td{display:block; border:0 !important; padding:0 !important}
  .hours td{margin-left:auto}
}
@media (max-width:420px){ .chat-head{flex-wrap:wrap; gap:.5rem; padding-inline:.75rem} .chat-head .tt{min-width:9rem} .chat-head .av, .chat-head .tt span{display:none} .chat-head button{min-width:2.6rem; padding:0 .4rem} }
@media (max-width:360px){ .btn{padding-inline:.9rem} }
@media (max-width:360px){ :root:is([data-fs="2"],[data-fs="3"]) .btn{padding-inline:.55rem} }
.tagcloud li{max-width:100%; min-width:0; overflow-wrap:anywhere}
.brief li b, .brief li span{min-width:min(12rem, 100%)}
.simple-list li, .simple-list li > span{min-width:0; overflow-wrap:anywhere}
.btn{max-width:100%}
.hours td{white-space:nowrap; padding-left:1rem}
:root:is([data-fs="2"],[data-fs="3"]) .hours td{white-space:normal}
body{overflow-wrap:break-word}
@media (max-width:560px){ h1, h2, .story-lead, .hub-main p, .hub-main li, .hcard p, .tl p, .story-dates span, .stats-strip span, .need .need-d{-webkit-hyphens:auto; hyphens:auto} }
@media (max-width:900px){ .hub-grid, .foot-top, .cat-grid, .region-grid, .hero-inner{grid-template-columns:minmax(0,1fr) !important} }
.hcard > div, .brand > span{min-width:0}
.other-addr small{overflow-wrap:anywhere}
@media (max-width:480px){ :root:is([data-fs="1"],[data-fs="2"],[data-fs="3"]) :is(.phone-xl, .v-big){white-space:normal} }


/* --- фото: обложки новостей, карточки альбомов и статей, просмотр --- */
.news-item.has-cover{display:grid; grid-template-columns:minmax(0, 15rem) minmax(0,1fr); gap:1.4rem; align-items:start}
.news-cover{margin:0; aspect-ratio:4/3; overflow:hidden; border-radius:4px; background:var(--soft)}
.news-cover img{width:100%; height:100%; object-fit:cover; display:block}
.news-body{min-width:0}
.news-item:has(details) .news-body > p:not(.news-date){display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:3; overflow:hidden}
.news-item:has(details[open]) .news-body > p:not(.news-date){display:block; -webkit-line-clamp:unset; overflow:visible}
@media (max-width:640px){ .news-item.has-cover{grid-template-columns:minmax(0,1fr); gap:.9rem} .news-cover{aspect-ratio:16/9} }
.ph-grid{list-style:none; margin:0 0 2.4rem; padding:0; display:grid; grid-template-columns:repeat(auto-fill, minmax(min(15rem, 100%), 1fr)); gap:1.6rem 1.2rem}
.ph-grid.lim:not(.all) > li.cut{display:none}
.ph-card{display:flex; flex-direction:column; align-items:flex-start; gap:.35rem; width:100%; padding:0; border:0; background:none; color:var(--ink); font:inherit; text-align:left; cursor:pointer}
.ph-img{display:block; width:100%; aspect-ratio:4/3; overflow:hidden; border-radius:4px; background:var(--soft); margin-bottom:.4rem}
.ph-img img{width:100%; height:100%; object-fit:cover; display:block; transition:scale .6s cubic-bezier(.2,.7,.1,1)}
.ph-card b{font-family:var(--display); font-weight:500; font-size:1.08rem; line-height:1.3}
.ph-card small{color:var(--muted); font-size:.86rem}
.ph-card:hover b{color:var(--primary); text-decoration:underline; text-decoration-thickness:1px; text-underline-offset:.18em}
.ph-card:hover img{scale:1.03}
.ph-card:focus-visible{outline:3px solid var(--focus); outline-offset:4px}
.lb{position:fixed; inset:0; width:100%; max-width:none; height:100%; max-height:none; margin:0; padding:0; border:0; background:rgba(12,14,13,.96); color:#fff; display:none}
.lb[open]{display:grid; grid-template-rows:auto minmax(0,1fr) auto}
.lb::backdrop{background:rgba(12,14,13,.96)}
.lb-top{display:flex; align-items:center; gap:1rem; padding:.9rem max(16px, 3vw)}
.lb-t{margin:0; flex:1; min-width:0; font-family:var(--display); font-size:1.05rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.lb-n{margin:0; font-size:.86rem; color:rgba(255,255,255,.72); font-variant-numeric:tabular-nums; white-space:nowrap}
.lb-x, .lb-nav{display:grid; place-items:center; width:3rem; height:3rem; border-radius:999px; border:1px solid rgba(255,255,255,.35); background:rgba(0,0,0,.35); color:#fff; cursor:pointer}
.lb-x:hover, .lb-nav:hover{border-color:#fff}
.lb-x .ic, .lb-nav .ic{width:1.3rem; height:1.3rem}
.lb-fig{margin:0; min-height:0; display:grid; grid-template-rows:minmax(0,1fr) auto; justify-items:center; gap:.8rem; padding:0 max(16px, 6vw) .4rem}
.lb-fig img{width:100%; height:100%; min-height:0; object-fit:contain; display:block}
.lb-fig figcaption{max-width:46rem; text-align:center; font-size:.95rem; line-height:1.45; color:rgba(255,255,255,.86)}
.lb-fig figcaption:empty{display:none}
.lb-nav{position:absolute; top:50%; translate:0 -50%}
.lb-prev{left:max(10px, 1.5vw)} .lb-prev .ic{rotate:180deg}
.lb-next{right:max(10px, 1.5vw)}
.lb-src{justify-self:center; margin:.4rem 0 1rem; color:#fff; font-size:.88rem}
.lb :focus-visible{outline:3px solid #fff; outline-offset:3px}
@media (max-width:640px){ .lb-nav{top:auto; bottom:1rem; translate:none} .lb-fig{padding:0 10px 4.5rem} }
:root[data-scheme="contrast"] .lb{background:#000} :root[data-scheme="contrast"] .lb-x, :root[data-scheme="contrast"] .lb-nav{border-color:var(--primary); color:var(--primary)}
@media (prefers-reduced-motion: reduce){ .ph-img img{transition:none} }

/* официальные флаг и герб РК */
.sym .art img.flag{max-height:6rem; width:auto; box-shadow:0 2px 8px rgba(0,0,0,.15)}
.sym .art img.rk-emblem{max-height:9rem; width:auto}
/* полные страницы прежнего сайта */
.pg-wrap{padding-block:clamp(1.4rem,3vw,2.4rem) 4rem}
.crumbs{font-size:.86rem; color:var(--muted); margin-bottom:1.6rem}
.crumbs ol{list-style:none; display:flex; flex-wrap:wrap; gap:.25rem .5rem; padding:0; margin:0}
.crumbs li+li::before{content:"/"; margin-right:.5rem; opacity:.45}
.crumbs a{color:inherit; text-underline-offset:.2em}
.pg{max-width:47rem}
.pg h1{font-family:var(--display); font-weight:400; font-size:clamp(1.8rem,3.4vw,2.7rem); line-height:1.15; margin:.2rem 0 1.4rem; color:var(--ink)}
.pg > h2, .oldsec h2{font-family:var(--display); font-weight:400; font-size:clamp(1.3rem,2.2vw,1.65rem); margin:2.2rem 0 .9rem; color:var(--ink)}
.oldsec h2 a{color:inherit; text-decoration:none}
.oldsec h2 a:hover{text-decoration:underline; text-underline-offset:.2em}
.pg-body{font-size:1.02rem; line-height:1.72; color:var(--ink); max-width:47rem}
.pg-body p{margin:0 0 1rem}
.pg-body h2, .pg-body h3{font-family:var(--display); font-weight:400; margin:1.8rem 0 .7rem}
.pg-body ul, .pg-body ol{margin:0 0 1rem; padding-left:1.3rem}
.pg-body li{margin:.25rem 0}
.pg-body blockquote{margin:1.2rem 0; padding-left:1rem; border-left:2px solid var(--primary); color:var(--muted)}
.pg-body hr{border:0; border-top:1px solid var(--line); margin:1.6rem 0}
.pg-body a{color:var(--primary); text-underline-offset:.2em}
.pg-body a.doc{font-weight:600}
.pg-body a.doc::after{content:" ↓"; font-weight:400}
img.pg-img{display:block; max-width:100%; height:auto; margin:1.2rem 0; cursor:zoom-in; background:var(--soft)}
.pg-pics{display:grid; grid-template-columns:repeat(auto-fill,minmax(min(13rem,100%),1fr)); gap:.7rem; margin:1.2rem 0}
.pg-pics img.pg-img{margin:0; width:100%; aspect-ratio:4/3; object-fit:cover}
.pg-pics:has(> img.pg-img:only-child){display:block}
.pg-pics > img.pg-img:only-child{width:auto; max-width:100%; aspect-ratio:auto; object-fit:contain; max-height:75vh}
.pg-body .linklist{list-style:none; margin:.6rem 0 1.2rem; padding:0; display:grid; grid-template-columns:repeat(auto-fill, minmax(min(100%, 19rem), 1fr)); gap:.4rem .9rem}
.pg-body .linklist li{margin:0; padding:.35rem 0; border-bottom:1px solid var(--line); line-height:1.4}
.pg-body .linklist a{font-weight:600}
.pg-body .linklist small{display:block; color:var(--muted); font-size:.85rem; margin-top:.15rem}
.pg-body h3{margin:1.6rem 0 .4rem; font-size:1.2rem; line-height:1.3}
.reps{list-style:none; margin:.6rem 0 1.6rem; padding:0; display:grid; gap:.5rem}
.reps li{display:flex; flex-direction:column; gap:.2rem; background:var(--soft); border-radius:6px; padding:.8rem 1rem}
.reps a{font-weight:600; line-height:1.4}
.reps small{color:var(--muted); font-size:.9rem}
.cnt{font-family:var(--sans, inherit); font-size:.8rem; font-weight:500; color:var(--muted); margin-left:.4rem}
.vgroup h3{margin:1.6rem 0 .3rem}
.vgroup > p{max-width:62ch; margin:.2rem 0 0}
.vgrid{list-style:none; margin:.7rem 0 1.2rem; padding:0; display:grid; grid-template-columns:repeat(auto-fill, minmax(min(100%, 15rem), 1fr)); gap:1rem}
.vgrid .pg-video{margin:0}
.vgrid p{margin:.45rem 0 0; font-size:.9rem; line-height:1.4}
.hub-cards{list-style:none; margin:0; padding:0; display:grid; grid-template-columns:repeat(auto-fill, minmax(min(100%, 17rem), 1fr)); gap:.8rem}
.hub-card{display:flex; flex-direction:column; gap:.3rem; height:100%; padding:1.1rem 1.2rem; background:var(--soft); border-radius:6px; color:var(--ink); text-decoration:none}
.hub-card b{font-family:var(--serif); font-weight:500; font-size:1.2rem; color:var(--primary)}
.hub-card span{color:var(--muted); line-height:1.45; font-size:.95rem}
.hub-card:hover b{text-decoration:underline; text-underline-offset:.2em}
.hub-card:focus-visible{outline:3px solid var(--focus); outline-offset:2px}
.plans{width:100%; border-collapse:collapse; margin:1rem 0 1.4rem}
.plans th, .plans td{text-align:left; vertical-align:top; padding:.7rem .8rem; border-bottom:1px solid var(--line)}
.plans thead th{font-size:.8rem; letter-spacing:.04em; text-transform:uppercase; color:var(--muted); font-weight:600}
.plans tbody th{font-family:var(--serif); font-size:1.15rem; font-weight:500; color:var(--primary); font-variant-numeric:tabular-nums; width:5.5rem}
.plans td a{display:inline-flex; align-items:baseline; gap:.4rem; margin:0 .9rem .25rem 0; font-weight:600}
.plans td a small{font-weight:500; font-size:.7rem; color:var(--muted); border:1px solid var(--line); border-radius:4px; padding:0 .3rem}
.plans .none{color:var(--muted)}
@media (max-width:560px){
  .plans thead{display:none}
  .plans, .plans tbody, .plans tr, .plans th, .plans td{display:block; width:auto}
  .plans tr{padding:.7rem 0; border-bottom:1px solid var(--line)}
  .plans th, .plans td{border:0; padding:.15rem 0}
  .plans .none::before{content:attr(data-l) ": "}
}
.pg-table{overflow-x:auto; margin:1.2rem 0}
.pg-table table{border-collapse:collapse; font-size:.92rem; line-height:1.45; min-width:100%}
.pg-table th, .pg-table td{border:1px solid var(--line); padding:.45rem .6rem; text-align:left; vertical-align:top}
.pg-table th{background:var(--soft); font-weight:600}
.plist{list-style:none; padding:0; margin:.4rem 0 1.4rem; border-top:1px solid var(--line)}
.plist li{border-bottom:1px solid var(--line)}
.prow{display:flex; align-items:baseline; gap:.8rem; padding:.72rem 0; color:var(--ink); text-decoration:none}
.prow span{flex:1}
.prow small{color:var(--muted); white-space:nowrap; font-size:.85rem}
.prow .ic{width:1rem; height:1rem; color:var(--muted); flex:none; align-self:center}
.prow:hover span{text-decoration:underline; text-underline-offset:.2em}
.frows .prow{padding:0}
.oldsrc{margin-top:2.6rem}
.oldsec + .oldsec, .oldsrc > .oldsec:first-child{padding-top:1.4rem; border-top:1px solid var(--line)}
.oldsec:empty{display:none}
.more-link{display:inline-flex; align-items:center; gap:.4rem; font-weight:600; color:var(--primary)}
.more-link .ic{width:1rem; height:1rem}
.pg-src{margin-top:2.6rem; font-size:.9rem}
.pg-src a{color:var(--muted)}
.pg-branches{display:grid; grid-template-columns:repeat(auto-fill,minmax(min(18rem,100%),1fr)); gap:0 2.2rem}
.pg-branches h3{font-size:1rem; margin:1.2rem 0 .3rem}
.news-more{margin-top:.6rem}
.pg-video{max-width:40rem; aspect-ratio:16/9; margin:1.2rem 0; background:#000}
.pg-video iframe, .pg-video .yt{display:block; width:100%; height:100%; border:0; padding:0; margin:0; background:#000; cursor:pointer; position:relative}
.pg-video .yt img{width:100%; height:100%; object-fit:cover; opacity:.85}
.pg-video .yt-play{position:absolute; inset:0; margin:auto; width:4.2rem; height:3rem; border-radius:.8rem; background:rgba(0,0,0,.72)}
.pg-video .yt-play::after{content:""; position:absolute; left:50%; top:50%; transform:translate(-35%,-50%); border-style:solid; border-width:.65rem 0 .65rem 1.1rem; border-color:transparent transparent transparent #fff}
.pg-video .yt:hover .yt-play, .pg-video .yt:focus-visible .yt-play{background:#c00}
.story-lead{overflow-wrap:break-word; align-self:stretch}   /* длинные казахские слова при крупном шрифте не выходят за край */

/* карусель на главной: на весь экран под шапкой, заголовок поверх фото */
.hc{position:relative; background:#121413}
.hc .ph{position:relative; height:var(--hc-h, calc(100svh - 8.5rem)); min-height:20rem; overflow:hidden; background:#121413}
.hc .hs{position:absolute; inset:0; margin:0; opacity:0; overflow:hidden; transition:opacity 1.2s ease}
.hc .hs.on{opacity:1; z-index:1}
.hc .hs-img{position:absolute; max-width:none; display:block; transform-origin:50% 50%}
.hc .hs.on .hs-img{animation:hcZoom 9s ease-out both}
.hc .hs.pan .hs-img{animation:none}
@keyframes hcZoom{from{transform:scale(1.025)} to{transform:scale(1)}}
.hc .hs-bg{position:absolute; inset:-8%; width:116%; height:116%; max-width:none; object-fit:cover; filter:blur(30px) brightness(.5) saturate(1.1); display:none}
.hc .hs.fit .hs-bg{display:block}
.hc .hs-one{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}
.hc::after{content:""; position:absolute; left:0; right:0; bottom:0; height:64%; z-index:2; pointer-events:none; background:linear-gradient(to top, rgba(8,10,9,.84) 0%, rgba(8,10,9,.58) 36%, rgba(8,10,9,0) 100%)}
.hc-over{position:absolute; left:0; right:0; bottom:0; z-index:3; padding-bottom:clamp(4.4rem, 8vh, 6rem); pointer-events:none}
.hc-over .hero-title{pointer-events:auto; max-width:100%; gap:.6rem}
.hc-over .hero-kick{color:rgba(255,255,255,.88)}
.hero .hc-over .hero-h1{color:#fff; text-shadow:0 2px 20px rgba(0,0,0,.4); font-size:clamp(2.1rem, .7rem + 3.7vw, 4.9rem)}
.hc-bottom{position:absolute; left:0; right:0; bottom:0; z-index:4; display:flex; align-items:center; justify-content:space-between; gap:1rem; padding-block:.7rem .9rem; pointer-events:none}
.hc-bottom > *{pointer-events:auto}
.hc .hero-cap{position:static; max-width:min(46rem, 100%); margin:0; padding:0; background:none; border-radius:0; text-align:left; font-size:.86rem; line-height:1.4; color:rgba(255,255,255,.92)}
.hc .hero-cap a{color:inherit; text-decoration:underline; text-decoration-color:rgba(255,255,255,.45); text-underline-offset:.22em}
.hc .hero-cap a:hover, .hc .hero-cap a:focus-visible{text-decoration-color:#fff}
.hc .hero-cap .hc-link{font:inherit; color:inherit; background:none; border:0; padding:0; margin:0; text-align:left; cursor:pointer; text-decoration:underline; text-decoration-color:rgba(255,255,255,.45); text-underline-offset:.22em}
.hc .hero-cap .hc-link:hover, .hc .hero-cap .hc-link:focus-visible{text-decoration-color:#fff}
.hc .hero-cap .hc-link:focus-visible{outline:2px solid #fff; outline-offset:2px}
.hc-ctrl{position:static; flex:none; display:flex; align-items:center; gap:.1rem; padding:.2rem; border-radius:999px; background:rgba(14,16,15,.6); color:#fff; -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px)}
.hc-ctrl[hidden]{display:none}
.hc-btn{width:2.6rem; height:2.6rem; padding:0; border:0; border-radius:999px; background:transparent; color:#fff; display:grid; place-items:center; cursor:pointer}
.hc-btn:hover{background:rgba(255,255,255,.18)}
.hc-btn:focus-visible{outline:2px solid #fff; outline-offset:1px}
.hc-btn .ic{width:1.15rem; height:1.15rem}
.hc-prev .ic{transform:rotate(180deg)}
.hc-count{min-width:4rem; text-align:center; font-size:.84rem; font-variant-numeric:tabular-nums; letter-spacing:.04em}
.hc-pp{display:block; width:.8rem; height:.85rem; border-left:3px solid #fff; border-right:3px solid #fff; box-sizing:border-box}
.hc-pause.paused .hc-pp{width:0; height:0; border-style:solid; border-width:.46rem 0 .46rem .78rem; border-color:transparent transparent transparent #fff; margin-left:.2rem}
.hc-bar{position:absolute; left:0; right:0; bottom:0; height:3px; z-index:5; background:rgba(255,255,255,.18)}
.hc-bar > span{display:block; height:100%; background:#fff; transform-origin:left; transform:scaleX(0)}
@keyframes hcBar{from{transform:scaleX(0)} to{transform:scaleX(1)}}
@media (max-width:700px){
  /* телефон: подпись во всю ширину снизу, кнопки — в правом верхнем углу фото */
  .hc-bottom{display:contents}
  .hc .hero-cap{position:absolute; z-index:4; left:max(18px, 4vw); right:max(18px, 4vw); bottom:.85rem; max-width:none}
  .hc-ctrl{position:absolute; z-index:4; right:10px; top:10px}
  .hc-btn{width:2.75rem; height:2.75rem}
  .hc-over .hero-title{max-width:100%}
  .hc::after{height:52%}
}
@media (max-width:560px){ .hc-over{padding-bottom:3.6rem} }
:root[data-scheme="contrast"] .hc{display:block; background:none}
:root[data-scheme="contrast"] .hc .ph, :root[data-scheme="contrast"] .hc::after, :root[data-scheme="contrast"] .hc-bottom, :root[data-scheme="contrast"] .hc-bar{display:none}
:root[data-scheme="contrast"] .hc-over{position:static; padding:1.6rem 0 0}
:root[data-scheme="contrast"] .hero .hc-over .hero-h1{color:var(--ink); text-shadow:none}
:root[data-scheme="contrast"] .hc-over .hero-kick{color:var(--muted)}
/* Строгий официальный вид главного экрана: без фотографий и карусели, заголовок на светлом фоне */
#hero .hc{display:block; background:none}
#hero .hc .ph, #hero .hc::after, #hero .hc-bottom, #hero .hc-bar{display:none}
#hero .hc-over{position:static; padding:clamp(1.5rem, 3vw, 2.4rem) 0 0}
#hero .hc-over .hero-kick{color:var(--muted); font-size:.95rem; letter-spacing:.01em}
#hero .hc-over .hero-h1{color:var(--ink); text-shadow:none; font-weight:600; font-size:clamp(1.75rem, 1rem + 2.3vw, 2.8rem); line-height:1.14; letter-spacing:-.012em}
#hero .hero-inner{padding-block:clamp(1.2rem, 2.4vw, 2rem) clamp(1.8rem, 3.4vw, 2.8rem) !important}
#hero{border-bottom:1px solid var(--line)}
/* ===== Ультраминимализм главной: меньше блоков, фото только в одной записи на блок, плотные отступы ===== */
[data-view="home"] .section{padding-block:clamp(1.3rem, 2.4vw, 2rem)}
[data-view="home"] .sec-head{margin-bottom:.8rem; gap:.3rem 1.5rem}
[data-view="home"] .sec-head h2, [data-view="home"] .h2, [data-view="home"] .cell-head h2, [data-view="home"] .hinfo-sec .h3{font-family:var(--sans); font-weight:600; font-size:1.05rem; letter-spacing:0; line-height:1.3}
[data-view="home"] .sec-head p, [data-view="home"] .region-text > p{display:none}
#hero .hero-ql, #hero .hero-btns, #hero .hero-adv{display:none}
:root.hero-on .fab-dock{translate:0 0; opacity:1; pointer-events:auto}   /* кнопок под поиском больше нет: плавающая кнопка «Помощник» видна сразу */
#hero .hero-inner{padding-block:1rem 1.6rem !important}
.visit .vcell{padding-block:1.1rem; gap:.35rem}
.visit .v-big{font-size:clamp(1.25rem, 1.9vw, 1.6rem)}
.visit .v-big.addr{font-size:clamp(1.1rem, 1.5vw, 1.35rem)}
.visit .vcell .phone-xl{font-size:min(clamp(1.2rem, 1.8vw, 1.5rem), 11cqi)}
.visit .week{display:none}
.need-sec .sec-head{margin-bottom:.4rem}
.need-sec .need{padding-block:.7rem}
[data-view="home"] #poll-box{padding-block:.5rem}
.story-sec{padding-block:clamp(.8rem, 1.6vw, 1.2rem)}
.story{gap:.7rem}
.story-lead{font-size:clamp(1.05rem, .9rem + .6vw, 1.3rem); line-height:1.4; max-width:44rem; letter-spacing:0}
.story-dates{display:none}
.region-grid{grid-template-columns:1fr; border-top:0; padding-top:0; gap:.6rem}
.region-links{display:flex; flex-wrap:wrap; gap:.3rem 1.2rem; border-top:0; margin:0}
.region-links li{list-style:none}
.region-links a{padding:.25rem 0; border-bottom:0; font-family:var(--sans); font-size:.95rem; gap:.4rem; color:var(--primary)}
.region-links a:hover{text-decoration:underline}
.hduo{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:1.2rem clamp(1.4rem, 4vw, 3.2rem); align-items:start}
.hduo-c[hidden]{display:none}
#home-docs, #home-expo{display:grid !important; grid-template-columns:minmax(0,1fr) !important; gap:0 !important}
#home-docs .hdoc, #home-expo .expo-card{flex-direction:row; align-items:stretch; height:auto}
#home-docs .hdoc-i, #home-expo .expo-cov{width:8.5rem; flex:none; aspect-ratio:4/3; height:auto; border-bottom:0; border-right:1px solid var(--line)}
#home-docs .hdoc-b, #home-expo .expo-b{padding:.7rem .9rem; justify-content:center}
@media (max-width:420px){ #home-docs .hdoc-i, #home-expo .expo-cov{width:6.5rem} }
@media (max-width:820px){ .hduo{grid-template-columns:minmax(0,1fr)} }

}

	// end code
	if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
		buffer.put(0, 4);
	}

	// padding
	while (buffer.getLengthInBits() % 8 !== 0) {
		buffer.putBit(false);
	}

	// padding
	while (true) {
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD0, 8);
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD1, 8);
	}

	return QRCode.createBytes(buffer, rsBlocks);
};

QRCode.createBytes = function(buffer, rsBlocks) {

	var offset = 0;
	
	var maxDcCount = 0;
	var maxEcCount = 0;
	
	var dcdata = new Array(rsBlocks.length);
	var ecdata = new Array(rsBlocks.length);
	
	for (var r = 0; r < rsBlocks.length; r++) {

		var dcCount = rsBlocks[r].dataCount;
		var ecCount = rsBlocks[r].totalCount - dcCount;

		maxDcCount = Math.max(maxDcCount, dcCount);
		maxEcCount = Math.max(maxEcCount, ecCount);
		
		dcdata[r] = new Array(dcCount);
		
		for (var i = 0; i < dcdata[r].length; i++) {
			dcdata[r][i] = 0xff & buffer.buffer[i + offset];
		}
		offset += dcCount;
		
		var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
		var rawPoly = new QRPolynomial(dcdata[r], rsPoly.getLength() - 1);

		var modPoly = rawPoly.mod(rsPoly);
		ecdata[r] = new Array(rsPoly.getLength() - 1);
		for (var x = 0; x < ecdata[r].length; x++) {
            var modIndex = x + modPoly.getLength() - ecdata[r].length;
			ecdata[r][x] = (modIndex >= 0)? modPoly.get(modIndex) : 0;
		}

	}
	
	var totalCodeCount = 0;
	for (var y = 0; y < rsBlocks.length; y++) {
		totalCodeCount += rsBlocks[y].totalCount;
	}

	var data = new Array(totalCodeCount);
	var index = 0;

	for (var z = 0; z < maxDcCount; z++) {
		for (var s = 0; s < rsBlocks.length; s++) {
			if (z < dcdata[s].length) {
				data[index++] = dcdata[s][z];
			}
		}
	}

	for (var xx = 0; xx < maxEcCount; xx++) {
		for (var t = 0; t < rsBlocks.length; t++) {
			if (xx < ecdata[t].length) {
				data[index++] = ecdata[t][xx];
			}
		}
	}

	return data;

};

module.exports = QRCode;

};

    el.addEventListener('click', e => {

      if (e.target.closest('.mpop-x') || !e.target.closest('.mpop')) close();

    const lons = ps.map(p => p.lon), lats = ps.map(p => p.lat);
    const fit = () => { if (ps.length > 1) map.fitBounds({southWest:[Math.min(...lons), Math.min(...lats)], northEast:[Math.max(...lons), Math.max(...lats)]}, {padding:{top:80, bottom:40, left:70, right:70}}); };

  },

  buildRaster(box) {

    const el = this.frame(box);

    ps.forEach(p => {

      mk[p.key || p.id] = DG.marker([p.lat, p.lon], {icon, title:p.name, zIndexOffset:p.main ? 1000 : 0}).addTo(map).bindPopup(popHTML(p)).on('click', () => { if (region) Br.select(p.key, true); });

    const fit = () => map.fitBounds(DG.latLngBounds(ps.map(p => [p.lat, p.lon])), {padding:[60, 60], maxZoom:16});

  lost(box) {

    const n = +(box.dataset.lost || 0) + 1; box.dataset.lost = String(n);
    delete box.dataset.ready; box.innerHTML = '';

  },
  raster(box) {

  mount(box) {

function mountMaps() {

function qrSVG(text) {
  try {
    if (!window.QRLib) return '';
    const qr = new window.QRLib(-1, 0);           // размер подбирается сам, коррекция ошибок M
    qr.addData(String.fromCharCode(...new TextEncoder().encode(text)));
    qr.make();
    const n = qr.getModuleCount(), m = 4; let d = '';
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (qr.isDark(r, c)) d += `M${c + m} ${r + m}h1v1h-1z`;
    return `<svg viewBox="0 0 ${n + 2 * m} ${n + 2 * m}" role="img" aria-label="${esc(t('memoQr'))}" shape-rendering="crispEdges"><rect width="100%" height="100%" fill="#FFFDF8"/><path d="${d}" fill="#2A2420"/></svg>`;
  } catch (e) { return ''; }
}

const TTS = {
  on: false,
  ok: 'speechSynthesis' in window && typeof SpeechSynthesisUtterance !== 'undefined',
  speak(text) {
    if (!this.ok) { toast(t('ttsNo')); return; }
    try {
      speechSynthesis.cancel();
      const code = {ru:'ru-RU', kz:'kk-KZ', en:'en-US'}[lang];
      const voices = speechSynthesis.getVoices() || [];
      const voice = voices.find(v => v.lang && v.lang.toLowerCase().startsWith(code.slice(0, 2))) || (lang === 'kz' ? voices.find(v => v.lang && v.lang.startsWith('ru')) : null);
      const parts = String(text).replace(/\s+/g, ' ').match(/[^.!?…]+[.!?…]*/g) || [];
      const chunks = []; let buf = '';
      parts.forEach(p => { if ((buf + p).length > 220) { if (buf) chunks.push(buf); buf = p; } else buf += p; });
      if (buf.trim()) chunks.push(buf);
      chunks.forEach((c, i) => {
        const u = new SpeechSynthesisUtterance(c.trim());
        u.lang = voice ? voice.lang : code; if (voice) u.voice = voice; u.rate = .92;
        if (i === chunks.length - 1) u.onend = () => this.set(false);
        speechSynthesis.speak(u);
      });
      this.set(true);
    } catch (e) { toast(t('ttsNo')); }
  },
  stop() { try { speechSynthesis.cancel(); } catch (e) {} this.set(false); },
  set(v) {
    this.on = v;
    const b = $('#speak-btn'); if (!b) return;
    b.setAttribute('aria-pressed', String(v));
    b.querySelector('use').setAttribute('href', v ? '#i-stop' : '#i-sound');
    b.querySelector('span').textContent = v ? t('stop') : t('speak');
  }
};

function ratingStats() {

  r.forEach(x => { const s = Math.round(x.stars); if (s >= 1 && s <= 5) { dist[s - 1]++; sum += s; } });

function rateSumHTML() {

const Fit = {
  keys: new WeakMap(),
  run(force) {
    $$('[data-fit]').forEach(el => {
      const inner = el.querySelector('.fit-in'); if (!inner || !el.getClientRects().length) return;
      const cs = getComputedStyle(el);
      const avail = el.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
      if (avail <= 0) return;
      const key = Math.round(avail) + '|' + innerHeight + '|' + inner.textContent;
      if (!force && this.keys.get(el) === key) return;
      el.style.fontSize = '100px';
      const w = inner.getBoundingClientRect().width; if (!w) return;
      let fs = avail / w * 100 * .995;
      const max = parseFloat(cs.getPropertyValue('--fit-max')), vh = parseFloat(cs.getPropertyValue('--fit-vh'));
      if (max) fs = Math.min(fs, max);
      if (vh) fs = Math.min(fs, Math.max(innerHeight * vh, 64));
      el.style.fontSize = fs.toFixed(2) + 'px';
      this.keys.set(el, key);
    });
  },
  init() {
    let raf = 0; const go = () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(() => this.run()); };
    addEventListener('resize', go);
    if ('ResizeObserver' in window) { const ro = new ResizeObserver(go); $$('[data-fit]').forEach(el => ro.observe(el)); }
    if (document.fonts) {
      if (document.fonts.ready) document.fonts.ready.then(() => this.run(true));
      if (document.fonts.addEventListener) document.fonts.addEventListener('loadingdone', () => this.run(true));
    }
    this.run(true);
  }
};

function vsub(k) {   // текст справки с подставленными адресом, телефонами и часами

    .replace(/\{rr\}/g, s.reading || '10:00–17:00').replace(/\{pa\}/g, pb.a).replace(/\{pp\}/g, (pb.p || []).join(', '));
}
function vtxt(k) {

function phCard(act, i, th, title, n) {
  return `<li><button type="button" class="ph-card" data-act="${act}" data-k="${i}"><span class="ph-img"><img src="${esc(th)}" alt="" loading="lazy" decoding="async"></span><b>${esc(title)}</b><small>${esc(fmt(t('photosN'), {n}))}</small></button></li>`;
}
function sameTitle(a, b) {   // «Президент РК Назарбаев Н.А. …» и «Президент РК Н. А. Назарбаев …» — один альбом
  const w = x => new Set(norm(x).split(/[^a-zа-яёәғқңөұүһі0-9]+/i).filter(z => z.length > 2));
  const A = w(a), B = w(b); let k = 0; A.forEach(z => { if (B.has(z)) k++; });
  return k / Math.max(1, Math.min(A.size, B.size)) >= .7;
}
const LB = {
  list: [], i: 0, title: '', src: '',
  open(list, title, src, start) {
    const d = $('#lb'); if (!d || !list.length) return;
    this.list = list; this.i = Math.min(start || 0, list.length - 1); this.title = title; this.src = src || ''; this.back = document.activeElement;
    $('#lb-t').textContent = title;
    const a = $('#lb-src'); a.hidden = !this.src;
    if (this.src) { const inn = this.src.startsWith('#'); a.href = this.src; if (inn) a.removeAttribute('target'); else a.target = '_blank'; a.firstElementChild.textContent = t(inn ? 'pgReadArt' : 'oldPage'); }
    this.show(); if (d.showModal) d.showModal(); else d.setAttribute('open', '');
  },
  show() {
    const p = this.list[this.i], img = $('#lb-img');
    img.src = p.s; img.alt = L(p.c) || this.title;
    $('#lb-cap').textContent = L(p.c) || '';
    $('#lb-n').textContent = fmt(t('lbCount'), {i:this.i + 1, n:this.list.length});
    $$('#lb .lb-nav').forEach(b => b.hidden = this.list.length < 2);
    const nx = this.list[(this.i + 1) % this.list.length]; if (nx) { const pre = new Image(); pre.src = nx.s; }
  },
  go(d) { this.i = (this.i + d + this.list.length) % this.list.length; this.show(); },
  close() { const d = $('#lb'); if (d && d.open) { d.close ? d.close() : d.removeAttribute('open'); } }
};
document.addEventListener('keydown', e => { const d = $('#lb'); if (!d || !d.open) return; if (e.key === 'ArrowRight') LB.go(1); else if (e.key === 'ArrowLeft') LB.go(-1); });
((f) => document.readyState === 'loading' ? document.addEventListener('DOMContentLoaded', f) : f())(() => {   // код запускается и после загрузки страницы (ТЗ 7.2)
  const d = $('#lb'); if (!d) return;
  d.addEventListener('close', () => { $('#lb-img').removeAttribute('src'); if (LB.back && LB.back.focus) LB.back.focus(); });
  d.addEventListener('click', e => { if (e.target === d) LB.close(); });
  $('#lb-src').addEventListener('click', () => { if (LB.src.startsWith('#')) LB.close(); });
  let x0 = null; d.addEventListener('pointerdown', e => { x0 = e.clientX; }); d.addEventListener('pointerup', e => { if (x0 != null && Math.abs(e.clientX - x0) > 60 && !e.target.closest('button,a')) LB.go(e.clientX < x0 ? 1 : -1); x0 = null; });
});
function flist(id, items, row, textOf, cls) {
  return `<div class="flist" data-flist="${id}">
    <label class="ffield"><svg class="ic"><use href="#i-search"/></svg><input type="search" data-filter="${id}" placeholder="${esc(t('filterPh'))}" aria-label="${esc(t('filterPh'))}" autocomplete="off"></label>

    <ul class="frows${cls ? ' ' + cls : ''}">${items.map(it => `<li data-txt="${esc(norm(textOf(it)))}">${row(it)}</li>`).join('')}</ul>

}
/* длинные списки показываем частями: меньше текста на экране, остальное — по кнопке или через фильтр */
function limitLists(root) {
  root.querySelectorAll('ul.frows, ul.dotlist, ul.ph-grid, ul.vgrid').forEach(ul => {
    if (ul.dataset.lim) return;
    const k = ul.classList.contains('frows') ? 12 : ul.classList.contains('ph-grid') || ul.classList.contains('vgrid') ? 9 : 8, n = ul.children.length;
    if (n <= k + 3) return;
    ul.dataset.lim = String(k); ul.classList.add('lim');
    [...ul.children].forEach((li, i) => { if (i >= k) li.classList.add('cut'); });
    const b = document.createElement('button'); b.type = 'button'; b.className = 'btn ghost more-btn'; b.dataset.act = 'list-all';
    b.textContent = fmt(t('showAllN'), {n}); ul.after(b);
  });
}
document.addEventListener('click', e => {
  const b = e.target.closest && e.target.closest('[data-act="list-all"]');
  if (b) { const ul = b.previousElementSibling; if (ul) { ul.dataset.open = '1'; ul.classList.add('all'); } b.hidden = true; return; }
  const li = e.target.closest && e.target.closest('.frows > li, .glist > li');
  if (li && !e.target.closest('a, button')) li.classList.toggle('x');
});
document.addEventListener('input', e => {
  const inp = e.target.closest && e.target.closest('[data-filter]'); if (!inp) return;
  const box = inp.closest('.flist'); const words = norm(inp.value).split(/\s+/).filter(Boolean);
  let n = 0;
  box.querySelectorAll('.frows > li').forEach(li => { const ok = words.every(w => li.dataset.txt.includes(w)); li.hidden = !ok; if (ok) n++; });
  box.querySelector('.fcount').textContent = fmt(t('found'), {n});
  box.querySelector('.fnone').hidden = n > 0;
  const ul = box.querySelector('.frows');
  if (ul && ul.dataset.lim) { const on = words.length > 0 || ul.dataset.open === '1'; ul.classList.toggle('all', on); const mb = ul.nextElementSibling; if (mb && mb.classList.contains('more-btn')) mb.hidden = on; }
});

    route:[`Главное здание архива: **${addr}**.\n\nНиже кнопка «Маршрут в 2ГИС»: там видно, на каком автобусе ехать и где выходить. Карта со всеми зданиями архива в разделе [«Контакты и карта»](#contacts).`,

    phone:[`**Приёмная:** ${phs}${s.email ? `, эл. почта ${s.email}` : ''}.\n\n**Справки о стаже и зарплате:** филиал по личному составу, ${pb.p.join(', ')}.\n\nЗвонить можно в рабочее время: пн – пт, ${s.open}–${s.close}. Телефоны филиалов во вкладке [«Здания и филиалы»](#visitors/branches).`,

           `**Reception:** ${phs}${s.email ? `, email ${s.email}` : ''}.\n\n**Employment and salary certificates:** personnel records branch, ${pb.p.join(', ')}.\n\nCall during opening hours: Mon – Fri, ${s.open}–${s.close}. Branch phones: [Buildings and branches](#visitors/branches).`],
    genealogy:[`Как искать сведения о предках:\n1. Соберите всё, что известно: ФИО (и прежние фамилии), год и место рождения, где жил и работал.\n2. Проверьте базы архива «Книга памяти» и «Оставь свой след в истории».\n3. Закажите архивную справку или копию документа на [eGov.kz](${eg}).\n4. Поработайте в читальном зале: пн – пт, ${s.reading || '10:00–17:00'}.\n\nПодробно во вкладке [«Поиск предков»](#visitors/genealogy).`,
               `Ата-баба туралы мәліметті қалай іздеу керек:\n1. Белгілі мәліметтің бәрін жинаңыз: аты-жөні (бұрынғы тегі де), туған жылы мен жері, қайда тұрып, жұмыс істегені.\n2. Архивтің «Еске алу кітабы» және «Тарихта ізіңді қалдыр» базаларын қараңыз.\n3. [eGov.kz](${eg}) арқылы архивтік анықтама немесе құжат көшірмесін сұратыңыз.\n4. Оқу залында жұмыс істеңіз: дс – жм, ${s.reading || '10:00–17:00'}.\n\nТолығырақ [«Ата-баба іздеу»](#visitors/genealogy) бетінде.`,
               `How to trace your ancestors:\n1. Collect what you know: full name (and former surnames), year and place of birth, where they lived and worked.\n2. Check the archive databases: the Book of Memory and notable people.\n3. Order an archive certificate or a copy on [eGov.kz](${eg}).\n4. Research in the reading room: Mon – Fri, ${s.reading || '10:00–17:00'}.\n\nStep by step: [Family history](#visitors/genealogy).`],
    reading:[`**Читальный зал** работает понедельник – пятница, ${s.reading || '10:00–17:00'}. Там есть электронный каталог фондов, аппарат для микрофильмов и сканер. Перед визитом позвоните: ${ph}. Подробнее во вкладке [«Читальный зал»](#visitors/reading).`,
             `**Оқу залы** дүйсенбі – жұма, ${s.reading || '10:00–17:00'} жұмыс істейді. Онда қорлардың электрондық каталогы, микрофильм аппараты және сканер бар. Келер алдында қоңырау шалыңыз: ${ph}. Толығырақ [«Оқу залы»](#visitors/reading) бетінде.`,

    history:[`Государственный архив ВКО образован в **1940 году**. Область появилась раньше, в 1932 году. В 1991 году архиву передали здание бывшего партийного архива, а с 2009 года архив и его филиалы работают как самостоятельные учреждения. Подробнее во вкладке [«История»](#about/history).`,
             `ШҚО мемлекеттік архиві **1940 жылы** құрылды. Облыс одан бұрын, 1932 жылы құрылған. 1991 жылы архивке бұрынғы партия архивінің ғимараты берілді, ал 2009 жылдан бастап архив пен оның филиалдары дербес мекеме ретінде жұмыс істейді. Толығырақ [«Тарих»](#about/history) бетінде.`,
             `The State Archive of EKR was founded in **1940**; the region itself dates from 1932. In 1991 the archive received the former party archive building, and since 2009 the archive and its branches have worked as independent institutions. More in [History](#about/history).`],
    branches:[`У архива ${(SITE.branches || []).length} филиалов:\n` + (SITE.branches || []).map(b => `- **${b.n}**: ${b.a.replace(/^\d{6},\s*/, '')}${b.p && b.p[0] ? ', тел. ' + b.p[0] : ''}`).join('\n') + `\n\nВсе адреса и телефоны — в разделе [«Филиалы и контакты»](#contacts).`,
              `Архивтің төрт филиалы бар: жеке құрам бойынша Өскемен, Зайсан, Риддер және «Алтай». Мекенжайлар мен телефондар [«Ғимараттар мен филиалдар»](#visitors/branches) бетінде.`,
              `The archive has four branches: Oskemen personnel records, Zaysan, Ridder and Altai. Addresses and phones: [Buildings and branches](#visitors/branches).`],
    store:[`В архиве хранятся:\n- документы органов власти: решения исполкомов, акиматов, советов;\n- документы заводов, совхозов и колхозов;\n- документы по личному составу закрытых организаций;\n- документы школ, больниц, учреждений культуры;\n- фотографии и киносъёмки;\n- личные фонды известных земляков.\n\nПодробнее во вкладке [«Что хранится»](#fonds/store), личные фонды можно найти по фамилии во вкладке [«Личные фонды»](#fonds/personal).`,
           `Архивте мыналар сақталады:\n- билік органдарының құжаттары: атқару комитеттерінің, әкімдіктердің, кеңестердің шешімдері;\n- зауыттардың, совхоздар мен колхоздардың құжаттары;\n- таратылған ұйымдардың жеке құрамы бойынша құжаттар;\n- мектептердің, ауруханалардың, мәдениет мекемелерінің құжаттары;\n- фотосуреттер мен кинотүсірілімдер;\n- белгілі жерлестеріміздің жеке қорлары.\n\nТолығырақ [«Не сақталады»](#fonds/store) бетінде.`,
           `The archive keeps:\n- records of government bodies: executive committees, akimats, councils;\n- records of factories, state farms and collective farms;\n- personnel records of organisations that have closed;\n- records of schools, hospitals and cultural institutions;\n- photographs and film;\n- personal collections of notable local people.\n\nMore in [What we keep](#fonds/store).`],
    about:[`Государственный архив ВКО собирает и хранит документы о жизни Восточного Казахстана, следит за их сохранностью и делает их доступными для людей. По документам архива подтверждают стаж и зарплату, с ними работают историки и краеведы. Подробнее в разделе [«Об архиве»](#about).`,
           `ШҚО мемлекеттік архиві Шығыс Қазақстанның өмірі туралы құжаттарды жинап, сақтайды, олардың сақталуын қадағалайды және халыққа қолжетімді етеді. Архив құжаттары бойынша өтіл мен жалақы расталады, олармен тарихшылар мен өлкетанушылар жұмыс істейді. Толығырақ [«Архив туралы»](#about) бөлімінде.`,
           `The State Archive of EKR collects and keeps records of life in East Kazakhstan, looks after them and makes them available. Its records are used to confirm employment and salary, and historians work with them. More in [About](#about).`],
    cert:[`Архивная справка, копия или выписка: это госуслуга. Закажите её на [eGov.kz](${eg}) или в ЦОН.\n\nСправки о **стаже и зарплате** готовит филиал по личному составу: ул. ${pb.a}, тел. ${pb.p.join(', ')}.\n\nПодробно во вкладке [«Архивная справка»](#visitors/cert).`,
          `Архивтік анықтама, көшірме немесе үзінді: бұл мемлекеттік қызмет. Оны [eGov.kz](${eg}) арқылы немесе ХҚКО-да сұратыңыз.\n\n**Өтіл мен жалақы** туралы анықтамаларды жеке құрам бойынша филиал дайындайды: ${pb.a} көшесі, тел. ${pb.p.join(', ')}.\n\nТолығырақ [«Архивтік анықтама»](#visitors/cert) бетінде.`,
          `An archive certificate, copy or extract is a public service: order it on [eGov.kz](${eg}) or at a Public Service Center.\n\n**Employment and salary** certificates come from the personnel records branch: ${pb.a}, tel. ${pb.p.join(', ')}.\n\nDetails: [Archive certificate](#visitors/cert).`],
    appeal:[`Этот сайт не принимает обращения. Обращения в государственные органы подаются через [eOtinish.kz](https://eotinish.kz), справки оформляются на [eGov.kz](${eg}).`,
            `Бұл сайт өтініш қабылдамайды. Мемлекеттік органдарға өтініштер [eOtinish.kz](https://eotinish.kz) арқылы беріледі, анықтамалар [eGov.kz](${eg}) сайтында рәсімделеді.`,
            `This website doesn't accept requests. Requests to government bodies go through [eOtinish.kz](https://eotinish.kz); certificates are handled on [eGov.kz](${eg}).`],
    review:[`Нажмите «Оставить отзыв» справа на экране. Там можно оценить сайт и сделать запись в гостевой книге.`,
            `Экранның оң жағындағы «Пікір қалдыру» батырмасын басыңыз. Онда сайтты бағалап, қонақ кітабына жазба қалдыруға болады.`,

    hello:[`Здравствуйте! Чем помочь? Подскажу, как получить справку и искать сведения о предках, где находится архив и когда он работает. Могу найти и любую информацию на сайте.`,

           `Hello! How can I help? I can explain how to get a certificate or trace your ancestors, where the archive is and when it's open, and find anything on the site.`],
    thanks:[`Пожалуйста! Если появятся вопросы, пишите.`, `Оқасы жоқ! Сұрақтарыңыз болса, жазыңыз.`, `You're welcome! Write any time.`],
    none:[`Точного ответа я не нашёл. Спросите, например: «как получить справку о стаже», «как найти сведения о предках» или «где находится архив». Можно поискать по сайту кнопкой «Поиск» в меню. Или позвоните: ${ph} (пн – пт, ${s.open}–${s.close}).`,
          `Нақты жауап таба алмадым. Мысалы, былай сұраңыз: «архив қайда орналасқан», «қашан жұмыс істейсіздер» немесе «архивте не сақталады». Немесе қоңырау шалыңыз: ${ph} (дс – жм, ${s.open}–${s.close}).`,

function md(src) {
  const inline = s => s
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\[([^\]]+)\]\(((?:https?:\/\/|#)[^\s)]+)\)/g, (m, txt, url) => url.startsWith('#') ? `<a href="${url}">${txt}</a>` : `<a href="${url}" target="_blank" rel="noopener">${txt}</a>`)
    .replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>');
  let html = '', list = null;
  esc(src).split('\n').forEach(raw => {
    const l = raw.trim();
    const ul = l.match(/^[-•*]\s+(.*)/), ol = l.match(/^\d+[.)]\s+(.*)/);
    if (ul || ol) {
      const type = ul ? 'ul' : 'ol';
      if (list !== type) { if (list) html += `</${list}>`; html += `<${type}>`; list = type; }
      html += `<li>${inline((ul || ol)[1])}</li>`; return;
    }
    if (list) { html += `</${list}>`; list = null; }
    if (!l) return;
    const h = l.match(/^#{1,4}\s+(.*)/);
    html += h ? `<p><strong>${inline(h[1])}</strong></p>` : `<p>${inline(l)}</p>`;
  });
  if (list) html += `</${list}>`;
  return html;
}

async function compressImage(file, opt) {
  opt = opt || {};   // sides — длинные стороны по очереди, max — предел размера data-URL (для фото зданий меньше: они едут в /api/public)
  const url = URL.createObjectURL(file), max = opt.max || 235000;
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    for (const side of opt.sides || [1280, 1024, 820]) {
      const k = Math.min(1, side / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      for (const q of [0.82, 0.72, 0.62, 0.5]) { const d = c.toDataURL('image/jpeg', q); if (d.length < max) return d; }
    }
    return null;
  } finally { URL.revokeObjectURL(url); }
}
