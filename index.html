.page-head.pano.has-img{background:#1b1d1c; margin-bottom:1.6rem}
.page-head.pano.has-img .ph{display:block; position:absolute; inset:0; margin:0}
.page-head.pano.has-img .ph > img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:var(--pos, 50% 50%); filter:none; transform:none}
.page-head.pano.has-img .ph::before, .page-head.pano.has-img .ph::after{display:none}
.page-head.pano.has-img::after{display:block; content:""; position:absolute; inset:0; background:linear-gradient(180deg, rgba(12,14,13,0) 35%, rgba(12,14,13,.72) 100%); pointer-events:none}
.page-head.pano.has-img .pano-in{position:relative; z-index:1; min-height:clamp(14rem, 30vw, 24rem); display:flex; align-items:flex-end; padding-block:2rem}
.page-head.pano.has-img h1{color:#fff}
.page-head.pano + .wrap.page{padding-top:0}
:root[data-scheme="contrast"] .page-head.pano h1{color:var(--primary)}

/* --- вкладки разделов --- */
.hub-tabs{display:flex; flex-wrap:wrap !important; overflow:visible !important; gap:0 1.6rem; border-bottom:1px solid var(--line); margin-bottom:clamp(1.8rem, 3vw, 2.6rem)}
.hub-tabs button{position:relative; min-height:3rem; padding:0; border:0; border-bottom:0; margin:0; background:none; color:var(--muted); font:inherit; font-size:.98rem; font-weight:400; letter-spacing:0; text-transform:none; white-space:nowrap; cursor:pointer}
.hub-tabs button::after{content:""; position:absolute; left:0; right:0; bottom:-1px; height:2px; background:var(--primary); transform:scaleX(0); transform-origin:left; transition:transform .3s cubic-bezier(.2,.7,.1,1)}
.hub-tabs button:hover{color:var(--ink)}
.hub-tabs button[aria-selected="true"]{color:var(--ink); font-weight:600}
.hub-tabs button[aria-selected="true"]::after{transform:none}
.hub-tabs button:focus-visible{outline:3px solid var(--focus); outline-offset:2px}
@media (max-width:720px){ .hub-tabs{gap:0 1.1rem} .hub-tabs button{white-space:normal; text-align:left; min-height:2.9rem; line-height:1.3; padding-block:.4rem} }
.tab-panel h2, .tab-panel h2.h-big{font-family:var(--display); font-weight:400; font-size:clamp(1.5rem, 2.4vw, 2rem); text-transform:none; letter-spacing:-.012em; line-height:1.15; margin-bottom:1rem}
.tab-panel:focus-visible{outline:3px solid var(--focus); outline-offset:8px}
.tab-panel.enter{animation:panelIn .45s ease-out both}
@keyframes panelIn{from{opacity:0} to{opacity:1}}
.hub-main{max-width:44rem}
.hub-main p, .prose p{line-height:1.65}
.hcard h3, .bcard h3, .glist b, .yearlist b, .frows li b, .gloss dt, .tl h3{font-family:var(--display); font-weight:500}
.hcard .ic2{width:2rem; height:2rem}
.lead-p{color:var(--muted); font-size:1.05rem}
.ru-note{font-size:.88rem}
details.more > summary{font-family:var(--display); font-weight:500; color:var(--primary)}
.tl::before{width:1px; background:var(--line-strong)}
.tl li::after{width:11px; height:11px; border:2px solid var(--primary); left:calc(3.6rem - 5px); top:1rem; background:var(--bg)}
.tl .yr{background:transparent; color:var(--ink); border:0; font-family:var(--display); font-weight:400; font-size:1.25rem; place-items:center start; padding-left:0; height:auto}
.tl li{grid-template-columns:7.2rem minmax(0,1fr)}
@media (max-width:480px){ .tl li{grid-template-columns:4.8rem minmax(0,1fr); gap:.9rem} .tl::before{left:2.4rem} .tl li::after{left:calc(2.4rem - 5px)} .tl .yr{font-size:1.05rem} }
.tl-short b{color:var(--ink); font-weight:400}
.faq details{background:transparent; border-radius:0; border-bottom:1px solid var(--line)}
.faq{gap:0; border-top:1px solid var(--line)}
.faq summary{padding:1.05rem 0; font-weight:600}
.faq details[open] summary{border-bottom:0}
.faq .ans{padding:0 0 1.2rem}
.faq summary::after{color:var(--primary); font-weight:400}
.search-res a{border:0; border-bottom:1px solid var(--line); border-radius:0; padding:.8rem .2rem}
.search-res a:hover, .search-res a:focus-visible{background:var(--soft)}
.search-res mark{background:var(--tint); color:inherit}
.search-box{border-radius:10px; box-shadow:0 30px 80px -30px rgba(10,20,15,.45)}
.search-field{border-color:var(--ink); border-radius:999px; padding:0 1.1rem}
.contact-card{padding:1.6rem}
.addr-big{font-weight:500}
.map-routes .btn.ghost{color:var(--ink)}
.symbols .sym{padding:1.6rem}
.logo-meaning li b{font-weight:600}
.news-item h3{font-weight:500; font-size:1.2rem}
.news-col{gap:1rem}

/* каталоги — строки через тонкую линию */
.frows{gap:0 2.4rem !important}
.frows li{background:transparent !important; border:0 !important; border-top:1px solid var(--line) !important; border-radius:0 !important; padding:.95rem 0 1rem !important; cursor:pointer}
.frows li b{line-height:1.3}
.frows li > span, .frows li > small, .glist li > span{display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; overflow:hidden}
.frows li.x > span, .frows li.x > small, .glist li.x > span{display:block; -webkit-line-clamp:unset; overflow:visible}
.glist li{cursor:pointer}
ul.lim:not(.all) > li.cut{display:none}
.more-btn{margin:1.2rem 0 1.6rem; align-self:flex-start; justify-self:start; width:auto !important}
.dotlist{gap:.5rem 2.4rem}
.news-item:has(details) > p:not(.news-date){display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:3; overflow:hidden}
.news-item:has(details[open]) > p:not(.news-date){display:block; -webkit-line-clamp:unset; overflow:visible}

/* --- подвал: архивный зелёный --- */
.site-foot{position:relative; background:var(--foot-bg); color:var(--foot-ink); border-top:0}
.site-foot .wrap{display:block; padding-block:0; font-size:.95rem}
.foot-top{display:grid !important; grid-template-columns:minmax(0,1.7fr) minmax(0,1fr) minmax(0,1fr); gap:2.4rem 3rem; padding-block:clamp(3rem, 6vw, 4.6rem) 2.6rem !important}
.foot-name{margin:0 0 1.2rem; font-family:var(--display); font-weight:400; font-size:clamp(1.5rem, 2.4vw, 2.1rem); line-height:1.15; letter-spacing:-.012em; color:var(--foot-ink); max-width:24rem}
.foot-big{margin:.15rem 0; font-family:var(--sans); font-size:1rem; line-height:1.5; color:var(--foot-ink); opacity:1 !important}
.site-foot .ft{margin:0 0 .9rem; font-family:var(--sans); font-weight:600; font-size:.9rem; letter-spacing:0; text-transform:none; color:var(--foot-muted)}
.site-foot a{color:var(--foot-ink); text-decoration:none}
.site-foot a:hover{text-decoration:underline; color:var(--foot-ink)}
.site-foot ul{gap:.55rem}
.site-foot ul a{font-size:1rem}
#foot-phones{color:var(--foot-ink); font-variant-numeric:lining-nums}
.foot-word{display:none}
.foot-bottom{display:flex !important; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:1rem 2rem; padding-block:1.3rem 1.7rem !important; border-top:1px solid var(--foot-line); font-size:.84rem; color:var(--foot-muted)}
.foot-bottom p{margin:0}
.foot-brand{margin:0; gap:.7rem}
.foot-brand svg{width:2.2rem; height:2.2rem}
.foot-brand .ft{margin:0; font-family:var(--display); font-size:.92rem; font-weight:400; color:var(--foot-ink)}
.foot-btns{display:flex; flex-direction:column; gap:.6rem; margin-top:1.2rem; align-items:flex-start}
.foot-btns .btn, .site-foot .foot-btn{background:transparent; color:var(--foot-ink); border:1px solid var(--foot-line); border-radius:999px; min-height:2.8rem; padding:0 1.1rem; font-size:.9rem; font-weight:600; letter-spacing:0; text-transform:none}
.foot-btns .btn:hover, .site-foot .foot-btn:hover{border-color:var(--foot-ink); background:transparent}
@media (max-width:900px){ .foot-top{grid-template-columns:minmax(0,1fr) !important} }
:root[data-scheme="contrast"] .site-foot{background:#000; border-top:3px solid var(--primary)}

/* --- плавающие кнопки, окна --- */
.fab{border-radius:999px; border:0; background:var(--primary); color:var(--primary-ink); font-weight:600; letter-spacing:0; box-shadow:0 16px 36px -14px rgba(10,30,20,.55)}
.fab:hover{background:var(--primary-hover); color:var(--primary-ink)}
.side-tab{display:none !important}
.fab-dock{position:fixed; right:max(16px, 2vw); bottom:max(16px, 2vw); z-index:40; display:flex; align-items:stretch; gap:.5rem; transition:translate .45s cubic-bezier(.2,.7,.1,1), opacity .35s}
.fab-dock .fab{position:static !important}
.fab-fb{min-width:3.8rem; display:grid; place-items:center; padding:0; background:var(--bg); color:var(--ink); border:1px solid var(--line-strong); border-radius:999px; cursor:pointer; box-shadow:0 16px 36px -14px rgba(10,30,20,.4)}
.fab-fb .ic{width:1.3rem; height:1.3rem}
.fab-fb:hover{border-color:var(--ink)}
.fab-dock:has(#fab[hidden]) .fab-fb{display:none}
:root.hero-on .fab-dock{translate:0 160%; opacity:0; pointer-events:none}
@media (max-width:720px){ .fab-dock{display:none !important} }
.drawer-head, .chat-head{background:var(--primary); color:var(--primary-ink)}
.drawer-head button, .chat-head button{border-width:1px; border-radius:999px}
.chat, .drawer, .search-box, .modal-box{border-radius:10px}
.drawer{border-radius:0; border-left:1px solid var(--line)}
.msg{border-radius:12px}
.msg.bot{background:var(--soft); border:0}
.chat-log{background:var(--bg)}
.toast{border-radius:999px; font-weight:600}
.bottom-bar{background:color-mix(in srgb, var(--bg) 96%, transparent); -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px); border-top:1px solid var(--line); grid-template-columns:repeat(4, minmax(0,1fr)) !important}
.bottom-bar a, .bottom-bar button{color:var(--ink); font-weight:600}
.bottom-bar .ic{color:var(--primary)}
.bottom-bar a span, .bottom-bar button span{max-width:100%; text-align:center; line-height:1.1; overflow-wrap:anywhere}
:root[data-scheme="contrast"] .bottom-bar{background:#000; border-top:3px solid var(--primary)}
:root[data-scheme="contrast"] .bottom-bar a, :root[data-scheme="contrast"] .bottom-bar button{color:var(--primary)}

/* --- переход между страницами: короткое затухание --- */
.topbar{view-transition-name:vt-top} .site-head{view-transition-name:vt-head}
.bottom-bar{view-transition-name:vt-bbar} .fab-dock{view-transition-name:vt-dock}
::view-transition-group(*){animation-duration:0s}
::view-transition-old(root){animation:vtOut .25s ease-in both}
::view-transition-new(root){animation:vtIn .35s ease-out both}
@keyframes vtOut{to{opacity:0}}
@keyframes vtIn{from{opacity:0}}
.rv{opacity:1; transform:none}

/* --- ничего не вылезает за рамки --- */
.modal{grid-template-columns:minmax(0,1fr)}
.drawer-body .tabs{flex-wrap:wrap} .drawer-body .tabs button{white-space:normal; text-align:left}
@media (max-width:480px){
  .hours, .hours tbody{display:block}
  .hours tr{display:flex; flex-wrap:wrap; justify-content:space-between; align-items:baseline; gap:0 1rem; border-bottom:1px solid var(--line); padding:.5rem 0}
  .hours th, .hours td{display:block; border:0 !important; padding:0 !important}
  .hours td{margin-left:auto}
}

/* ===== разделы по ТЗ: каталог, архив памяти, выставки, филиалы, справка ===== */

.za-cols{display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%, 20rem), 1fr)); gap:1rem; margin-top:1rem}
.za-bars{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:.35rem; font-size:.85rem}
.za-bars li{display:grid; grid-template-columns:minmax(0, 9rem) 1fr auto; gap:.6rem; align-items:center}
.za-bars span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.za-bars i{display:block; height:.55rem; width:var(--w); min-width:2px; background:var(--primary); border-radius:99px}
.za-bars b{font-variant-numeric:tabular-nums}
.za-ocr-out{display:grid; grid-template-columns:minmax(0, 16rem) minmax(0,1fr); gap:1rem; align-items:start}
.za-ocr-out img{width:100%; border-radius:6px; border:1px solid var(--line)}
@media (max-width:720px){ .za-ocr-out{grid-template-columns:1fr} }
.za-table-wrap{overflow:auto; max-height:70vh; border:1px solid var(--line); border-radius:8px; margin-top:1rem}
.za-table{width:100%; border-collapse:collapse; font-size:.85rem}
.za-table th, .za-table td{padding:.5rem .7rem; border-bottom:1px solid var(--line); text-align:left; vertical-align:top}
.za-table th{position:sticky; top:0; background:var(--surface)}
.note.ok{background:var(--ok-bg); color:var(--ok)}
.news-tools{display:flex; flex-direction:column; gap:.7rem; margin:0 0 1.4rem}
.news-tools .ffield{max-width:32rem}
.pg-rel{margin-top:2rem} .pg-rel h2{font-size:1.2rem; margin-bottom:.6rem}
.pg-share{margin-top:1.4rem}
/* верхняя полоса с переключателем темы: подписи прячем раньше, чтобы ничего не уходило за край */
.cat-it-b .pill, .cat-card-k .pill, .expo-cb .pill{white-space:normal; max-width:100%; overflow-wrap:anywhere; text-align:left}
/* своя карта на плитках 2ГИС */
.tmap{overflow:hidden; background:#F4F1EA; touch-action:none; cursor:grab; outline-offset:-4px}
.tmap.drag{cursor:grabbing}
.tmap-tiles, .tmap-pins, .tmap-pop{position:absolute; left:0; top:0; width:0; height:0}
.tmap-t{position:absolute; left:0; top:0; width:256px; height:256px; max-width:none; opacity:0; transition:opacity .25s; user-select:none; -webkit-user-drag:none; pointer-events:none}
.tmap-t.on{opacity:1}
.tmap-pin{position:absolute; left:0; top:0; width:0; height:0}
.tmap-pin .pin2{position:absolute; left:-16px; top:-42px}
.tmap-pin.main .pin2{left:-20px; top:-52px}
.tmap-pin.main{z-index:2}
.tmap-pop{z-index:5}
.tmap-zoom{position:absolute; right:12px; top:12px; display:flex; flex-direction:column; background:#fff; border-radius:6px; box-shadow:0 1px 4px rgba(0,0,0,.25); overflow:hidden; z-index:6}
.tmap-zoom button{width:2.4rem; height:2.4rem; border:0; background:#fff; color:#2A2420; font:400 1.4rem/1 var(--sans); cursor:pointer}
.tmap-zoom button + button{border-top:1px solid #E3DDD2}
.tmap-zoom button:hover{background:#F1ECE4}
.tmap-attr{position:absolute; right:8px; bottom:6px; z-index:6; font:600 .72rem/1 var(--sans); color:#5A5048 !important; background:rgba(255,255,255,.8); padding:.25rem .4rem; border-radius:4px; text-decoration:none}
.tmap.far .tmap-pin.city .pin2 b{display:none}
.tmap.far .tmap-pin.main .pin2 b{left:auto; right:calc(100% + .3rem)}
.tmap.far .tmap-pin.reg .pin2 b{right:auto; left:calc(100% + .3rem)}

/* header socials, home catalog search, about links */
.head-soc:empty{display:none}
.soc.head{margin:0; gap:.15rem; flex-wrap:nowrap}
.soc.head a{min-height:2.25rem; min-width:2.25rem; padding:.2rem; border:0; justify-content:center; color:inherit}
.soc.head span{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0)}
@media (max-width:1100px){ .head-soc{display:none} }
#hs-cat{white-space:nowrap}
@media (max-width:640px){ #hs-cat span{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0)} }
/* поиск на главной: кнопки не должны съедать поле ввода, иначе подсказка «Фамилия, район, тема…» обрезается на полуслове.
   Смотрим на ширину самого блока поиска, а не окна: он стоит в узкой правой колонке, а там тесно и на широком экране */
.hero-find{container-type:inline-size}
.hero-search input{text-overflow:ellipsis}
@container (max-width: 34rem) {
  .hero-search > .ic{display:none}
  .hero-search{padding-left:1rem}
  #hs-cat{padding-inline:.85rem}
  #hs-cat span{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0)}
  #hs-cat .ic{display:block; width:1.3rem; height:1.3rem}   /* в поиске главной значки кнопок скрыты: без этого кнопка «В каталоге» осталась бы пустой */
}
.about-links{margin-top:1.4rem; padding:1rem 1.2rem; border:1px solid var(--line-strong); border-radius:12px}
.about-links h3{font-size:1.05rem; margin:0 0 .6rem}
.about-links ul{list-style:none; margin:0; padding:0; display:grid; gap:.35rem}
.about-links a{display:inline-flex; align-items:center; gap:.5rem; min-height:2.75rem; font-weight:700; color:var(--primary)}

.cat-th.cat-lock{display:grid; place-items:center; color:var(--muted); background:var(--paper-2, rgba(127,127,127,.08))}
.cat-th.cat-lock .ic{width:1.8rem; height:1.8rem}
.cat-lim{margin:1.2rem 0}
.za-dups{margin:1rem 0; padding:1rem 1.2rem; border:1px solid var(--line-strong); border-radius:12px; max-height:28rem; overflow:auto}
.za-dups ol{margin:.5rem 0 0; padding-left:1.4rem; display:grid; gap:.6rem}
.za-dups ul{margin:.25rem 0 0; padding-left:1rem; font-size:.9rem}
.za-dups code{overflow-wrap:anywhere}

/* структура сайта, языки, интеграции (ТЗ 6.2) */
#za-nav input[type=text]{min-width:7.5rem;width:100%}
#za-nav td,#za-nav th{vertical-align:middle}
.za-nav-mv{white-space:nowrap}
.za-nav-mv .btn{min-width:2.4rem;padding-inline:.5rem}
.za-langs{display:flex;flex-wrap:wrap;gap:.6rem 1.6rem}
.za-chk{display:flex;gap:.55rem;align-items:center;font-weight:500}
.za-int td.sm{max-width:34rem}
.za-int .btn{margin-inline-start:.4rem}

/* уведомления о согласовании (ТЗ 6.7) */
.za-notes summary{display:flex;gap:.5rem;align-items:center;cursor:pointer}
.za-notes-l{list-style:none;margin:.6rem 0;padding:0;display:grid;gap:.35rem}
.za-notes-l li{display:flex;flex-wrap:wrap;gap:.35rem .8rem;align-items:center;padding:.4rem .6rem;border-radius:8px}
.za-notes-l li.new{background:color-mix(in srgb,var(--accent,#7a5a3e) 10%,transparent)}
.za-notes-l li span{flex:1 1 18rem}
.za-notes-l small{color:var(--muted,#667);min-width:7.5rem}

/* историческая карта (ТЗ 8.3) */
.hmap-box{height:min(68vh,560px);margin:1rem 0;border-radius:14px;overflow:hidden}
.hmap-box .gis-map{height:100%}
.hm-chips{margin-top:.8rem}
.pin2.hm-town path{fill:#2f6f8f}.pin2.hm-building path{fill:#8a5a2b}.pin2.hm-industry path{fill:#5b5f66}.pin2.hm-heritage path{fill:#9a3b5c}.pin2.hm-place path{fill:#8a6d3b}.pin2.hm-event path{fill:#b23a2e}
.mpop .hm-ph{display:block;max-width:100%;max-height:150px;object-fit:cover;border-radius:6px;margin:.3rem 0}
.mpop .hm-recs{margin:.25rem 0;padding-inline-start:1.1rem;font-size:.85rem;max-width:280px}
.mpop .hm-d{font-size:.88rem;max-width:280px}
.hm-list{columns:2 16rem;padding-inline-start:1.1rem}
.hm-list li{break-inside:avoid;margin:.2rem 0}
.hmap-box .tmap.far .tmap-pin.city .pin2.hm-big b{display:block}
#hmap .gis-map{height:100%;min-height:0;max-height:none}
.hmap-box{position:relative}
.hmap-box{height:min(74vh,620px);background:#eef0e8}

/* мой кабинет (ТЗ 8.1) */
#my-root{display:grid;gap:1rem}
.my-sec h2{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.my-list{list-style:none;margin:.4rem 0;padding:0;display:grid;gap:.15rem}
.my-list li{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.3rem 1rem;padding:.45rem 0;border-bottom:1px solid var(--line,#e3e3dc)}
.my-list li>a{flex:1 1 20rem}
.my-list small{flex:0 0 auto}
.my-act{display:flex;gap:.4rem;align-items:center;flex-wrap:wrap}
.my-addto{max-width:13rem;font:inherit;font-size:.85rem;padding:.3rem .4rem}
.my-form{display:flex;flex-wrap:wrap;gap:.5rem;margin:.6rem 0}
.my-form input{flex:1 1 14rem;min-width:0;font:inherit;padding:.45rem .6rem}
.my-subs{display:flex;flex-wrap:wrap;gap:.4rem 1.4rem}
.my-chk{display:inline-flex;gap:.45rem;align-items:center}
.my-col{border:1px solid var(--line,#e3e3dc);border-radius:10px;padding:.5rem .8rem;margin:.5rem 0}
.my-col summary{cursor:pointer}
.my-q{list-style:none;padding:0;display:flex;flex-wrap:wrap;gap:.4rem}
.nav-my{position:relative;text-decoration:none}
.nav-my-n{position:absolute;top:-.25rem;right:-.25rem;min-width:1.15rem;height:1.15rem;padding:0 .25rem;border-radius:999px;background:#b23a2e;color:#fff;font-size:.7rem;line-height:1.15rem;text-align:center}
.site-head .nav-my{margin-left:0}
.nav-my-li{display:none}
@media (max-width:560px){ .site-head .nav-my{display:none} .nav-my-li{display:list-item} }

/* хронология: материалы года (ТЗ 8.2) */
.mem-yr{margin:.35rem 0 0}
.mem-yr a{display:inline-flex;gap:.35rem;align-items:center}
.mem-ph3{list-style:none;display:flex;flex-wrap:wrap;gap:.4rem;padding:0;margin:.45rem 0 0}
.mem-ph3 img{display:block;width:92px;height:68px;object-fit:cover;border-radius:6px}
/* рекомендации в кабинете (ТЗ 8.4) */
.my-why{margin:.2rem 0 .6rem}

/* временный первый кадр заставки до основного скрипта (ТЗ 7.2) */
.hc .hs-boot{position:absolute;inset:0;z-index:0;overflow:hidden}
.hc .hs-boot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}

/* ===== замечания команды к главной (11.11) ===== */
/* верхняя строка (время работы, языки) и шапка видны всегда: обе липкие, шапка сразу под верхней строкой (--tb-h считает tz.js) */
.topbar{position:sticky; top:0; z-index:32}
.site-head{top:var(--tb-h, 0px) !important}
html{scroll-padding-top:calc(var(--tb-h, 0px) + var(--sh-h, 0px) + .75rem)}
/* «умная» обложка: см. pfImg() в tz.js */
.pf{position:relative; overflow:hidden}
.pf > .pf-bg{position:absolute; inset:-10%; width:120%; height:120%; max-width:none; object-fit:cover; filter:blur(18px) saturate(.9) brightness(.82); opacity:0; transition:opacity .25s; pointer-events:none}
.pf.pf-fit > .pf-bg{opacity:1}
.pf > .pf-img{position:relative; width:100%; height:100%; object-fit:cover; display:block}
.pf.pf-fit > .pf-img{object-fit:contain}
.expo-cov.pf > .pf-img, .hdoc-i.pf > .pf-img{width:100%; height:100%}
.hdoc-i.pf{aspect-ratio:4/3}
/* главная: ровно 4 карточки — 4 / 2 / 1 в ряд, без одиноких карточек */
#home-expo, #home-docs{grid-template-columns:repeat(4, minmax(0, 1fr))}
@media (max-width:1000px){ #home-expo, #home-docs{grid-template-columns:repeat(2, minmax(0, 1fr))} }
@media (max-width:560px){ #home-expo, #home-docs{grid-template-columns:1fr} }
/* новости на главной — с фото */
.news-mini a{flex-direction:row !important; align-items:center !important; gap:1rem !important}
.news-mini .nm-ph{display:block; flex:none; width:6.5rem; aspect-ratio:4/3; border-radius:6px; background:var(--soft)}
.news-mini .nm-tx{display:flex; flex-direction:column; gap:.3rem; min-width:0}
/* текст поверх фото заставки: затемнение снизу, чтобы белые надписи читались и на светлых снимках */
.hc .ph::after{content:''; position:absolute; left:0; right:0; bottom:0; height:62%; z-index:2; pointer-events:none; background:linear-gradient(to top, rgba(0,0,0,.62), rgba(0,0,0,.28) 55%, rgba(0,0,0,0))}
:root[data-scheme="contrast"] .hc .ph::after{display:none}
.pf > .pf-img{position:absolute !important; inset:0; width:100% !important; height:100% !important}
/* время работы видно на любой ширине (раньше пряталось до 900 px) */
@media (max-width:900px){ .topbar .spacer{display:none} .topbar .status{display:block !important; flex:1 1 0; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-size:.78rem} }
.topbar .status .st-short{display:none}
@media (max-width:560px){ .topbar .status .st-long{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap} .topbar .status .st-short{display:inline} }
/* пометка «прототип для хакатона» (не официальный сайт): в верхней строке и в подвале */
.proto-foot{margin:0 auto; padding-block:.9rem; font-size:.86rem; color:var(--foot-ink); border-top:1px solid var(--foot-line)}
@media (max-width:560px){ .topbar .theme-btn{display:none} .topbar .status{min-width:3.4rem} }

/* услуги, антикоррупция, календарь дат (дополнение к ТЗ от 10.11.2026) */
.svc, .cmp, .cal, .norm{display:grid; gap:1rem; max-width:62rem}
.svc-sec{padding:1rem 1.2rem; border-radius:10px; background:var(--soft)}
.svc-sec h2, .cmp h2, .cal h2, .norm h2{margin:0 0 .4rem}
.svc .btn-row, .norm .btn-row{margin-top:.6rem}
.svc-checked{margin:0}
.cmp h3{margin:1rem 0 .3rem}
.cmp-n{padding:.8rem 1rem; border-radius:10px; background:var(--soft)}
.cmp-n h4{margin:0 0 .4rem; font-size:1.02rem}
.cmp-n p{margin:.35rem 0}
.cmp-docs{list-style:none; margin:0; padding:0; display:grid; gap:.5rem}
.cmp-docs li{padding:.6rem .8rem; border-radius:8px; background:var(--soft)}
.cmp-alt{display:block; font-size:.88rem; color:var(--muted); margin-top:.2rem}
.cmp-off{margin:.4rem 0}
.cal-years{margin:.4rem 0}
.cal-ctl{display:flex; flex-wrap:wrap; gap:.6rem 1rem; align-items:center}
.cal-ctl select, .cal-ctl input{font:inherit; padding:.45rem .6rem; min-height:2.6rem}
.cal-rows{list-style:none; margin:0; padding:0; display:grid; gap:.1rem}
.cal-rows li{display:grid; grid-template-columns:9.5rem 1fr; gap:.2rem 1rem; padding:.5rem 0; border-bottom:1px solid var(--line)}
.cal-d{font-variant-numeric:tabular-nums}
.cal-m h3{margin:1.2rem 0 .2rem; font-family:var(--serif)}
.cal-near{padding:.6rem 1rem; border-radius:10px; background:var(--soft)}
.cal-near h3{margin:.2rem 0}
.cal-oldh{margin:1.4rem 0 .3rem}
@media (max-width:560px){ .cal-rows li{grid-template-columns:1fr} }

/* прейскурант платных услуг (вкладка «Услуги») */
.prc{display:grid; gap:.9rem; margin-top:1rem; padding-top:1rem; border-top:1px solid var(--line)}
.prc h3{margin:0; font-family:var(--serif)}
.prc-note{align-items:flex-start}
.prc-know{margin:.3rem 0 0; padding-left:1.1rem; display:grid; gap:.4rem}
.prc-rest{margin-top:.3rem}
.prc-rest summary{cursor:pointer; font-weight:600}
.prc-rest ul{margin:.3rem 0 0; padding-left:1.1rem; display:grid; gap:.3rem}
.prc-ctl{display:flex; flex-wrap:wrap; gap:.6rem 1rem; align-items:center}
.prc-ctl select{font:inherit; padding:.45rem .6rem; min-height:2.6rem; max-width:100%}
.prc-quick{margin:0}
.prc-sec{border:1px solid var(--line); border-radius:10px; background:var(--surface)}
.prc-sec + .prc-sec{margin-top:.2rem}
.prc-sec summary{cursor:pointer; padding:.8rem 1rem; display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:.2rem .8rem; align-items:baseline; font-weight:600}
.prc-sn{font-family:var(--serif); color:var(--primary)}
.prc-sec summary small{color:var(--muted); font-weight:400; font-variant-numeric:tabular-nums}
.prc-t{width:100%; border-collapse:collapse; font-size:.92rem}
.prc-t th{text-align:left; font-size:.8rem; color:var(--muted); font-weight:600; padding:.5rem .6rem; border-top:1px solid var(--line); border-bottom:1px solid var(--line)}
.prc-t td{padding:.5rem .6rem; vertical-align:top; border-bottom:1px solid var(--line)}
.prc-t .prc-i{width:5.6rem; color:var(--muted); font-variant-numeric:tabular-nums; white-space:nowrap}
.prc-t .prc-u{width:11rem; color:var(--muted)}
.prc-t th:last-child, .prc-t .prc-p{width:9.6rem; text-align:right; white-space:nowrap}
.prc-t .prc-p{font-variant-numeric:tabular-nums; font-weight:600}
.prc-t .h td{background:var(--soft)}
.prc-t .h .prc-n{font-weight:600}
.prc-t .d1 .prc-n{padding-left:1.4rem} .prc-t .d2 .prc-n{padding-left:2.2rem} .prc-t .d3 .prc-n{padding-left:3rem} .prc-t .d4 .prc-n{padding-left:3.8rem}
@media (max-width:700px){
  .prc-t thead{display:none}
  .prc-t, .prc-t tbody{display:block}
  .prc-t tr{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:.1rem .8rem; padding:.55rem .8rem; border-bottom:1px solid var(--line)}
  .prc-t tr.h{background:var(--soft)}
  .prc-t td{display:block; padding:0; border:0; width:auto}
  .prc-t td, .prc-t .prc-n{background:transparent}
  .prc-t .prc-i{grid-column:1; font-size:.78rem; width:auto}
  .prc-t .prc-n{grid-column:1}
  .prc-t .prc-u{grid-column:1; font-size:.84rem; width:auto}
  .prc-t .prc-p{grid-column:2; grid-row:1 / span 3; align-self:center; width:auto}
  .prc-t .prc-p:empty{display:none}
  .prc-t .d1 .prc-n, .prc-t .d2 .prc-n, .prc-t .d3 .prc-n, .prc-t .d4 .prc-n{padding-left:.6rem}
}
.svc, .prc{grid-template-columns:minmax(0,1fr)}
.svc > *, .prc > *{min-width:0}
.prc-ctl .cat-sel{min-width:0; max-width:100%}
.prc-ctl select{width:100%; max-width:100%}
.prc-sec summary .prc-st{overflow-wrap:anywhere}
.prc-note > div{min-width:0; flex:1}
@media (max-width:560px){ .prc-note{flex-direction:column; gap:.3rem} .prc-know{padding-left:1rem} }

/* хлебные крошки на внутренних страницах */
.crumbs-v{margin:0 0 1.1rem}
.crumbs-v[hidden]{display:none}
.crumbs [aria-current="page"]{color:var(--ink); font-weight:600; overflow-wrap:anywhere}
.crumbs a:hover{color:var(--primary)}

.za-brinfo{margin-bottom:1rem}

/* окошко Instagram */
.sf-pop{position:fixed; z-index:90; display:flex; flex-direction:column; background:var(--surface); color:var(--ink); border:1px solid var(--line-strong); border-radius:10px; box-shadow:0 12px 40px rgba(0,0,0,.22); overflow:hidden}
.sf-pop[hidden]{display:none}
.sf-hd{display:flex; align-items:center; justify-content:space-between; gap:.6rem; padding:.7rem .9rem; border-bottom:1px solid var(--line)}
.sf-hd h2{margin:0; display:flex; align-items:center; gap:.5rem; font-size:1rem; font-weight:600}
.sf-hd .ic{width:1.2rem; height:1.2rem}
.sf-x{border:0; background:none; color:var(--ink); font-size:1.6rem; line-height:1; width:2.2rem; height:2.2rem; border-radius:6px; cursor:pointer}
.sf-x:hover{background:var(--soft)}
.sf-x:focus-visible, .sf-it:focus-visible{outline:3px solid var(--focus); outline-offset:-3px}
.sf-list{list-style:none; margin:0; padding:.3rem 0; overflow-y:auto; overscroll-behavior:contain; flex:1 1 auto}
.sf-it{display:flex; gap:.7rem; padding:.6rem .9rem; color:inherit; text-decoration:none}
.sf-it:hover{background:var(--soft)}
.sf-it img{flex:none; width:4.6rem; height:4.6rem; object-fit:cover; border-radius:6px; background:var(--soft)}
.sf-b{min-width:0; display:flex; flex-direction:column; gap:.25rem}
.sf-m{display:flex; align-items:center; gap:.5rem; font-size:.8rem; color:var(--muted)}
.sf-t{font-size:.88rem; line-height:1.4; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden}
.sf-ft{padding:.7rem .9rem; border-top:1px solid var(--line); display:flex; flex-direction:column; gap:.5rem}
.sf-ft p{margin:0; font-size:.8rem; line-height:1.4}
@media (max-width:560px){ .sf-pop{left:8px !important; right:8px !important; width:auto !important; top:auto !important; bottom:8px !important; max-height:78vh !important} }

/* оценка страницы, опрос, статистика */
.rate{display:flex; flex-wrap:wrap; align-items:center; gap:.5rem 1.2rem; padding-block:1.2rem; border-top:1px solid var(--line); margin-top:2rem}
.rate[hidden], .poll-sec[hidden]{display:none}
.rate p{margin:0}
.rate-q{font-weight:600}
.rate-stars{display:flex; gap:.15rem}
.rate-stars button{border:0; background:none; padding:.3rem; color:var(--primary); cursor:pointer; border-radius:6px}
.rate-stars button .ic{width:1.7rem; height:1.7rem}
.rate-stars:hover button .ic{fill:currentColor}
.rate-stars button:hover ~ button .ic{fill:none}
.rate-stars button:focus-visible{outline:3px solid var(--focus); outline-offset:2px}
.rate-done{display:flex; align-items:center; gap:.5rem; color:var(--muted)}
.rate-done .ic{width:1.2rem; height:1.2rem; fill:var(--primary)}
.poll-sec{margin-block:2.6rem}
.poll-card{background:var(--soft); border-radius:10px; padding:1.4rem 1.6rem}
.poll-card .eyebrow{margin:0}
.poll-q{font-size:1.1rem; margin:.2rem 0 .8rem}
.poll-opts{display:flex; flex-wrap:wrap; gap:.5rem}
.poll-res{list-style:none; margin:.4rem 0 .8rem; padding:0; display:grid; gap:.5rem; max-width:34rem}
.poll-res li{position:relative; display:flex; justify-content:space-between; gap:1rem; padding:.45rem .7rem; background:var(--soft); border-radius:6px; overflow:hidden; isolation:isolate}
.poll-res li i{position:absolute; inset:0 auto 0 0; width:var(--w); background:color-mix(in srgb, var(--primary) 22%, transparent); z-index:-1}
.st-lead{max-width:48rem}
.st-cards{display:grid; grid-template-columns:repeat(auto-fill, minmax(11rem, 1fr)); gap:.8rem; margin:1.2rem 0 1.8rem}
.st-card{background:var(--soft); border-radius:8px; padding:1rem 1.1rem; display:flex; flex-direction:column; gap:.2rem}
.st-card b{font-family:var(--serif); font-size:1.9rem; font-weight:500; color:var(--primary); font-variant-numeric:tabular-nums}
.st-card span{color:var(--muted); font-size:.9rem}
.st-cols{display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%, 22rem), 1fr)); gap:1.6rem 2.4rem; margin-bottom:1.6rem}
.st-days{list-style:none; margin:.6rem 0; padding:0; display:flex; align-items:flex-end; gap:.3rem; height:8rem}
.st-days li{flex:0 1 2.2rem; height:100%; display:flex; align-items:flex-end}
.st-days i{display:block; width:100%; height:var(--h); background:var(--primary); border-radius:3px 3px 0 0; opacity:.85}
.st-best{list-style:none; margin:.4rem 0; padding:0; display:grid; gap:.4rem}
.st-best li{display:flex; justify-content:space-between; gap:1rem; padding:.45rem 0; border-bottom:1px solid var(--line)}
.st-best b{white-space:nowrap; font-weight:600}

/* ===== блочная система: плитки, фильтры под кнопкой ===== */
.bl-h{font-family:var(--display, var(--serif)); font-weight:500; font-size:1.3rem; margin:2rem 0 .8rem}
.bl-grid{list-style:none; margin:0; padding:0; display:grid; grid-template-columns:repeat(auto-fill, minmax(min(100%, 17rem), 1fr)); gap:1rem}
.bl-card{display:flex; flex-direction:column; gap:.35rem; padding:1.05rem 1.15rem; border:1px solid var(--line); border-radius:12px; background:var(--surface); color:var(--ink); text-decoration:none; min-width:0; line-height:1.4; overflow-wrap:anywhere}
a.bl-card:hover{border-color:var(--primary); box-shadow:0 4px 14px rgba(10,30,50,.08); text-decoration:none}
.bl-card > b{font-family:var(--display, var(--serif)); font-weight:500; font-size:1.08rem; line-height:1.25}
.bl-card > span, .bl-card > small{color:var(--muted); font-size:.92rem}
.bl-card .ic2{width:2rem; height:2rem; margin-bottom:.2rem}
.bl-go{margin-top:auto; padding-top:.5rem; font-style:normal; font-weight:600; font-size:.92rem; color:var(--primary); display:inline-flex; align-items:center; gap:.35rem}
.bl-go .ic{width:.95rem; height:.95rem}
.bl-dbs{grid-template-columns:repeat(auto-fill, minmax(min(100%, 20rem), 1fr))}
.bl-ext{align-self:flex-start; font-style:normal; font-size:.72rem; font-weight:700; letter-spacing:.05em; padding:.1rem .45rem; border:1px solid var(--line-strong); border-radius:4px; color:var(--muted)}
.bl-file > b{font-size:1rem; display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden}
.bl-grid.frows{gap:1rem !important}
.bl-grid.frows > li{background:var(--surface) !important; border:1px solid var(--line) !important; border-radius:12px !important; padding:1.05rem 1.15rem !important; cursor:pointer}
.bl-grid.frows > li:hover{border-color:var(--primary) !important}
.bl-grid.frows > li > b a{color:var(--ink); text-decoration:none}
.bl-grid.frows > li > b a:hover{color:var(--primary); text-decoration:underline}
/* каталог: всё лишнее — под кнопку «Фильтры» */
.cat-layout{display:block; margin-top:1rem}
.cat-tools{align-items:center; gap:.5rem 1.2rem}
.cat-tools .cat-n{margin:0}
.cat-how{margin-left:auto; font-size:.9rem}
.cat-badge{display:inline-grid; place-items:center; min-width:1.35rem; height:1.35rem; padding:0 .3rem; margin-left:.4rem; border-radius:999px; background:var(--primary); color:var(--primary-ink); font-size:.75rem; font-weight:700}
.cat-act{display:flex; flex-wrap:wrap; align-items:center; gap:.4rem}
.cat-act .chip{min-height:2rem; padding:.2rem .7rem; background:var(--tint)}
.cat-clear{background:none; border:0; padding:.3rem .4rem; color:var(--primary); font:inherit; font-size:.88rem; text-decoration:underline; cursor:pointer}
.cat-panel{display:flex; flex-direction:column; gap:1rem; border:1px solid var(--line); border-radius:12px; padding:1.1rem 1.2rem; margin:0; background:var(--soft)}
.cat-panel[hidden]{display:none}
.cat-grp-h{margin:0 0 .4rem; font-size:.76rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--muted)}
.cat-panel .chip{min-height:2.2rem; padding:.2rem .8rem; font-size:.86rem}
.cat-panel .chip[aria-pressed="true"]{background:var(--primary); border-color:var(--primary); color:var(--primary-ink)}
.cat-panel .chip[aria-pressed="true"] small{color:inherit}
.cat-row{display:flex; flex-wrap:wrap; align-items:center; gap:.6rem 1.6rem}
.cat-exact > summary{cursor:pointer; font-weight:600; font-size:.92rem; padding:.3rem 0}
.cat-exact .cat-adv{margin-top:.6rem; background:var(--surface)}
/* результаты каталога — плитки */
.cat-main > .cat-res{display:grid; grid-template-columns:repeat(auto-fill, minmax(min(100%, 15.5rem), 1fr)); gap:1rem}
.cat-main > .cat-res .cat-it{position:relative; display:flex; flex-direction:column; gap:0; padding:0; border:1px solid var(--line); border-radius:12px; overflow:hidden; background:var(--surface)}
.cat-main > .cat-res .cat-it:last-child{border-bottom:1px solid var(--line)}
.cat-main > .cat-res .cat-it:hover{border-color:var(--primary); box-shadow:0 4px 14px rgba(10,30,50,.08)}
.cat-main > .cat-res .cat-th{aspect-ratio:4/3; width:100%; border-radius:0}
.cat-main > .cat-res .cat-th.ic-only, .cat-main > .cat-res .cat-th.cat-lock{aspect-ratio:auto; display:flex; justify-content:flex-start; padding:.85rem 1rem 0; background:none}
.cat-main > .cat-res .cat-it-b{padding:.75rem 1rem 1rem}
.cat-main > .cat-res .cat-it-t::after{content:""; position:absolute; inset:0}
.cat-main > .cat-res .cat-star{position:absolute; top:.5rem; right:.5rem; z-index:1; width:2.4rem; height:2.4rem}

/* свёрнутые длинные тексты во вкладках справки */
.oldfold{margin-top:1.6rem; border-top:1px solid var(--line)}
.oldfold > summary{cursor:pointer; font-weight:600; padding:1rem 0; color:var(--primary)}
.oldfold > .oldsrc{padding-bottom:1rem}

/* архив памяти: поиск на виду, остальное под кнопкой */
.mem-q{margin:0 0 .8rem}
.mem-tools{margin:0 0 .6rem}
.mem-fp{margin:0 0 1.2rem}
.mem-fp .mem-filters{margin:0}
.mem-pubs2 .bl-card > b{font-size:1rem; display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden}

/* карточки выставок и новостей */
.expo-card{border:1px solid var(--line); border-radius:12px; background:var(--surface)}
.expo-card:hover{border-color:var(--primary)}
.news-col{display:grid; grid-template-columns:repeat(auto-fill, minmax(min(100%, 19rem), 1fr)); gap:1.2rem; max-width:none; align-items:start}
.news-item{position:relative; padding:0; gap:0; border:1px solid var(--line); border-radius:12px; overflow:hidden; background:var(--surface)}
.news-item:not(.has-cover){padding:1.1rem 1.2rem}
.news-item.has-cover{display:flex; flex-direction:column; gap:0}
.news-item .news-cover{aspect-ratio:16/10; border-radius:0; width:100%}
.news-item .news-body{padding:.9rem 1.1rem 1.1rem; display:flex; flex-direction:column; gap:.35rem}
.news-item h3{font-size:1.08rem; line-height:1.3}
.news-item h3 a{color:var(--ink); text-decoration:none}
.news-item h3 a::after{content:""; position:absolute; inset:0}
.news-item:hover{border-color:var(--primary)}
.news-item:hover h3 a{color:var(--primary); text-decoration:underline}
.news-item:not(:has(details[open])) .news-body > p:not(.news-date):not(.news-more){display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden}
.news-tools{margin:0 0 1.2rem}
.news-item:not(:has(details[open])) .news-body > p:not(.news-date):not(.news-more) ~ p:not(.news-more){display:none}

/* «Филиалы и контакты»: карточка места и маршрут — блоки */
.br-card{margin-top:1.2rem; gap:1.2rem; align-items:stretch}
.br-info{padding:1.2rem 1.4rem 1.4rem; border:1px solid var(--line); border-radius:12px; background:var(--surface); overflow:hidden}
.br-photo{margin:-1.2rem -1.4rem .6rem; border:0; border-radius:0}
.br-info .hours{margin-top:.2rem}
.br-route{border:1px solid var(--line); border-radius:12px; background:var(--surface); padding:1.2rem 1.4rem}
.br-route{align-self:start}

/* «Об архиве» и «Издания» блоками */
.vgrid li{display:flex; flex-direction:column; gap:.35rem; padding:0 0 .9rem; border:1px solid var(--line); border-radius:12px; overflow:hidden; background:var(--surface)}
.vgrid .pg-video{max-width:none; margin:0; border-radius:0}
.vgrid li > b{padding:.2rem .95rem 0; font-family:var(--display, var(--serif)); font-weight:500; font-size:1rem; line-height:1.3; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden}
.vgrid li > p{margin:0; padding:0 .95rem; color:var(--muted); font-size:.86rem}
ul.vgrid.lim:not(.all) > li.cut{display:none}
.oldfold > .inst-gal, .oldfold > .symbols, .oldfold > .logo-meaning{margin-top:.4rem; margin-bottom:1rem}

/* ===== ОФОРМЛЕНИЕ v4: строгий официальный вид (рекомендация мониторинга). Палитра: бежевый, пастельное золото, пастельный коричневый; без зелёного ===== */
:root{ --gilt:#D8BC8A; --gilt-text:var(--primary) }
:root[data-scheme="light"]{ --gilt:#C9A961 }
::selection{background:var(--primary); color:var(--primary-ink)}
h1, h2, h3{letter-spacing:-.012em; text-wrap:balance}
/* шапка: тонкая линия, без эффектов */
.site-head{box-shadow:none; border-bottom:1px solid var(--line)}
.topbar{background:var(--soft)}
.site-nav a:hover{color:var(--primary)}
/* главный экран: плоская песочная полоса (светлая схема) или тёмно-коричневая (тёмная) */
:root[data-scheme="light"] #hero{background:#E9DCBE; color:#33241A; padding-bottom:1.6rem}
:root[data-scheme="light"] #hero .hero-kick{color:#6B5640; font-weight:600; font-size:.9rem; letter-spacing:0; text-transform:none}
:root[data-scheme="light"] #hero .hero-h1{color:#33241A}
:root[data-scheme="light"] #hero .hero-alt, :root[data-scheme="light"] #hero .hero-text{color:#5A4938}
:root[data-scheme="light"] #hero .hero-search{background:#FFFFFF; border:2px solid #7A5A3E; box-shadow:none}
:root[data-scheme="light"] #hero .hero-search input{color:#2B221B}
:root[data-scheme="light"] #hero .hero-search input::placeholder{color:#6B5E50}
:root[data-scheme="dark"] #hero{background:#2B2218; color:#F2EADC; padding-bottom:1.6rem}
:root[data-scheme="dark"] #hero .hero-kick{color:#D8BC8A; font-weight:600; font-size:.9rem; letter-spacing:0; text-transform:none}
:root[data-scheme="dark"] #hero .hero-h1{color:#FFFFFF}
:root[data-scheme="dark"] #hero .hero-alt, :root[data-scheme="dark"] #hero .hero-text{color:#CFC3AE}
:root[data-scheme="dark"] #hero .hero-search{background:#FFFFFF; border:2px solid #D8BC8A; box-shadow:none}
:root[data-scheme="dark"] #hero .hero-search input{color:#2B221B}
:root[data-scheme="dark"] #hero .hero-search input::placeholder{color:#6B5E50}
/* карточки: тонкая рамка, небольшое скругление, без теней и подъёма */
.blk-feat, .blk-ph, .bl-card, .news-item, .expo-card, .cat-it, .br-info, .br-route, .hdoc, .bcard, .hcard, .vgrid li{box-shadow:none}
.bl-card, .news-item, .expo-card, .cat-it, .br-info, .br-route, .vgrid li, .blk-feat, .blk-ph{border-radius:8px}
a.bl-card:hover, .news-item:hover, .expo-card:hover, .cat-it:hover, .vgrid li:hover{border-color:var(--primary)}
.btn.ghost:hover{background:var(--tint)}
/* вкладки: выбранная подчёркнута пастельным золотом */
.hub-tabs [role="tab"][aria-selected="true"], .mem-tabs a[aria-selected="true"]{box-shadow:inset 0 -3px 0 var(--gilt)}

/* ===== ТИПОГРАФИКА v3: крупнее, плотнее, жирнее; цветные заголовки и акценты (как на крупных госсайтах: заголовки читаются с первого взгляда) ===== */
html{font-size:calc(19px * var(--scale))}
body{line-height:1.62}
/* заголовки: жирная Lora, разделы — цветом */
:root:not([data-scheme="contrast"]) main :is(h1, h2, h3, h4){font-family:var(--display); font-weight:700 !important; letter-spacing:-.018em}
:root:not([data-scheme="contrast"]) main :is(h2, .cell-head h2, .sec-head h2){color:var(--primary)}
.tz-head h1, .page-head.pano h1{font-size:clamp(2.4rem, 1rem + 3.6vw, 4rem); line-height:1.04; font-weight:700}
#hero .hero-h1{font-size:clamp(2.1rem, .9rem + 3.4vw, 3.7rem); line-height:1.06; font-weight:700}
/* названия в карточках и списках */
.bl-card > b, .vgrid li > b, .cat-it-t, .expo-cb b, .blk-card b, .blk-ov b, .news-item h3, .hdoc-b b, .mem-people b, .br-list b, .hcard h3, .bcard h3, .glist b, .frows li b, .news-mini b{font-weight:700 !important}
.blk-list b, .blk-imp a{font-weight:600}
.blk-ov b{font-size:clamp(1.3rem, 2.1vw, 1.8rem)}
/* подписи-«колпачки» и даты: золотисто-коричневые, жирные */
.kicker, .eyebrow, .news-date, .v-l, .blk time, .blk-list time, .cat-grp-h, .chips-l{color:var(--primary); font-weight:600; letter-spacing:0; text-transform:none; font-size:.88rem}
.blk-ov time{color:rgba(255,255,255,.92)}
.visit .v-big{font-weight:700}
/* навигация и кнопки */
.site-nav a{font-weight:600; font-size:1.02rem}
.btn, .chip, .tabs [role="tab"], .mem-tabs a{font-weight:600}
.pill{font-weight:700; background:var(--tint); color:var(--primary)}
.chip[aria-pressed="true"]{font-weight:700}
/* ссылки в текстах: цветные, жирные, с золотым подчёркиванием */
:is(.prose, .pg-body, .hub-main, .about-links, .faq .ans, .news-body) a:not(.btn):not(.bl-card):not(.chip){color:var(--primary); font-weight:600; text-decoration-color:var(--gilt); text-decoration-thickness:2px; text-underline-offset:.2em}
:is(.prose, .pg-body, .hub-main, .faq .ans) a:not(.btn):not(.bl-card):hover{background:var(--tint)}
/* цифры и счётчики */
.stats-strip b, .blk-imp h3{font-weight:700}
.hero-kick{font-weight:700}
.brand .t1, .brand .t2{font-weight:700; color:var(--primary)}

/* шрифт заголовков: PT Serif Bold (кириллица с казахскими буквами); если файла нет, подставляется Lora */
:root{ --head:"PT Serif","Lora",Georgia,"Times New Roman",serif }
:root:not([data-scheme="contrast"]) main :is(h1, h2, h3, h4), #hero .hero-h1, .tz-head h1, .page-head.pano h1, .brand .t1, .brand .t2,
.bl-card > b, .vgrid li > b, .cat-it-t, .expo-cb b, .blk-card b, .blk-ov b, .news-item h3, .hdoc-b b, .mem-people b, .hcard h3, .bcard h3, .glist b, .frows li b, .news-mini b, .blk-imp h3, .stats-strip b{font-family:var(--head)}
/* строгий вид: заголовки блоков главной крупнее, плашки типов компактнее */
.cell-head h2, .sec-head h2{font-size:clamp(1.4rem, 1rem + 1.2vw, 1.9rem)}
.pill{font-size:.78rem; font-weight:600; border-radius:6px; padding:.12rem .55rem; line-height:1.35}
[data-view="home"] .cell-head h2, [data-view="home"] .sec-head h2{font-size:clamp(1.4rem, 1rem + 1.2vw, 1.9rem); font-weight:700}
@media (max-width:640px){ .visit .vcell a, .visit .v-s{font-size:.86rem; overflow-wrap:anywhere} .visit .vcell{padding-right:.6rem; min-width:0} }
:root[data-scheme="dark"] #hero .hero-search :is(button, a):not([type="submit"]){color:#2B221B; border-color:#9A8D74}

/* ===== по отзыву пользователя ===== */
/* шапка: меню делит всю ширину поровну; в верхней строке слева статус и телефон, справа значки и язык */
@media (min-width:1000px){ .site-nav > ul, .site-nav ul#nav-list{display:flex; justify-content:space-between; width:100%} }
/* подвал: четыре колонки на всю ширину */
@media (min-width:901px){ .foot-top{grid-template-columns:minmax(0,1.6fr) repeat(3, minmax(0,1fr)) !important} }
/* названия в карточках, списках и результатах показываем целиком, без «…» */
.bl-file > b, .vgrid li > b, .mem-pubs2 .bl-card > b, .blk-card b, .blk-list b, .blk-ov b, .news-mini b, #home-news b, .search-res b, .search-res small{display:block !important; -webkit-line-clamp:unset !important; overflow:visible !important}
/* заголовки чёрные (цвет текста); коричневый остаётся в акцентах: даты, плашки, цифры, «Важно», подчёркивание вкладок */
:root:not([data-scheme="contrast"]) main :is(h1, h2, h3, h4, .cell-head h2, .sec-head h2){color:var(--ink)}
:root:not([data-scheme="contrast"]) main .blk-imp h3, :root:not([data-scheme="contrast"]) main .stats-strip b{color:var(--primary)}
.brand .t1, .brand .t2{color:var(--ink)}
:root[data-scheme="light"] #hero .hero-h1{color:#1B1510}

/* главная: место под новости резервируется заранее, чтобы блоки ниже не «прыгали», когда приходят данные (ТЗ 7.2: сдвиги вёрстки) */
@media (min-width:1101px){ .blk-main{min-height:33rem} #home-list{min-height:22rem} }
@media (min-width:761px) and (max-width:1100px){ .blk-main{min-height:34rem} #home-list{min-height:22rem} }
@media (max-width:760px){ .blk-main{min-height:46rem} #home-list{min-height:22rem} }

/* главная: первая новость приходит с сервера сразу в HTML на трёх языках (server.js, newsBoot); нужную подпись показывает язык страницы, его ставит ранний скрипт шапки */
#home-feat .lg{display:none}
:root[lang="ru"] #home-feat .lg.ru, :root[lang="kk"] #home-feat .lg.kz, :root[lang="en"] #home-feat .lg.en{display:inline}

/* главная: первая новость приходит с сервера сразу в HTML, а тексты над ней (часы, телефон, адрес, заголовок «Новости») подставляют скрипты позже.
   Чтобы картинка не съезжала вниз, под эти тексты зарезервировано столько места, сколько они занимают (высоты сняты на ширинах 360–1350 пкс).
   align-content: пока в сетке одна новость, её строка не растягивается на всю резервную высоту (иначе подпись оказывалась внизу и потом «прыгала») */
.blk-main{align-content:start}
@media (max-width:760px){ .visit{min-height:13.1rem} }
@media (min-width:761px) and (max-width:900px){ .visit{min-height:17.8rem} }

.news-sec .cell-head{min-height:1.84rem}

/* ниже первого экрана (блок документов на главной и подвал) раскладка и отрисовка откладываются, пока блок не окажется рядом с экраном: быстрее старт на телефоне.
   contain-intrinsic-size — высота-заглушка (сняты реальные высоты); после первого показа браузер запоминает настоящую (auto) */
.hduo-sec, .site-foot{content-visibility:auto}
@media (max-width:760px){ .hduo-sec{contain-intrinsic-size:auto 35rem} .site-foot{contain-intrinsic-size:auto 80rem} }
@media (min-width:761px) and (max-width:1100px){ .hduo-sec{contain-intrinsic-size:auto 22rem} .site-foot{contain-intrinsic-size:auto 69rem} }
@media (min-width:1101px){ .hduo-sec{contain-intrinsic-size:auto 16rem} .site-foot{contain-intrinsic-size:auto 35rem} }


/* ===== ОФОРМЛЕНИЕ v5: максимально строго =====
   Белый лист, тонкие нейтральные линии вместо цветных заливок, прямые углы (2 пкс), без теней и скруглённых «таблеток»,
   один акцент (тёмно-коричневый) для кнопок, ссылок и выбранных пунктов. Высококонтрастная схема не затрагивается. */
:root{ --gilt:#5E4329 }
:root[data-scheme="dark"]{ --gilt:#D8BC8A }
/* полосы страницы: белые, отделены линиями */
:root:not([data-scheme="contrast"]) .topbar{background:var(--bg); border-bottom:1px solid var(--line)}
:root:not([data-scheme="contrast"]) .site-head{background:var(--bg); border-bottom:1px solid var(--line-strong)}
:root:not([data-scheme="contrast"]) .site-foot{background:var(--foot-bg); color:var(--foot-ink); border-top:0}
:root:not([data-scheme="contrast"]) .visit{background:var(--bg); border-block:1px solid var(--line)}
:root:not([data-scheme="contrast"]) .page-head.pano, :root:not([data-scheme="contrast"]) .pano-head{background:var(--bg); border-bottom:1px solid var(--line)}
:root[data-scheme="light"] #hero, :root[data-scheme="dark"] #hero{background:var(--bg); color:var(--ink); border-bottom:1px solid var(--line); padding-bottom:1.6rem}
:root[data-scheme="light"] #hero .hero-kick, :root[data-scheme="dark"] #hero .hero-kick{color:var(--muted); font-weight:600; font-size:.8rem; letter-spacing:.06em; text-transform:uppercase}
:root[data-scheme="light"] #hero .hero-h1, :root[data-scheme="dark"] #hero .hero-h1{color:var(--ink)}
:root[data-scheme="light"] #hero .hero-alt, :root[data-scheme="light"] #hero .hero-text, :root[data-scheme="dark"] #hero .hero-alt, :root[data-scheme="dark"] #hero .hero-text{color:var(--muted)}
:root[data-scheme="light"] #hero .hero-search, :root[data-scheme="dark"] #hero .hero-search{background:var(--bg); border:1px solid var(--ink); border-radius:2px; box-shadow:none}
:root[data-scheme="light"] #hero .hero-search input, :root[data-scheme="dark"] #hero .hero-search input{color:var(--ink)}
:root[data-scheme="light"] #hero .hero-search input::placeholder, :root[data-scheme="dark"] #hero .hero-search input::placeholder{color:var(--muted)}
/* карточки, плитки и панели: белые, тонкая рамка, прямые углы */
:root:not([data-scheme="contrast"]) :is(.bl-card, .news-item, .expo-card, .cat-it, .br-info, .br-route, .vgrid li, .hdoc, .hcard, .bcard, .hub-card, .panel, .my-sec, .blk-feat, .blk-ph, .news-cover, .br-photo, .map-box, .map-slot, .tmap, .gis-map, .note){background:var(--bg); border-radius:2px; box-shadow:none}
:root:not([data-scheme="contrast"]) :is(.bl-card, .news-item, .expo-card, .cat-it, .br-info, .br-route, .vgrid li, .hdoc, .hcard, .bcard, .hub-card, .panel, .my-sec){border:1px solid var(--line)}
:root:not([data-scheme="contrast"]) :is(a.bl-card, .news-item, .expo-card, .cat-it, a.hub-card, a.hdoc, .vgrid li):hover{border-color:var(--ink)}
:root:not([data-scheme="contrast"]) :is(.news-cover, .br-photo){background:var(--soft)}
:root:not([data-scheme="contrast"]) img{border-radius:0}
/* плашки и типы документов: без заливки, тонкая рамка */
:root:not([data-scheme="contrast"]) .pill{background:transparent; color:var(--ink); border:1px solid var(--line-strong); border-radius:2px; font-weight:600}
:root:not([data-scheme="contrast"]) .cat-badge{border-radius:2px}
/* кнопки: прямоугольные, без теней */
:root:not([data-scheme="contrast"]) :is(.btn, .nav-cat, .foot-btn, .more-btn, .chip, .lang-btn, .nav-search, .menu-btn, .fab, .fab-fb, .skip, .cat-star, .cat-bar, .cat-act, .status, .theme-btn, .eye-btn, .icon-btn, .soc-btn, .tool-btn, .cookie-btn){border-radius:2px !important; box-shadow:none !important}
:root:not([data-scheme="contrast"]) .btn.ghost, :root:not([data-scheme="contrast"]) .btn.sm.ghost{background:var(--bg); color:var(--ink); border:1px solid var(--ink)}
:root:not([data-scheme="contrast"]) .btn.ghost:hover{background:var(--soft)}
:root:not([data-scheme="contrast"]) .status{background:transparent}
:root:not([data-scheme="contrast"]) .fab{background:var(--primary); color:var(--primary-ink)}
:root:not([data-scheme="contrast"]) .fab-fb{background:var(--bg); color:var(--ink); border:1px solid var(--ink)}
/* поля ввода */
:root:not([data-scheme="contrast"]) :is(input, select, textarea, .ffield, .cat-bar, .hero-search, #br-from){border-radius:2px; background:var(--bg); box-shadow:none}
:root:not([data-scheme="contrast"]) :is(input:not([type="checkbox"]):not([type="radio"]), select, textarea){border:1px solid var(--line-strong)}
:root:not([data-scheme="contrast"]) :is(.cat-bar, .hero-search){border:1px solid var(--ink)}
/* вкладки: выбранная подчёркнута линией цвета текста */
:root:not([data-scheme="contrast"]) :is(.hub-tabs [role="tab"], .mem-tabs a){border-radius:0}
:root:not([data-scheme="contrast"]) :is(.hub-tabs [role="tab"][aria-selected="true"], .mem-tabs a[aria-selected="true"]){box-shadow:inset 0 -2px 0 var(--ink); color:var(--ink)}
.site-nav a[aria-current="page"], .site-nav a.on{border-bottom-color:var(--ink)}
/* подписи-«колпачки»: мелкие прописные, нейтральные */
:root:not([data-scheme="contrast"]) :is(.kicker, .eyebrow, .v-l, .chips-l, .cat-grp-h){color:var(--muted); font-weight:600; font-size:.76rem; letter-spacing:.07em; text-transform:uppercase}
/* заголовки блоков: линия под ними */
:root:not([data-scheme="contrast"]) .tz-head h1{border-bottom:0}
/* подпись на крупной новости: сплошная тёмная полоса вместо градиента */
.blk-ov{background:rgba(18,16,14,.84); padding:.8rem 1.1rem .9rem}
/* код и таблицы: нейтральный светло-серый */
:root:not([data-scheme="contrast"]) code{background:var(--soft); border-radius:2px}
/* подвал: колонки отделены линиями, без цветных кнопок */
:root:not([data-scheme="contrast"]) .site-foot .foot-btns .btn, :root:not([data-scheme="contrast"]) .site-foot .foot-btn, :root:not([data-scheme="contrast"]) .site-foot li > a[href*="instagram"]{border-radius:2px; border:1px solid var(--foot-line); color:var(--foot-ink); background:transparent}

/* v5, уточнения: внутри обрамлённых полей поиска у самого input рамки нет (иначе двойная рамка); плашки по ширине текста; ссылки в заголовках чёрные; тонкая линия под заголовками блоков */
:root:not([data-scheme="contrast"]) :is(.cat-bar, .hero-search) input{border:0 !important; background:transparent; box-shadow:none}
:root:not([data-scheme="contrast"]) .pill{width:fit-content; max-width:100%; align-self:flex-start}
:root:not([data-scheme="contrast"]) main :is(h1, h2, h3, h4) a:not(.btn){color:inherit; text-decoration-color:var(--line-strong)}
:root:not([data-scheme="contrast"]) main :is(h1, h2, h3, h4) a:not(.btn):hover{text-decoration-color:var(--ink)}
:root:not([data-scheme="contrast"]) :is(.cell-head, .sec-head){position:relative}
:root:not([data-scheme="contrast"]) :is(.cell-head, .sec-head)::after{content:""; position:absolute; left:0; right:0; bottom:-.4rem; height:1px; background:var(--ink)}
:root:not([data-scheme="contrast"]) .page-head.pano, :root:not([data-scheme="contrast"]) .pano-head{padding-bottom:1rem}
:root:not([data-scheme="contrast"]) :is(.site-foot li > a, .rate-stars button){border-radius:2px}

/* v5, ещё уточнения: поиск в «Филиалах» (рамка у обёртки, не у поля); названия в плитках разделов; шапки страниц компактнее */
:root:not([data-scheme="contrast"]) .br-side .ffield input{border:0 !important; background:transparent}
:root:not([data-scheme="contrast"]) .hub-card b{font-family:var(--head); font-weight:700; color:var(--ink); font-size:1.12rem; line-height:1.25}
:root:not([data-scheme="contrast"]) .hub-card span{color:var(--muted)}
:root:not([data-scheme="contrast"]) .page-head.pano{padding-block:1.4rem .9rem; min-height:0}
:root:not([data-scheme="contrast"]) :is(.tz-head h1, .page-head.pano h1){font-size:clamp(2rem, 1rem + 2.6vw, 3rem); line-height:1.1}
:root:not([data-scheme="contrast"]) .page-head.pano:not(.has-img) .pano-in{padding-block:1.4rem 0}
:root:not([data-scheme="contrast"]) :is(#home-imp a, .br-list button){border-radius:2px}


/* ===== v6: вкладки и пункты меню при наведении плавно заливаются фоном =====
   Заливка «выезжает» снизу вверх (фон-градиент меняет высоту), цвет текста не меняется. Выбранная вкладка залита всегда и подчёркнута.
   Только для устройств с наведением (на телефоне иначе подсветка «залипала» бы после касания) и не для высококонтрастной схемы. */
:root{ --tab-fill:#EEE5D7; --tab-fill-on:#E7DCC8 }
:root[data-scheme="dark"]{ --tab-fill:#2C261F; --tab-fill-on:#383026 }
:root:not([data-scheme="contrast"]) :is(.site-nav a, .hub-tabs button, .mem-tabs a, .tabs button){
  background-color:transparent;
  background-image:linear-gradient(var(--tab-fill), var(--tab-fill));
  background-repeat:no-repeat; background-position:0 100%; background-size:100% 0;
  transition:background-size .26s cubic-bezier(.2,.7,.1,1), color .2s ease;
}
:root:not([data-scheme="contrast"]) :is(.site-nav a[aria-current="page"], .hub-tabs button[aria-selected="true"], .mem-tabs a[aria-selected="true"], .tabs button[aria-selected="true"]){
  background-image:linear-gradient(var(--tab-fill-on), var(--tab-fill-on)); background-size:100% 100%;
}
@media (hover:hover){
  :root:not([data-scheme="contrast"]) :is(.site-nav a, .hub-tabs button, .mem-tabs a, .tabs button):hover{background-size:100% 100%; text-decoration:none}
}
:root:not([data-scheme="contrast"]) :is(.site-nav a, .hub-tabs button, .mem-tabs a, .tabs button):focus-visible{background-size:100% 100%}
/* цвет текста при наведении не меняем (меняется только фон) */
:root:not([data-scheme="contrast"]) :is(.hub-tabs button, .mem-tabs a, .tabs button):hover{color:var(--ink)}
:root:not([data-scheme="contrast"]) .hub-tabs button[aria-selected="true"]:hover, :root:not([data-scheme="contrast"]) :is(.mem-tabs a, .tabs button)[aria-selected="true"]:hover{color:var(--ink)}
/* поля вкладок: чтобы заливка выглядела блоком, а не подсветкой слова */
@media (min-width:1200px){
  :root:not([data-scheme="contrast"]) .site-nav a{padding:0 .8rem}
  :root:not([data-scheme="contrast"]) .site-nav a::after{left:.8rem; right:.8rem}
  .site-nav{margin-inline:-.8rem !important}
}
:root:not([data-scheme="contrast"]) .hub-tabs{gap:0 .3rem}
:root:not([data-scheme="contrast"]) .hub-tabs button{padding:0 1rem}
:root:not([data-scheme="contrast"]) .hub-tabs button::after{left:0; right:0}
:root:not([data-scheme="contrast"]) .mem-tabs a, :root:not([data-scheme="contrast"]) .tabs button{border-radius:0}
@media (prefers-reduced-motion:reduce){ :root:not([data-scheme="contrast"]) :is(.site-nav a, .hub-tabs button, .mem-tabs a, .tabs button){transition:none} }

/* v6, продолжение: в главном меню прежние правила требуют !important; подменю разделов (.tz-sub) — тоже вкладки; при наведении вместо подчёркивания только заливка */
:root:not([data-scheme="contrast"]) .site-nav a{background-image:linear-gradient(var(--tab-fill), var(--tab-fill)) !important; background-repeat:no-repeat !important; background-position:0 100% !important; background-size:100% 0 !important}
:root:not([data-scheme="contrast"]) .site-nav a[aria-current="page"]{background-image:linear-gradient(var(--tab-fill-on), var(--tab-fill-on)) !important; background-size:100% 100% !important}
@media (hover:hover){ :root:not([data-scheme="contrast"]) .site-nav a:hover{background-size:100% 100% !important} }
:root:not([data-scheme="contrast"]) .site-nav a:focus-visible{background-size:100% 100% !important}
:root:not([data-scheme="contrast"]) .site-nav a:not([aria-current="page"]):hover::after{transform:scaleX(0)}
:root:not([data-scheme="contrast"]) .tz-sub{gap:.3rem .3rem; margin-top:.6rem}
:root:not([data-scheme="contrast"]) .tz-sub a{padding:.5rem .95rem; color:var(--ink); border-bottom:2px solid transparent; background-image:linear-gradient(var(--tab-fill), var(--tab-fill)); background-repeat:no-repeat; background-position:0 100%; background-size:100% 0; transition:background-size .26s cubic-bezier(.2,.7,.1,1)}
:root:not([data-scheme="contrast"]) .tz-sub a[aria-current]{background-image:linear-gradient(var(--tab-fill-on), var(--tab-fill-on)); background-size:100% 100%; border-bottom-color:var(--ink); font-weight:600}
@media (hover:hover){ :root:not([data-scheme="contrast"]) .tz-sub a:hover{background-size:100% 100%; color:var(--ink); border-bottom-color:transparent} :root:not([data-scheme="contrast"]) .tz-sub a[aria-current]:hover{border-bottom-color:var(--ink)} }
:root:not([data-scheme="contrast"]) .tz-sub a:focus-visible{background-size:100% 100%}
@media (prefers-reduced-motion:reduce){ :root:not([data-scheme="contrast"]) .tz-sub a{transition:none} }

/* v6, списки ссылок на главной («Новости» справа от крупной, «Важно»): при наведении строка тоже плавно заливается фоном, как вкладки.
   Поля у строк и обратный отступ у списка: текст остаётся на прежнем месте, а заливка выходит за него на 0,8 rem */
:root:not([data-scheme="contrast"]) :is(.blk-list a, .blk-imp a){
  background-image:linear-gradient(var(--tab-fill), var(--tab-fill)); background-repeat:no-repeat; background-position:0 100%; background-size:100% 0;
  transition:background-size .26s cubic-bezier(.2,.7,.1,1);
}
@media (hover:hover){ :root:not([data-scheme="contrast"]) :is(.blk-list a, .blk-imp a):hover{background-size:100% 100%; color:var(--ink)} }
:root:not([data-scheme="contrast"]) :is(.blk-list a, .blk-imp a):focus-visible{background-size:100% 100%}
:root:not([data-scheme="contrast"]) .blk-list a:hover b{text-decoration:none}
:root:not([data-scheme="contrast"]) .blk-list{margin-top:-.75rem}
:root:not([data-scheme="contrast"]) .blk-list a{padding:.75rem .8rem; margin-inline:-.8rem}
:root:not([data-scheme="contrast"]) .blk-list li:first-child a{padding-top:.75rem}
@media (min-width:1101px){ :root:not([data-scheme="contrast"]) .blk-imp a{padding:.6rem .8rem; margin-inline:-.8rem} }
@media (prefers-reduced-motion:reduce){ :root:not([data-scheme="contrast"]) :is(.blk-list a, .blk-imp a){transition:none} }

</style>
